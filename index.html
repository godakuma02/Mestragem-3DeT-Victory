<style>

    /* LAYOUT DA FICHA EM TELA CHEIA */
        .ficha-fullscreen {

<body>

<script>
const SKILLS = ['Animais', 'Arte', 'Esporte', 'Influência', 'Luta', 'Manha', 'Máquinas', 'Medicina', 'Mística', 'Percepção', 'Saber', 'Sobrevivência'];

const SKILL_DESCRIPTIONS = {
    'Animais': 'Permite lidar com animais, adestrar, cavalgar, acalmar criaturas selvagens e rastrear espécimes na natureza.',
    'Arte': 'Envolve expressão artística, música, atuação, dança, escrita, diplomacia estética e inspiração de aliados.',
    'Esporte': 'Testes de agilidade física, acrobacias, corrida, natação, salto, atletismo e manobras corporais.',
    'Influência': 'Usada para persuadir, intimidar, enganar, negociar ou liderar pessoas e grupos.',
    'Luta': 'Capacidade em combate corpo a corpo, artes marciais, uso de armas brancas e manobras de combate.',
    'Manha': 'Furtividade, prestidigitação, arrombamento, ocultar-se nas sombras e truques urbanos de rua.',
    'Máquinas': 'Operação, pilotagem, reparo, hackeamento, engenharia e modificação de veículos e tecnologia.',
    'Medicina': 'Tratamento de ferimentos, cura de doenças, primeiros socorros, diagnósticos e cirurgias.',
    'Mística': 'Conhecimento sobre magia, rituais ocultos, identificação de feitiços e energias sobrenaturais.',
    'Percepção': 'Capacidade de notar detalhes, evitar emboscadas, ouvir ruídos sutis e investigar pistas.',
    'Saber': 'Conhecimentos acadêmicos, história, ciências, geografia, mistérios e informações gerais.',
    'Sobrevivência': 'Rastreamento, orientar-se na natureza, caça, encontrar abrigo e resistir a climas severos.'
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random();

// ============================================================
// SUPABASE — inicialização
// ============================================================
const SUPABASE_URL = 'https://krjavqfgivkexffgejfs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyamF2cWZnaXZrZXhmZmdlamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NDQ4NzIsImV4cCI6MjEwOTIyMDg3Mn0.sHY5c-YQyo8u-Qlq9RDqkSyyzS4rEFuMsp7Xa59YAFE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const AVATAR_BUCKET = 'avatars';

// ============================================================
// ESTADO LOCAL (cache em memória — economiza egress)
// ============================================================
let db = { tables: [], selected: null };
let tab = 'personagens', selectedChar = null, session = null, selectedVehicle = null;
let activeSheetTab = 'principal';

const current = () => db.tables.find(t => t.id === db.selected);

// Fila de logs pendentes (chat)
let _logsPendentes = [];

// Último estado salvo por personagem (para diff)
const _ultimoEstadoSalvo = new Map(); // id -> { ficha, nome }

// ============================================================
// PRESENÇA (heartbeat)
// ============================================================
let _heartbeatTimer = null;
const HEARTBEAT_MS = 60000;
const ONLINE_THRESHOLD_MS = 130000;
function estaOnline(iso) {
    if (!iso) return false;
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return false;
    return (Date.now() - t) < ONLINE_THRESHOLD_MS;
}
async function baterPonto() {
    if (!session || session.role !== 'jogador') return;
    if (document.visibilityState !== 'visible') return;
    if (!session.personagemId) return;
    try {
        await supabaseClient.from('personagens')
            .update({ ultima_atualizacao: new Date().toISOString() })
            .eq('id', session.personagemId);
    } catch (_) {}
}
function iniciarHeartbeat() {
    if (_heartbeatTimer) clearInterval(_heartbeatTimer);
    baterPonto();
    _heartbeatTimer = setInterval(() => {
        if (document.visibilityState === 'visible') baterPonto();
    }, HEARTBEAT_MS);
}
function pararHeartbeat() {
    if (_heartbeatTimer) { clearInterval(_heartbeatTimer); _heartbeatTimer = null; }
}
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && session) baterPonto();
});

// ============================================================
// DIFF DE FICHA (envia só o que mudou)
// ============================================================
function comprimirDados(obj) {
    if (!obj || typeof obj !== 'object') return obj;
    if (Array.isArray(obj)) return obj.map(comprimirDados);
    const novo = {};
    for (const [k, v] of Object.entries(obj)) {
        if (v === undefined || v === null) continue;
        novo[k] = typeof v === 'object' ? comprimirDados(v) : v;
    }
    return novo;
}
function diffFicha(antigo, novo, path = 'ficha') {
    const out = {};
    if (!antigo || typeof antigo !== 'object') return { [path]: novo };
    if (Array.isArray(novo)) {
        if (JSON.stringify(antigo) !== JSON.stringify(novo)) out[path] = novo;
        return out;
    }
    if (novo === null || typeof novo !== 'object') {
        if (antigo !== novo) out[path] = novo;
        return out;
    }
    const chaves = new Set([...Object.keys(antigo || {}), ...Object.keys(novo || {})]);
    for (const k of chaves) {
        Object.assign(out, diffFicha(antigo ? antigo[k] : undefined, novo ? novo[k] : undefined, `${path}/${k}`));
    }
    return out;
}
function setDeep(obj, path, value) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
        const k = parts[i];
        if (!cur[k] || typeof cur[k] !== 'object') cur[k] = {};
        cur = cur[k];
    }
    cur[parts[parts.length - 1]] = value;
}

// ============================================================
// SALVAMENTO (debounce 3s + diff + sem request se só timestamp mudou)
// ============================================================
let _saveTimer = null;
function save() {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => { _salvarTudo(); }, 3000);
    const statusEl = document.getElementById('status');
    if (statusEl) statusEl.textContent = 'Alterações pendentes…';
}

async function _salvarTudo() {
    const statusEl = document.getElementById('status');
    try {
        // 1) Personagem atual — por DIFF
        if (selectedChar && session) {
            const mesa = current();
            const char = mesa?.characters?.find(c => c.id === selectedChar);
            if (char) {
                const { id, _ultimaAtualizacao, accessCode, npc, ...fichaLimpa } = char;
                const nomeAtual = char.name || 'Personagem';
                const anterior = _ultimoEstadoSalvo.get(id);
                let updates;
                if (!anterior) {
                    updates = { 'ficha': comprimirDados(fichaLimpa), 'nome': nomeAtual };
                } else {
                    updates = diffFicha(anterior.ficha, comprimirDados(fichaLimpa));
                    if (anterior.nome !== nomeAtual) updates['nome'] = nomeAtual;
                }
                if (Object.keys(updates).length === 0) {
                    if (statusEl) statusEl.textContent = 'Sem alterações • ' + new Date().toLocaleTimeString('pt-BR');
                    return;
                }
                // Aplica o diff campo a campo via update() dedicado
                const payload = {};
                for (const [k, v] of Object.entries(updates)) {
                    if (k === 'ficha') payload.ficha = v;
                    else if (k === 'nome') payload.nome = v;
                    else if (k.startsWith('ficha/')) {
                        if (!payload.ficha) payload.ficha = structuredClone(anterior?.ficha || {});
                        setDeep(payload.ficha, k.slice(6), v);
                    }
                }
                payload.ultima_atualizacao = new Date().toISOString();
                const { error } = await supabaseClient
                    .from('personagens')
                    .update(payload)
                    .eq('id', char.id);
                if (error) throw error;
                _ultimoEstadoSalvo.set(id, { ficha: comprimirDados(fichaLimpa), nome: nomeAtual });
            }
        }
        // 2) Logs pendentes (lote)
        if (_logsPendentes.length > 0) {
            const lote = _logsPendentes.splice(0, _logsPendentes.length);
            const { error } = await supabaseClient.from('rolagens').insert(lote);
            if (error) throw error;
        }
        if (statusEl) statusEl.textContent = 'Salvo • ' + new Date().toLocaleTimeString('pt-BR');
    } catch (e) {
        if (statusEl) statusEl.textContent = 'Erro ao salvar: ' + e.message;
        console.error('Erro no salvamento:', e);
    }
}

// ============================================================
// LOADERS
// ============================================================
async function carregarMesas() {
    const { data, error } = await supabaseClient
        .from('mesas')
        .select('pin, nome, mestre_nome, regras, criada_em')
        .order('criada_em', { ascending: true });
    if (error) { console.error('carregarMesas:', error); return; }
    const mesasExistentes = new Map(db.tables.map(t => [t.id, t]));
    db.tables = (data || []).map(m => {
        const existente = mesasExistentes.get(m.pin);
        return {
            id: m.pin,
            name: m.nome,
            accessCode: m.pin,
            masterName: m.mestre_nome,
            regras: m.regras || {},
            characters: existente?.characters || [],
            notes: existente?.notes || '',
            logs: existente?.logs || []
        };
    });
    if (db.selected && !db.tables.find(t => t.id === db.selected)) db.selected = null;
    if (!db.selected && db.tables.length) db.selected = db.tables[0].id;
}

async function carregarPersonagens(mesaPin) {
    if (!mesaPin) return;
    // SELECT enxuto: só o necessário para a grid e para o diff
    const { data, error } = await supabaseClient
        .from('personagens')
        .select('id, codigo, nome, is_npc, ficha, ultima_atualizacao')
        .eq('mesa_pin', mesaPin);
    if (error) { console.error('carregarPersonagens:', error); return; }
    const mesa = db.tables.find(t => t.id === mesaPin);
    if (!mesa) return;
    mesa.characters = (data || []).map(p => {
        const ficha = (p.ficha && typeof p.ficha === 'object') ? p.ficha : {};
        return {
            ...ficha,
            id: p.id,
            name: p.nome,
            npc: p.is_npc === true,
            accessCode: p.codigo,
            _ultimaAtualizacao: p.ultima_atualizacao
        };
    });
    // Popula o cache de diff com o estado carregado
    for (const c of mesa.characters) {
        const { id, _ultimaAtualizacao, accessCode, npc, ...fichaLimpa } = c;
        _ultimoEstadoSalvo.set(id, { ficha: comprimirDados(fichaLimpa), nome: c.name });
    }
}

let _chatChannel = null;
function _pararChatRealtime() {
    if (_chatChannel) {
        try { supabaseClient.removeChannel(_chatChannel); } catch (_) {}
        _chatChannel = null;
    }
}
// Fingerprint das mensagens locais recém-enviadas (evita duplicar via realtime)
const _msgsLocais = [];
function _registrarMsgLocal(texto, jogador) {
    _msgsLocais.push({ chave: `${jogador}::${texto}`, ts: Date.now() });
    if (_msgsLocais.length > 20) _msgsLocais.shift();
}
function _foiEnviadaLocalmente(texto, jogador) {
    const agora = Date.now();
    for (let i = _msgsLocais.length - 1; i >= 0; i--) {
        if (agora - _msgsLocais[i].ts > 8000) _msgsLocais.splice(i, 1);
    }
    return _msgsLocais.some(m => m.chave === `${jogador}::${texto}`);
}

async function carregarChat(mesaPin) {
    if (!mesaPin) return;
    _pararChatRealtime();
    // 1) Carga inicial única (10 mensagens)
    const { data, error } = await supabaseClient
        .from('rolagens')
        .select('id, jogador_nome, texto, secreta, criada_em')
        .eq('mesa_pin', mesaPin)
        .order('criada_em', { ascending: false })
        .limit(10);
    if (error) { console.error('carregarChat:', error); return; }
    const mesa = db.tables.find(t => t.id === mesaPin);
    if (!mesa) return;
    mesa.logs = (data || []).reverse().map(r => ({
        id: String(r.id),
        when: r.criada_em,
        message: r.texto,
        jogador: r.jogador_nome,
        secreta: r.secreta === true
    }));
    // 2) Realtime: só INSERT, adiciona localmente sem SELECT
    const chName = `chat-${mesaPin}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    _chatChannel = supabaseClient
        .channel(chName)
        .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'rolagens', filter: `mesa_pin=eq.${mesaPin}` },
            (payload) => {
                const nova = payload.new;
                if (!nova) return;
                const mesaAtual = db.tables.find(t => t.id === mesaPin);
                if (!mesaAtual) return;
                if (mesaAtual.logs.some(l => l.id === String(nova.id))) return;
                if (_foiEnviadaLocalmente(nova.texto, nova.jogador_nome)) return;
                mesaAtual.logs.push({
                    id: String(nova.id),
                    when: nova.criada_em,
                    message: nova.texto,
                    jogador: nova.jogador_nome,
                    secreta: nova.secreta === true
                });
                if (mesaAtual.logs.length > 20) mesaAtual.logs.shift();
                if (mesaAtual.id === db.selected) render();
            }
        )
        .subscribe();
}

function requireMaster() {
    if (session?.role !== 'mestre') {
        alert('Ação reservada ao mestre/gerenciador.');
        return false;
    }
    return true;
}

async function newTable() {
    if (!requireMaster()) return;
    const nome = prompt('Nome da mesa:', 'Nova campanha');
    if (!nome?.trim()) return;
    const pin = String(Math.floor(100000 + Math.random() * 900000));
    const { error } = await supabaseClient.from('mesas').insert({
        pin, nome: nome.trim(), mestre_nome: session.name
    });
    if (error) return alert('Erro: ' + error.message);
    session.mesaPin = pin;
    db.selected = pin;
    await carregarMesas();
    await carregarPersonagens(pin);
    render();
}

async function chooseTable(id) {
    _pararChatRealtime();
    db.selected = id;
    selectedChar = null;
    await carregarPersonagens(id);
    await carregarChat(id);
    render();
}

async function renameTable() {
    if (!requireMaster()) return;
    const t = current(); if (!t) return;
    const novo = prompt('Novo nome da mesa:', t.name);
    if (!novo?.trim()) return;
    const { error } = await supabaseClient.from('mesas').update({ nome: novo.trim() }).eq('pin', t.id);
    if (error) return alert('Erro: ' + error.message);
    await carregarMesas();
    render();
}

async function deleteTable() {
    if (!requireMaster()) return;
    const t = current(); if (!t) return;
    if (!confirm('Excluir a mesa e todos os personagens?')) return;
    const { error } = await supabaseClient.from('mesas').delete().eq('pin', t.id);
    if (error) return alert('Erro: ' + error.message);
    session.mesaPin = null;
    db.selected = null;
    await carregarMesas();
    if (db.tables.length) {
        db.selected = db.tables[0].id;
        session.mesaPin = db.selected;
        await carregarPersonagens(db.selected);
        await carregarChat(db.selected);
    }
    render();
}

async function cloneChar(id) {

    const codigo = String(Math.floor(100000 + Math.random() * 900000));

    delete fichaCopia.id;
    delete fichaCopia._ultimaAtualizacao;
    const { error } = await supabaseClient.from('personagens').insert({
        mesa_pin: db.selected,
        codigo,
        nome: fichaCopia.name,
        is_npc: c.npc === true,

    await carregarPersonagens(db.selected);

function update(id, key, value) {
    let c = current()?.characters.find(x => x.id === id);
    if (!c && currentVehicle()?.id === id) c = currentVehicle();
    if (!c) return;
    if (['p', 'h', 'r', 'xp'].includes(key)) {
        c[key] = Math.max(0, Number(value) || 0);
    } else if (key.includes('.')) {
        const parts = key.split('.');
        let obj = c;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!obj[parts[i]]) obj[parts[i]] = {};
            obj = obj[parts[i]];
        }
        obj[parts[parts.length - 1]] = value;
    } else {
        c[key] = value;
    }
    save();
    if (['p', 'h', 'r'].includes(key)) render();
}

async function comprimirImagem(file, maxLado = 256, qualidade = 0.55) {
    if (!file) return null;
    const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(file);
    });
    const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = dataUrl;
    });
    let { width, height } = img;
    if (width > maxLado || height > maxLado) {
        const ratio = Math.min(maxLado / width, maxLado / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    return await new Promise(res => canvas.toBlob(res, 'image/jpeg', qualidade));
}

async function uploadAvatar(file) {
    if (!file) return null;
    try {
        const blob = await comprimirImagem(file);
        if (!blob) return null;
        const pasta = session?.personagemId || session?.name || 'anon';
        const nomeArq = `${pasta}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
        const { data, error } = await supabaseClient.storage
            .from(AVATAR_BUCKET)
            .upload(nomeArq, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: true });
        if (error) { console.error('upload avatar:', error); alert('Falha no upload: ' + error.message); return null; }
        const { data: urlData } = supabaseClient.storage.from(AVATAR_BUCKET).getPublicUrl(data.path);
        return urlData.publicUrl;
    } catch (e) {
        console.error('uploadAvatar:', e);
        return null;
    }
}

async function apagarAvatarAntigo(url) {
    if (!url || typeof url !== 'string') return;
    if (!url.includes(`/storage/v1/object/public/${AVATAR_BUCKET}/`)) return;
    try {
        const m = url.match(new RegExp(`/${AVATAR_BUCKET}/(.+)$`));
        if (!m) return;
        await supabaseClient.storage.from(AVATAR_BUCKET).remove([m[1]]);
    } catch (_) {}
}

function setCharPhoto(id, input) {
    const c = current()?.characters.find(x => x.id === id) || currentVehicle();
    if (!c) return;
    const file = input.files[0]; if (!file) return;
    const statusEl = document.getElementById('status');
    if (statusEl) statusEl.textContent = 'Enviando imagem…';
    const fotoAntiga = c.photo || '';
    // Pré-visualização instantânea (sem ir ao banco)
    const previewUrl = URL.createObjectURL(file);
    c.photo = previewUrl; render();
    uploadAvatar(file).then(async (novaUrl) => {
        URL.revokeObjectURL(previewUrl);
        if (!novaUrl) {
            c.photo = fotoAntiga;
            if (statusEl) statusEl.textContent = 'Falha ao enviar imagem — verifique o bucket "avatars" no Supabase';
            render();
            return;
        }
        c.photo = novaUrl;
        save();
        render();
        if (fotoAntiga && fotoAntiga !== novaUrl) await apagarAvatarAntigo(fotoAntiga);
        if (statusEl) statusEl.textContent = 'Foto atualizada • ' + new Date().toLocaleTimeString('pt-BR');
    });
    input.value = '';
}

function clearCharPhoto(id) {
    const c = current()?.characters.find(x => x.id === id) || currentVehicle();
    if (!c) return;
    const antiga = c.photo || '';
    c.photo = ''; save(); render();
    if (antiga) apagarAvatarAntigo(antiga);
}

function maxResource(c, key) { return Math.max(1, (key === 'pa' ? c.p : key === 'pm' ? c.h : c.r) * (key === 'pa' ? 1 : 5)); }
function valueResource(c, key) { return c[key] === null || c[key] === undefined ? maxResource(c, key) : c[key]; }

function adjust(id, key, delta) {
    let c = current()?.characters.find(x => x.id === id);
    if (!c && currentVehicle()?.id === id) c = currentVehicle();
    if (!c) return;
    c[key] = Math.max(0, Math.min(maxResource(c, key), valueResource(c, key) + delta));
    save(); render();
}

function setResource(id, key, value) {
    let c = current()?.characters.find(x => x.id === id);
    if (!c && currentVehicle()?.id === id) c = currentVehicle();
    if (!c) return;
    c[key] = Math.max(0, Math.min(maxResource(c, key), Number(value) || 0));
    save(); render();
}

function logMessage(message) {
    const mesa = current();
    if (!mesa) return;
    const jogador = session?.name || 'Jogador';
    const entry = {
        id: uid(),
        when: new Date().toISOString(),
        message,
        jogador,
        secreta: false
    };
    mesa.logs.push(entry);
    if (mesa.logs.length > 20) mesa.logs.shift();
    _registrarMsgLocal(message, jogador);
    _logsPendentes.push({
        mesa_pin: mesa.id,
        personagem_id: selectedChar || null,
        jogador_nome: jogador,
        texto: message,
        secreta: false
    });
    save();
    render();
}

function roll(n) { return Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6)); }

function doRoll() {
    let c = current()?.characters.find(x => x.id === selectedChar);
    if (!c && currentVehicle()) c = currentVehicle();
    if (!c) return alert('Selecione uma ficha ativa.');
    let a = document.getElementById('rollAttr').value;
    let skill = document.getElementById('rollSkill').value;
    let bonus = Number(document.getElementById('rollBonus').value) || 0;
    let gain = Number(document.getElementById('rollGain').value) || 0;
    let loss = Number(document.getElementById('rollLoss').value) || 0;
    let meta = Number(document.getElementById('rollMeta').value) || 0;
    let critStart = Number(document.getElementById('rollCritStart').value) || 6;
    let critEnd = Number(document.getElementById('rollCritEnd').value) || 6;
    if (critStart > critEnd) [critStart, critEnd] = [critEnd, critStart];

    let base = skill === '__none__' ? 2 : 1 + (skill && c.skills.includes(skill) ? 1 : 0);
    let net = Math.max(-1, Math.min(1, gain - loss));
    let n = Math.max(1, Math.min(3, base + net));
    let dice = roll(n);
    let crit = dice.filter(x => x >= critStart && x <= critEnd).length;
    let total = dice.reduce((x, y) => x + y, 0) + Number(c[a]) + bonus + crit * Number(c[a]);
    let result = meta ? (total >= meta ? 'SUCESSO' : 'FALHA') : 'sem meta';
    logMessage(`${c.name}: ${a.toUpperCase()}${skill && skill !== '__none__' ? ' / ' + skill : ''} | ${n}D [${dice.join(', ')}] + Atributo ${c[a]} + Mod ${bonus} + Crít ${crit} = ${total} | ${result}${meta ? ' (meta ' + meta + ')' : ''}`);
    document.getElementById('rollSkill').value = skill;
    document.getElementById('rollBonus').value = bonus;
    document.getElementById('rollGain').value = gain;
    document.getElementById('rollLoss').value = loss;
    document.getElementById('rollMeta').value = meta;
    document.getElementById('rollCritStart').value = critStart;
    document.getElementById('rollCritEnd').value = critEnd;
}

    let a = document.createElement('a');
    a.href = url; a.download = '3det-victory-backup.json'; a.click();

}

async function importData(ev) {
    let f = ev.target.files[0]; if (!f) return;
    try {
        let d = JSON.parse(await f.text());
        if (!Array.isArray(d.tables)) throw Error('Formato inválido');
        db = d; db.selected = db.tables[0]?.id || null; save(); render();
    } catch (e) {
        alert('Erro ao importar: ' + e.message);
    } finally {
        ev.target.value = '';
    }
}

function field(c, key, label, type = 'text') {
    const value = key.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : ''), c);
    return `<div class="field"><label>${label}</label><input type="${type}" value="${esc(value)}" onchange="update('${c.id}','${key}',this.value)"></div>`;
}
function area(c, key, label) { return `<div class="field"><label>${label}</label><textarea onchange="update('${c.id}','${key}',this.value)">${esc(c[key])}</textarea></div>`; }
function resource(c, key, label) { return `<div class="card" style="min-width:140px;text-align:center"><h3>${label}</h3><strong>${valueResource(c, key)} / ${maxResource(c, key)}</strong><div class="counter" style="justify-content:center;margin-top:10px"><button onclick="adjust('${c.id}','${key}',-1)">−</button><input type="number" value="${valueResource(c, key)}" onchange="setResource('${c.id}','${key}',this.value)"><button onclick="adjust('${c.id}','${key}',1)">+</button></div></div>`; }
