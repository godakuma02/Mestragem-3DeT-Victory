 Perda, inclusive testes de defesa. Além disso, todas as suas vantagens gastam\no dobro de PM.\nA Fúria termina quando você ou seu oponente é derrotado, ou caso o\noponente consiga fugir. Você então fica imediatamente esgotado (seus PM\ncaem para zero e você tem Perda em todos os testes até descansar).","page":70},{"name":"Inapto","cost":"–1pt","points":-1,"description":"Escolha uma perícia que não possua. Você é um completo incompetente quando se trata dela.\nSempre que o mestre pede um teste com a perícia escolhida, você está\nem Perda. Além disso, qualquer falha é considerada uma falha crítica (como\nse todos os resultados fossem 1).\nAgora, se além de tudo isso você rolar mesmo uma falha crítica... Ok,\nquanto menos se falar sobre isso, melhor.","page":70},{"name":"Ambiente","cost":"–1pt","points":-1,"description":"Você é mais acostumado a certo ambiente: água, clima muito quente\nou gelado, atmosfera de metano, shopping, home theater, fliperama, cozi-\n\nnha de restaurante totalmente equipada, ou outro lugar/clima/terreno que\nnão existe em abundância no local da campanha.\nNo início de cada cena, role 1D. Com um resultado 1, nada relacionado\na seu ambiente existe ali, e você tem Perda em todos os testes.\nO mestre pode julgar situações especiais e dispensar a rolagem. Por\nexemplo, quando seu Ambiente é água e vocês estão em uma cidade submersa (neste caso, seria impossível não existir água na cena). Da mesma\nforma, se o grupo viaja pelo deserto, não haveria qualquer água — e nem\nnecessidade de rolar o dado.","page":65},{"name":"Amnésia","cost":"–2pt","points":-2,"description":"Você não sabe quem é. Talvez seja um espião que sofreu lavagem cerebral, ou um androide com dados apagados, ou algum grande trauma tirou\nsua memória.\nSe você decide ter esta desvantagem, o mestre faz sua ficha em segredo. Você pode tentar fazer coisas, e o mestre diz se conseguiu ou não — sem\njamais dizer se você tem mesmo a perícia ou vantagem. Você pode ter Ganho ou Perda em testes sem saber a razão. Ainda, o mestre pode escolher\nrolar seus testes secretamente, apenas anunciando os resultados. Não vale\nperguntar! Você pode acabar descobrindo coisas por tentativa e erro, mas\nsuas completas capacidades e limitações devem permanecer um mistério.","page":66},{"name":"Antipático","cost":"–1pt","points":-1,"description":"Você não consegue (ou não quer) se expressar bem. Pode ser por timidez, deselegância, orgulho, rabugice, aura de energia sinistra, ou você é\napenas um baita chato!\nQuando faz um teste de Poder envolvendo interação social, você tem\nPerda e nunca tem acertos críticos.\nVocê não pode ser Antipático e também Carismático.","page":67},{"name":"Atrapalhado","cost":"–1pt","points":-1,"description":"Você se atrapalha com facilidade. Quando faz um teste de Habilidade envolvendo coordenação e agilidade, você tem Perda e nunca tem\nacertos críticos.\nVocê não pode ser Atrapalhado e também Ágil.","page":67},{"name":"Aura","cost":"–1ou -2pt","points":-1,"description":"Você emana uma aura pesada de energia negativa, estática eletromagnética, karma ruim, mau-cheiro, ou pura uruca. Qualquer um pode senti-la\ne perceber que você é a fonte, causando Perda em testes sociais.\n–1pt Qualquer teste de outras pessoas realizado Perto de você, seja de\naliados ou inimigos, tem Perda.\n–2pt Qualquer teste Longe de você ou menos.\n“Ah, não me afeta, não é problema meu, vou pegar.” Tenta aí, fera! Boa\nsorte tentando jogar este jogo de equipe.","page":67},{"name":"Bateria","cost":"–1pt","points":-1,"description":"Você tem uma reserva de energia para permanecer ativo. Sempre que\n1 ficar com 0PM você “desliga”, ficando inconsciente e indefeso.\nAlém disso, quando está com pouco PM (abaixo de sua H), sua bateria\nestá fraca e todos os seus testes têm Perda.","page":67},{"name":"Código","cost":"–1pt cada","points":-1,"description":"Você segue um código de conduta que o impede de fazer (ou deixar de\nfazer) alguma coisa.\nSempre que violar seu código, a culpa o deixará com Perda em todos\nos testes, até que consiga se redimir de alguma forma (compensando o mal\nque causou, ou cumprindo o código na próxima oportunidade).\n• 1a Lei de Asimov. Jamais causar mal a um ser humano ou, por omissão,\npermitir que um humano sofra qualquer mal.\n• 2a Lei de Asimov. Sempre obedecer a seres humanos, exceto quando suas\nordens violam outro Código que você tenha.\n• Código do Caçador. Nunca matar (apenas derrotar) filhotes ou gestantes.\nNunca abandonar uma caça abatida. Sempre escolher como oponente o\ninimigo mais perigoso na cena. Nunca permitir a fuga de um oponente.\n• Código do Combate. Nunca atacar um oponente em condição desfavorável\n(em Perda) ou de escala inferior.\n• Código da Derrota. Nunca seguir lutando depois de derrotado. Aceitar\nqualquer condição do vitorioso, que pode ser dever um favor, tornar-se\nseu servo/aliado, ou tirar sua vida.\n• Código da Gratidão. Sempre que alguém presta um grande favor (como\nsalvar sua vida, libertá-lo de um cativeiro...) a você ou um ente querido\nseu, você fica a serviço dessa pessoa até conseguir devolver o\nfavor (salvar sua vida, libertá-la da mesma forma...).\n• Código dos Heróis. Sempre cumprir sua palavra, sempre proteger qualquer pessoa\nou criatura mais fraca que você, jamais\nrecusar um pedido de ajuda.\n• Código da Honestidade. Nunca mentir,\nroubar, trapacear ou desobedecer\nàs leis locais, nem permitir que\nseus companheiros o façam.\n• Código da Redenção. Nunca atacar primeiro, sempre aceitar um\npedido de rendição, sempre poupar oponentes derrotados.\nVocê pode ter mais de um Código.","page":68},{"name":"Dependência","cost":"–2pt","points":-2,"description":"O personagem depende de algo raro,\nproibido ou desumano para viver. Pode ser\num vampiro que bebe sangue, um zumbi\nque devora cérebros, ou um viciado em alguma substância ilícita — quase sempre será algo que envolve crime grave.\nA Dependência deve ser satisfeita todos os dias. Se não o fizer, o personagem tem Perda em todos os testes, até que ele satisfaça a Dependência.\nEsta desvantagem é para vilões NPCs. Não é para você. Não se meta a besta.","page":68},{"name":"Diferente","cost":"–1pt","points":-1,"description":"Seu corpo é muito diferente de um corpo humanoide comum. Muito maior,\nmenor, com membros a mais, ou em lugares incomuns, ou outro motivo. Você\ntem problemas para usar as armas, roupas, equipamentos, máquinas e veículos\ndisponíveis — pode usar apenas aqueles feitos especialmente para você.\nO inverso também é válido: coisas feitas para você não servem bem\npara outros personagens. Pertences escolhidos durante a criação do personagem (Relíquia, Utensílio...) são feitos para você.\nSe você recebe esta desvantagem por ser membro de uma espécie fantástica (goblin, hynne, ogro...), então pode usar itens feitos para membros\nda mesma raça.\nVocê tem Perda ao usar itens feitos para outros. Por outro lado, o mestre pode decidir que seu corpo é vantajoso em algumas situações — um\npequeno goblin teria mais facilidade para agir furtivamente com um teste\nde Manha. Nestes casos especiais, você pode até receber Ganho.","page":69},{"name":"Elo Vital","cost":"–1pt","points":-1,"description":"Escolha um aliado, que também deve ter esta desvantagem. Sempre que\num de vocês sofre dano, o outro também perde PV na mesma quantidade.\nSe os personagens pertencem a escalas diferentes, o dano é ajustado\nde forma proporcional. Como quando um robô gigante recebe dano e seu\npiloto também fica ferido.\nO contrário não é verdadeiro: curar um não cura o outro.","page":69},{"name":"Fracote","cost":"–1pt","points":-1,"description":"Você é fraco, falta ódio... e força.\nAo fazer um teste de Poder envolvendo esforço físico, como para mover\numa pedra ou derrubar uma porta, você tem Perda e nunca tem acertos críticos.\nVocê não pode ser Fracote e também Forte.","page":69},{"name":"Frágil","cost":"–1pt","points":-1,"description":"Você tem pouco vigor físico. Ao fazer um teste de Resistência envolvendo saúde física, como para resistir doenças, venenos e testes de morte,\nvocê tem Perda e nunca tem acertos críticos.\nVocê não pode ser Frágil e também Vigoroso.","page":69},{"name":"Fraqueza","cost":"–1ou -2pt","points":-1,"description":"Existe um objeto, elemento ou condição à qual você é especialmente vulnerável. Enquanto você estiver Perto dessa coisa, todos os seus testes têm Perda.\nO valor da desvantagem depende de quão comum é a fonte da Fraqueza: \n• Incomum (-1pt). A Fraqueza é algo que aparece raramente (1 em 1D). Livros. Espelhos. Gatos. Objetos de bronze. Cor roxa. Gente de chapéu.\nAquela pedra verde brilhante.\n• Comum (-2pt). A Fraqueza é algo que aparece mais frequentemente (1-3 em\n1D). Lugares escuros (ou iluminados). Vento. Água. Plantas. Cor vermelha.","page":69},{"name":"Inculto","cost":"–1pt","points":-1,"description":"Você não tem familiaridade com a cultura local. Talvez seja estrangeiro\n(alienígena?), tenha acabado de chegar de uma Convergência, não recebeu\neducação própria, é muito ingênuo, ou literalmente nasceu ontem.\nVocê não sabe ler a língua local, ou acha muito difícil fazê-lo (teste Difícil).\nVocê tem a mesma dificuldade para se comunicar, exceto com seus aliados — e\nmesmo para eles o mestre pode, às vezes, pedir testes para entendê-lo.\nTestes sociais com personagens que não o entendem têm Perda.","page":71},{"name":"Indeciso","cost":"–1pt","points":-1,"description":"Você tem pouca convicção e muita dificuldade para tomar decisões importantes. Em testes de Resistência envolvendo força de vontade, você tem\nPerda e nunca tem acertos críticos.\nVocê não pode ser Indeciso e também Resoluto.","page":71},{"name":"Infame","cost":"–1pt","points":-1,"description":"Você é muito conhecido, mas não por uma boa razão. Quando faz testes sociais relacionados a um NPC que o reconhece (normalmente 1-4 em\n1D), você está sempre em Perda.\nVocê não pode ser Infame e também Famoso.","page":71},{"name":"Lento","cost":"–1pt","points":-1,"description":"Você se move devagar. Em testes de iniciativa, está sempre em Perda, e\ntambém gasta um movimento a mais para cruzar cada distância.\nVocê não pode ser Lento e também ter Aceleração.","page":71},{"name":"Maldição","cost":"–1ou -2pt","points":-1,"description":"Você é vítima de uma maldição que o perturba quase o tempo inteiro.\nA natureza e efeito exatos podem ser inventados por você, mas devem ser\nautorizados pelo mestre.\n–1pt A Maldição é suave, mais irritante ou constrangedora que qualquer outra coisa. Por exemplo, um bicho mágico chato o persegue. Suas\nvantagens só funcionam quando você tira a roupa. Você muda de sexo\nquando molhado com água fria/quente. Normalmente não tem efeito em\nregras, mas em alguns casos pode distraí-lo e causar Perda.\n–2pt A Maldição é muito grave, desafiadora. Por exemplo, sempre que\nvocê causa dano a alguém, recebe o mesmo dano de volta. Em testes de um\natributo escolhido pelo mestre, todas as suas falhas são falhas críticas. Você\nnunca pode curar PV exceto com descanso. Um monstro o ataca todas as\nnoites enquanto você dorme.","page":71},{"name":"Monstruoso","cost":"–1pt","points":-1,"description":"Você tem uma aparência grotesca, que causa repulsa àqueles que podem\nvê-lo. Outros personagens estão sempre de prontidão contra você: exceto\nquando os pega de surpresa, você sempre tem Perda em testes de iniciativa. \n\nVocê também tem Perda em testes sociais que envolvem aparência.\nVocê não pode ser Monstruoso e também Inofensivo.","page":71},{"name":"Munição","cost":"–1pt","points":-1,"description":"Sua arma ou técnica exige algum tipo de recarga cada vez que é utilizada. Podem ser balas, flechas e outros projéteis, ou sua própria energia\nki, ou poder mental para outro lance de xadrez, ou recuperar o fôlego para\noutra baforada de fogo ou torrente de palavrões.\nSempre que você usa uma ação para atacar, precisa usar um movimento para recarregar. Se fizer um ataque sem recarregar, você não soma seu\nPoder ao teste de ataque, nem pode somá-lo novamente em críticos.","page":72},{"name":"Pacifista","cost":"–1ou -2pt","points":-1,"description":"Você rejeita conflito e violência.\n–1pt Você não se envolve em combate violento. Quando atacado, você\npode se defender, mas não fazer testes de ataque. Você ainda pode reduzir\nPV e derrotar seus oponentes de outras formas (veja em Luta Não é Tudo).\n–2pt Você não faz absolutamente nada que cause dano — até mesmo\nferir com palavras é violento e ofensivo demais para você!\nSe violar seu pacifismo, a culpa o deixará em Perda até que você consiga se redimir de alguma forma.","page":73},{"name":"Pobreza","cost":"–1pt","points":-1,"description":"Você não tem recursos financeiros e, por qualquer razão, tende a não\nconseguir acumulá-los de nenhuma maneira. Todos os seus testes de compra são feitos em Perda.\nVocê não pode ter Pobreza e também Riqueza.","page":73},{"name":"Ponto Fraco","cost":"–1pt","points":-1,"description":"Você tem uma característica que seu adversário pode explorar. Pode\nser um desequilíbrio em sua postura de luta, um tique nervoso, uma falha\nem sua linha de raciocínio, ou você perde as estribeiras sempre que alguém\nmenciona aquele incidente passado...\nSeu Ponto Fraco pode ser descoberto por alguém que já tenha visto\nvocê em ação, ou por Telepatia, ou ser conhecido por todos se você é Famoso ou Infame. Um teste resistido de Percepção contra a perícia que você\nestá usando também permite descobrir.\nQualquer adversário que conhece seu Ponto Fraco pode gastar 1PM\npara ter Ganho contra você em um teste que explora esse problema.","page":73},{"name":"Protegido","cost":"–1pt","points":-1,"description":"Existe alguém que você precisa proteger de qualquer maneira, com a\nprópria vida se necessário. Pode ser outro personagem jogador, ou um NPC\nque acompanha você. Manter um Protegido é arriscado, os vilões podem\n(vão!) tentar usá-lo como chantagem para vencer você.\nSempre que o Protegido está desaparecido, indefeso ou ferido (qualquer quantidade de PV abaixo do total), todos os seus testes têm Perda.\nSe o Protegido morre ou desaparece para sempre, você adquire a versão\nsevera de Assombrado (–2pt). “Ah, mas eu ganho o ponto de diferença?” NÃO!","page":73},{"name":"Restrição","cost":"–1-2pt","points":-1,"description":"Certa condição torna mais difícil usar seus poderes. Quando ela acontece, você sempre gasta o dobro de PM para usar suas vantagens.\nO valor da desvantagem depende de quão comum é a Restrição: \n• Incomum (–1pt). A Restrição acontece raramente. Você está molhado. Você\nestá com fome. É noite de lua cheia. O inimigo pertence a certo arquétipo\n(humano, elfo, anão...). Alguém no grupo soltou pum.\n• Comum (–2pt). A Restrição acontece muito frequentemente. É noite (ou\ndia). Você está em lugar fechado (ou aberto). Tem alguém olhando. O bardo chato não parou de cantar. Alguém no grupo soltou pum (cada um\nconhece o grupo que tem).\nVocê não pode ter esta desvantagem se não tiver nenhuma vantagem\nque gasta PM. Cria vergonha nessa cara!","page":73},{"name":"Sem Vida","cost":"–2pt","points":-2,"description":"Você não é um ser vivo. Pode ser um construto criado por ciência avançada, um morto-vivo animado por energia negativa, um brinquedo muito\namado que ganhou alma, ou uma relíquia antiga que despertou um espírito. Ou um sapato falante. Pois é.\nA boa notícia é que você não pode morrer; em testes de morte, você\nnunca tem um resultado pior que inconsciente.\nA má notícia é que você não recupera PV de formas normais. Nem descanso, nem itens, nem vantagens como Cura e Regeneração.\nVocê pode ser consertado ou restaurado com outra perícia, como Máquinas (para construtos) ou Mística (para mortos-vivos), feito por outro\npersonagem. Cada tentativa exige uma hora de trabalho (consertando ou\nproduzindo elixires mágicos) e um teste (9). Em caso de sucesso, seus PV\nvoltam ao total.\nVocê ainda precisa descansar para recuperar PA e PM.","page":74},{"name":"Tapado","cost":"–1pt","points":-1,"description":"Você não é uma pessoa muito brilhante. Quando faz testes de Habilidade relacionado a inteligência e raciocínio, você tem Perda e nunca tem\nacertos críticos.\nVocê não pode ser Tapado e também Gênio.","page":74},{"name":"Transtorno","cost":"–1pt cada","points":-1,"description":"Você lida com um transtorno mental. Escolha um entre os seguintes:\n• Cleptomania. Você rouba coisas de que não precisa, não por seu valor,\napenas por serem interessantes. Sempre que surgir a chance de roubar algo, deve fazer um teste para evitar. Um cleptomaníaco nunca\ndevolve para os donos o produto de seus roubos, e lutará para evitar\nque isso aconteça.\n• Compulsão. Existe algo que você precisa fazer várias vezes por dia: tomar\nbanho, lavar roupa, comer lasanha, tocar harpa, roer as unhas, ler quadrinhos... Cada vez que uma cena começa, você tem Perda em todos os\ntestes até gastar uma rodada cumprindo sua compulsão.  \n• Distração. Você não consegue se concentrar em algo que não o interessa\n(qualquer coisa não relacionada a Devoto ou Código). Nestas situações\nvocê não consegue acertos críticos.\n• Fantasia. Você acredita ser alguém ou alguma coisa que não é, ou acha\nque pode fazer alguma coisa de que não é capaz. (Eu sou um mago! Eu\nposso voar! Eu sou o Capitão Ninja!) Você fala de si mesmo o tempo\ntodo para anunciar sua fantasia para todos à volta. Perda em todos os\ntestes sociais.\n• Fobia. Você tem medo terrível de alguma coisa (lugares altos, insetos,\nágua, sangue...). Sempre que essa coisa está Perto, você não consegue\nfazer ações, apenas movimentos. Só consegue fazer uma ação se antes\npassar em um teste.\n• Megalomania. Você acredita ser invencível, imortal, destinado a realizar\num grande objetivo, e ninguém conseguirá detê-lo! Você nunca se rende e segue lutando mesmo após ser derrotado.\n• Mitomania. Você nunca diz a verdade sobre coisa alguma, mesmo\nquando quer. Precisa de um teste para dizer algo verdadeiro, até para\nseus aliados.\n• Paranoia. Você não confia em ninguém, nem em seus aliados. Precisa\nde um teste para aceitar qualquer ajuda (até cura!). Além disso, não\ndorme direito: sua recuperação de recursos com descanso é metade\ndo normal.\nQuando a superação do transtorno pede um teste, é um teste de Resistência (9).","page":74},{"name":"Utensílio","cost":"–1ou -2pt","points":-1,"description":"Você precisa de um item (arma, amuleto, ferramenta, celular...) para\nusar adequadamente uma perícia ou vantagens.\n–1pt Escolha uma perícia que você tem. Você precisa do Utensílio para\nusar adequadamente essa perícia. Quando não está com esse item, você\nnão consegue acertos críticos.\n–2pt Sem o Utensílio, você não pode usar vantagens ou técnicas que\ngastam PM (você não pode escolher esta desvantagem se não tem meios\nde gastar PM). Você também não pode usar PA, exceto com o propósito de\nrecuperar o Utensílio ou improvisá-lo (veja adiante).\nSe rolar uma falha crítica enquanto usa o Utensílio, você o deixa cair e\nprecisa gastar um movimento para recuperá-lo.\nSe um atacante rola um acerto crítico contra você, em vez de aumentar\no dano, ele pode escolher destruir seu Utensílio. Neste caso você perde o\nitem, mas não sofre nenhum dano pelo ataque.\nSe o Utensílio é destruído ou perdido, você consegue outro igual depois\nque a cena termina. Ou gastando uma ação e 1PA para improvisá-lo.\nVocê também pode escolher como Utensílio algo grande como um trailer, biblioteca ou oficina. Neste caso não pode deixar cair, ser perdido ou\ndestruído (espera-se!), mas você também não pode levar sempre consigo.","page":75},
{"name":"Vulnerável","cost":"-1pt cada","points":-1,"description":"Escolha dois tipos de dano. Contra você, esses ataques causam dano dobrado. Você pode pegar esta desvantagem várias vezes, para mais tipos.","page":176},
{"name":"Obsessão Violenta","cost":"-1pt ou -2pt","points":-1,"description":"Você é consumido pela necessidade de derrotar inimigos — sendo que, sim, você decide quem é inimigo!\n\n–1pt A obsessão é suave. Você precisa derrotar alguém uma vez por sessão de jogo. Você sofre Atributo –1 em todos os testes até isso acontecer.\n–2pt A obsessão é intensa. Você precisa derrotar alguém uma vez por cena. Você sofre Atributo –1 em todos os testes até isso acontecer.\n\nValem apenas combates violentos (está no nome da desvantagem!) de verdade, contra oponentes de verdade. Tentar derrotar o pardal na cerca, o amiguinho Imortal, ou o jogador aleatório no game de luta online, tudo isso é infração punida com peteleco na testa.","page":85}]},"skills":{"Animais":"Você sabe cuidar, adestrar, cavalgar e lidar com animais e outras criaturas irracionais, como vários monstros. Pode substituir Medicina (apenas para animais). Com bons resultados nos testes, você consegue até se comunicar com animais.","Arte":"Você sabe fazer performances artísticas como cantar, dançar, tocar música, cozinhar, fazer cosplay (e se disfarçar), desenhar, avaliar objetos de arte e outras.","Esporte":"Você conhece os muitos tipos de esportes e suas regras, além de ser capacitado em atividades físicas como correr, escalar, nadar, fazer acrobacias, equilibrar-se, saltar e outras.","Influência":"Você sabe convencer outros a acreditar em algo ou fazer o que você quer. Envolve coisas como diplomacia, liderança, intimidação, sedução, blefe, hipnose, lábia, barganha, obter informações e outros.","Luta":"Você sabe atacar e se defender em combate, seja corpo a corpo ou à distância. Também envolve a parte teórica dos combates, como reconhecer estilos de luta, analisar técnicas de inimigos e desenvolver táticas ou planos de ação — incluindo confrontos entre grandes grupos, como exércitos. Conflitos violentos (quase) sempre exigem testes de Luta!","Manha":"Você sabe fazer coisas malandras ou ilegais, como construir (e sabotar) armadilhas, arrombar portas e fechaduras, bater carteiras, criar (e decifrar) mensagens criptografadas, se disfarçar, falsificar objetos, ser furtivo, intimidar, rastrear pistas e pegadas...","Máquinas":"Você sabe operar, construir e consertar máquinas, veículos e aparelhos de todo tipo. Também sabe lidar com computadores, hackear sistemas, vasculhar a internet, jogar games ou agir em simulações e realidades virtuais. Pode substituir Medicina (apenas para construtos).","Medicina":"Você sabe realizar primeiros socorros, diagnósticos, tratar doenças e venenos, realizar cirurgias e todo tipo de conhecimento de saúde. Pode despertar um personagem inconsciente ou estabilizar um personagem quase morto.","Mística":"Você sabe sobre forças sobrenaturais e artes místicas. Quando atacar ou se defender com poderes mágicos ou sobrenaturais (como a vantagem Magia), use esta perícia. Também é usada para reconhecer, contra-atacar e teorizar sobre conhecimentos ocultos, magia e criaturas mágicas.","Percepção":"Você sabe usar seus sentidos para perceber melhor o mundo ao redor. Usada para ouvir ruídos muito baixos, notar coisas e personagens distantes, escondidos ou sob disfarce, ler lábios, rastrear pistas, evitar ser surpreendido e até mesmo como um “sexto sentido” para tentar notar se alguém está mentindo ou agindo de forma suspeita.","Saber":"Você sabe tudo sobre tudo, qualquer conhecimento teórico em ciências, idiomas e até assuntos sobrenaturais, ou como e onde pesquisá-los. Note que é uma perícia ampla, engloba todos os campos, própria para aqueles cientistas exagerados ou super nerds que sabem de tudo!","Sobrevivência":"Você sabe subsistir e se orientar em condições adversas. Pode encontrar e produzir alimento, construir abrigos, rastrear pistas, reconhecer criaturas selvagens, construir e sabotar armadilhas, ser furtivo, nadar, prever o clima, entre outros."},"kits":[{"name":"Abastado","nuclei":"Era das Arcas, Guerra da Galáxia","requirements":"Influência ou Manha; Riqueza","description":"Apesar dos temores e conflitos iniciais, a Era das Arcas trouxe prosperidade ao mundo. Onde muitos viram masmorras e monstros, os empreendedores ousaram desafiar seus mistérios — sendo Arturo Amon o caso mais icônico. Trouxeram ciências exóticas, tesouros mágicos e técnicos, inovações industriais, novas formas de entretenimento. Empresas (e até empresários) tornaram-se mais poderosas que governos. Entre os que enriqueceram, ou já nasceram endinheirados, há aqueles que vivem aventuras. Alguns querem aumentar ainda mais sua fortuna — assim como aventureiros caçam tesouros que fortificam seus poderes. Outros, por nobreza e generosidade, usam suas posses para causas justas: ajudar pessoas, proteger o mundo, combater o mal. Outros ainda buscam realizar algum grande sonho que o dinheiro, apenas, não pode alcançar. Abastados gargalham de ditados como “o dinheiro é raiz de todo o mal”. Sabem que sua riqueza representa esforço, competência e determinação, que eles podem usar para realizar grandes obras. Muito embora alguns, de fato, sejam gananciosos e não hesitem em prejudicar outros para ganho próprio.","powers":[{"name":"Meritocracia","description":"Uma vez por cena, você pode fazer um teste de compra para usar uma vantagem que não possua, uma única vez. Uma vantagem de 1pt exige um teste Médio (9); para cada ponto extra, a dificuldade aumenta +3. Você ainda deve pagar outros custos da vantagem (como PM). Por exemplo, usar Incorpóreo exige um teste com meta 12, uma ação e 5PM."},{"name":"Poder aquisitivo","description":"Todos os seus testes de compra ganham +3 no resultado final (depois da rolagem)."},{"name":"Tempo é dinheiro!","description":"Seu primeiro teste de compra em cada sessão recebe Ganho, e seu segundo teste não sofre Perda (como seria normal para um segundo teste)."}],"page":4},{"name":"Agente Secreto","nuclei":"Guerra da Galáxia, Operação ARSENAL","requirements":"Manha ou Percepção; Patrono","description":"A Era das Arcas é brilhante, colorida, auspiciosa. Mas estes também são tempos de governos, corporações, entidades e indivíduos poderosos — em constante rivalidade e competição para conquistar segredos das Arcas, obter tesouros de outros mundos, criar tecnologias revolucionárias, mudar o mundo, alcançar poder, fama e fortuna. Alguns o fazem abertamente, esmagando qualquer concorrência; outros, em sigilo, para evitar represálias. Entram em cena os agentes secretos. Com treinamento extremo, aparelhos incríveis e até superpoderes, estes espiões são empregados em missões variadas, difíceis demais para pessoas comuns: revelar segredos, desmascarar vilões, coletar itens de valor — que podem estar na última câmara de uma Arca, no computador pessoal do General Púrpura, ou no cofre-forte da matriz Xenocorp. Agentes secretos podem evitar guerras, ou começá-las. Podem salvar vidas, ou causar massacres. Resgatar a filha sequestrada de um diplomata, ou ativar o dispositivo secreto que desperta um kaiju furioso. Embora prefiram agir sozinhos, agentes secretos podem aceitar aliados ocasionais — nem sempre revelando sua real ocupação, muito menos seu contratante. Embora bem treinados em combate, preferem furtividade a confrontos diretos.","powers":[{"name":"Identidade secreta","description":"Você tem Ganho em testes para ocultar suas atividades (incluindo manter-se escondido). Da mesma forma, testes feitos por outros para descobrir qualquer coisa sobre você têm Perda."},{"name":"Olho clínico","description":"Você pode gastar uma ação e 1PM para fazer um teste de Percepção (Habilidade, 9). Se bem-sucedido, você descobre algo sobre um personagem (como um valor de atributo, perícia, vantagem ou desvantagem)."},{"name":"Plano de ação","description":"Você pode gastar um movimento e 2PM para analisar a situação e elaborar um plano. Até o fim da cena você recebe H+2. Isso não afeta os seus recursos."}],"page":5},{"name":"Alquimista","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Mística, Saber","description":"A alquimia, ciência da transmutação dos elementos, já existe neste mundo há séculos — mas agora está alcançando seu apogeu, com técnicas trazidas de além-Convergência. Naquele mundo fantástico, até onde se sabe, alquimistas são indivíduos muito poderosos. Alquimistas são um tipo especial de conjurador arcano, com seus próprios métodos. Através de fórmulas complexas traçadas em diagramas, podem transformar ou destruir os elementos que formam o mundo. Mudam a forma de objetos, criaturas ou até o próprio corpo, mas seguindo leis rigorosas: para conseguir algo, deve-se dar algo em troca. Estudioso disciplinado, o alquimista não acredita em milagres ou conquistas fáceis. Tudo que é valioso exige esforço, trabalho duro e sacrifício. Alquimistas sabem que nem sempre o sucesso é garantido, nem todo esforço é recompensado. Sempre existe chance de falhar. Mas, sem esforço ou risco, existe apenas a certeza de falhar.","powers":[{"name":"Diagrama","description":"Você pode gastar um movimento para traçar um diagrama alquímico em alguma superfície (no chão, na parede, nas costas do amigo distraído...). Sua próxima vantagem ou técnica que gasta PM tem seu custo reduzido em –1 (mínimo 1PM)."},{"name":"Diagrama pessoal","description":"Escolha uma vantagem ou técnica que você tem e gasta PM. Você pode levar consigo o diagrama necessário para usá-la (em um pergaminho, bordado na roupa, tatuado no corpo...), sem precisar gastar um movimento para reduzir o custo."},{"name":"Troca equivalente","description":"Na primeira rodada de cada cena, você pode mudar seus atributos e vantagens livremente, como na vantagem Transformação — exceto que não pode mudar perícias, desvantagens e técnicas. Em vez disso, você pode transmutar um aliado voluntário Perto. Você (ou seu aliado) reverte à forma normal no fim da cena."}],"page":6},{"name":"Artista Marcial","nuclei":"Era das Arcas, Operação ARSENAL","requirements":"Luta","description":"É verdade que as Convergências trouxeram grande número de poderes exóticos — mas as artes marciais já existem neste mundo há milênios. Inumeráveis estilos, cada um com suas forças e fraquezas, cada um consumindo anos para sua maestria. Algumas preservam suas tradições, outras se adaptam e absorvem a magia das Arcas. Lutadores incríveis surgem a todo momento, testando suas habilidades não apenas em duelos e torneios, mas também contra monstros e vilões. Alguns artistas marciais querem provar a força de seu estilo — para o mundo, para seus mestres, ou para si mesmos. Para outros, a ambição é tornar-se mestre supremo de sua arte. Outros anseiam por glória, fama ou fortuna. Outros ainda têm objetivos secretos, perseguem algum sonho, tesouro ou vingança. E para alguns, seguir lutando é tudo que importa. Muitos lutadores consideram o mundo sua arena, procurando oponentes fortes onde estiverem. Unem-se a companheiros poderosos, para provar que são melhores — ou aprender que ainda não são. E embora enfrentem as Arcas, invasores do espaço, escolas rivais e até oponentes virtuais, nenhum desafio é tão atrativo quanto o Torneio da Ilha do Martelo.","powers":[{"name":"Kata","description":"Quando seu ataque vence a defesa do alvo, você pode usar um movimento para aumentar o dano em 2 pontos. Se tiver mais movimentos neste turno, cada um adiciona mais 2 pontos."},{"name":"Montagem de treino","description":"Uma vez por sessão, antes de um combate importante, você pode fazer um teste de Luta (9, ou mais para oponentes muito mais fortes que você). Se tiver sucesso, aquela será a luta para a qual você vinha se preparando: você recebe Maestria (Luta) durante aquele combate. Se já tem a vantagem, pode escolher pagar 2PM para crítico com 4, 5 e 6."},{"name":"Lutarei para conseguir!","description":"Sua arte marcial é versátil. Uma vez por cena, você pode usar Luta para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."}],"page":7},{"name":"Ás Advogado","nuclei":"Guerra da Galáxia, UniPotência","requirements":"Influência, Defesa Especial (Reflexão)","description":"Nem toda a luta contra o mal acontece em batalhas violentas nas ruas, arenas ou Arcas. A mais pura e verdadeira justiça está nos tribunais, onde promotores e defensores travam combates legais para proteger inocentes e punir culpados. Nessa arena, diante de juiz e júri, o ás advogado é o campeão supremo. Armado apenas com a lei, ele é o verdadeiro defensor dos necessitados e terror dos criminosos. Sua convicção é mais dura que qualquer escudo, seu dedo acusador é pungente feito espada afiada, seu protesto tem a força de uma bomba. Quando não utiliza esses atributos no fórum, o ás advogado se aventura onde é mais necessário, coletando evidências, apontando suspeitos, confrontando infratores. Por isso, embora atue em cenários mais urbanos, não será uma surpresa total encontrar este herói engravatado entre outros aventureiros, talvez até explorando alguma Arca. Alguns ases são impiedosos e inflexíveis, obcecados em fazer cumprir a lei e castigar culpados. Outros, de coração leve, estão mais preocupados em ajudar quem precisa. Sabem que a justiça existe para garantir a segurança, felicidade e dignidade de todos.","powers":[{"name":"Coleta de provas","description":"Quando tem um crítico em um teste de Influência ou Saber, em vez de somar o atributo outra vez, você pode escolher pegar uma Prova (anote P, a lápis, em algum lugar da ficha). Você pode fazer isso até três vezes por cena. Em outros testes de Influência ou Saber, você pode gastar uma ou mais Provas; cada Prova concede um crítico automático. Provas não usadas até o fim da cena são desqualificadas e perdidas."},{"name":"Embargo","description":"Você pode pagar 2PM para evitar todo o dano de um ataque, ou qualquer efeito negativo por falhar em um teste. Você pode fazer isso um número de vezes por sessão igual a seu Poder ou 5, o que for menor."},{"name":"Objeção!","description":"Sua Defesa Especial (Reflexão) adiciona +2 ao dano contra o adversário."}],"page":8},{"name":"Atirador de Elite","nuclei":"Guerra da Galáxia, Operação ARSENAL, Tormenta ALPHA","requirements":"Manha; Alcance 2","description":"Enquanto alguns preferem dizimar o inimigo aos poucos, perdendo tempo e correndo riscos, o atirador de elite faz um trabalho limpo e rápido. O alvo talvez nunca saiba de onde veio o tiro, ou mesmo que estava sob mira, mas terá tempo para pensar no assunto quando estiver no além. O atirador de elite não luta, não se envolve em duelos: ele apenas elimina seu alvo. Tocaia é sua estratégia máxima — sempre que possível vai evitar o combate direto, ou mesmo ser visto. Usará cobertura, camuflagem, invisibilidade e outros meios para manter-se oculto. Quando localizado, tentará escapar para armar uma nova emboscada em outro lugar. Por seus métodos furtivos, o atirador de elite prefere agir sozinho. Será raro atuar grupos de Arcanautas ruidosos e chamativos. Caso aconteça, vai preferir viajar a certa distância, mantendo o terreno sob mira, pronto para dar suporte aos colegas. Ou usá-los como iscas, voluntárias ou não, para atrair sua vítima para fora do esconderijo.","powers":[{"name":"Mira perfeita","description":"Em cada cena, seu primeiro ataque contra cada alvo Longe ou mais impõe Perda na defesa do alvo."},{"name":"Posição vantajosa","description":"Você pode gastar uma ação completa para se colocar em um ponto protegido, recebendo Ganho em testes de defesa contra ataques de Longe ou mais."},{"name":"Um tiro, duas mortes","description":"Quando reduz um oponente a 0PV com um ataque à distância (Longe ou mais), o mesmo projétil segue, ricocheteia e atinge outro alvo à sua escolha, com a mesma rolagem de ataque, sem qualquer custo extra."}],"page":9},{"name":"Bárbaro","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Sobrevivência; Vigoroso","description":"Aquele que julga o bárbaro como um “selvagem incivilizado” não apenas está cometendo um grande erro, como também subestimando um lutador poderoso. Não confunda aquele que não sabe viver em sociedade, e aquele que não precisa. O bárbaro é um guerreiro bravio, indomável, rebelde, até mesmo rústico — mas não um estúpido ou ignorante. Ele é sábio e astuto, conhecedor da terra, seus caminhos e seus povos. Nômade bravio, não precisa de teto sobre a cabeça, nem depende de luxos urbanos; prefere vestes, instrumentos e armas simples, em que possa confiar. Resiliente, estoico, não fraqueja diante de rigores que fariam o chamado “homem moderno” chorar e implorar. No além-Convergência, bárbaros se tornaram grandes líderes, generais, reis; e aqui, são capazes de conquistas ainda maiores. Mas sim, o bárbaro pode se enfurecer como uma besta brutal, acessar energias primevas, invocar espíritos raivosos. Nesse estado ele se torna ainda mais forte, robusto e assustador, levando muitos a temer que esteja descontrolado. Não, nada disso: ele sabe bem o que faz. Bárbaros são presença constante em grupos Arcanautas, mas também procuram qualquer missão em que sua fortaleza tenha utilidade.","powers":[{"name":"Espírito livre","description":"Se estiver consciente, você nunca é considerado indefeso."},{"name":"Frenesi de combate","description":"Você pode gastar 3PM para invocar um frenesi que oferece P+3 (sem afetar seus Pontos de Ação) até o fim da cena. Quando o combate termina, você fica esgotado e é considerado derrotado durante toda a cena seguinte."},{"name":"Resistência superior","description":"Para você a vantagem Vigoroso oferece R+3, em vez de +2."}],"page":10},{"name":"Caça-Prêmios","nuclei":"Guerra da Galáxia, Tormenta ALPHA","requirements":"Percepção, Manha ou Sobrevivência","description":"Cada um tem suas próprias razões para correr riscos, explorar Arcas e derrotar monstros. Para o caça-prêmios, isso é apenas um meio de vida. Caça-prêmios abraçam a vida de aventureiro como profissão. Procuram ativamente por contratos ou, quando conquistam notoriedade, aguardam que os clientes venham. Seu tipo de trabalho preferido envolve rastrear e capturar criminosos procurados, mas muitos também aceitam missões típicas de Arcanautas: explorar Arcas, resgatar tesouros, caçar monstros. Nem todos os caças-prêmios são gananciosos ou egoístas. Muitos usam seus rendimentos para fazer caridade, ajudar necessitados. Outros acumulam riqueza para realizar algum grande sonho, que pode ser nobre ou mesquinho. Há aqueles que caçam como pretexto para perseguir algo ou alguém que odeiam (como aquele guerreiro poderoso que só aceita contratos para matar goblins). E outros ainda usam a profissão sinistra para disfarçar um enorme desejo de proteger inocentes e fazer do mundo um lugar melhor, às vezes até trabalhando de graça. Mas não conte a ninguém, senão...","powers":[{"name":"Ataque subjugante","description":"Gaste 2PM antes de fazer um ataque. Se causar dano, o alvo tem Perda em testes de ataque e defesa até seu próximo turno."},{"name":"Contrato","description":"Quando aceita um contrato para caçar um alvo, você recebe a vantagem Inimigo temporariamente para esse alvo."},{"name":"Mural de recompensas","description":"Você sempre tem Ganho em testes para conseguir informações sobre procurados e suas recompensas, e também em testes para rastrear o alvo de seu Contrato."}],"page":11},{"name":"CARD Gamer","nuclei":"Era das Arcas, Tormenta ALPHA.","requirements":"Magia, Mística, Utensílio.","description":"Cartões de Ampliação da Realidade Dimensional — CARDs. Surgiram nas lojas especializadas como entretenimento — e mais tarde como esporte, com grandes torneios mundiais, premiados com fortunas. Cada carta conjura um efeito mágico ou criatura fantástica. São, na verdade, baseados em artefatos mágicos encontrados nas Arcas; existem também como pergaminhos, papiros, até tábulas de argila antiquíssimas. Embora qualquer pessoa consiga usar CARDs em arenas virtuais próprias, sejam mágicas ou tecnológicas, o CARD gamer é muito mais que um jogador casual. Ele desbloqueia habilidades secretas no baralho, atua como um conjurador místico, manifestando o conteúdo dos CARDs no mundo real. Executa magias, invoca seres fabulosos, lendários. Muitos surgem no mesmo instante, outros exigem mais tempo, conforme seu poder. E alguns, mais poderosos ou rebeldes, sequer permanecem sob controle total do invocador.","powers":[{"name":"Caiu na armadilha!","description":"Uma vez por cena, após um oponente realizar qualquer ação, você pode fazer um teste de Mística (6 + Habilidade do oponente). Se tiver sucesso, pode usar Magia ou uma técnica mágica que conheça como reação."},{"name":"Carta na manga","description":"Quando usa uma vantagem ou técnica que gasta PM, se você gastar +2PM, existe uma chance (resultado ímpar em 1D) de que o mesmo efeito aconteça outra vez em seu turno seguinte, sem custo adicional."},{"name":"Escolha uma carta","description":"Você invoca uma criatura. Gaste 1PM para receber um Ajudante até o fim da cena. Se tiver sucesso em um teste de Mística (9) você escolhe o tipo de ajudante; se falhar, o mestre escolhe. Você ainda deve pagar PM por cada utilização do Ajudante."}],"page":12},{"name":"Cavaleiro","nuclei":"Era das Arcas, Tormenta ALPHA","requirements":"Resoluto ou Vigoroso; Código (qualquer)","description":"Grandes ordens de cavalaria existiram neste mundo, e também no além-Convergência. Mais que apenas um guerreiro de armadura brilhante, um cavaleiro é guiado por ideais de honra — que podem ser sobre verdade, lealdade, bravura, combate justo e outras virtudes. Para ele, nada é mais importante que seguir seu código, e nenhum objetivo é mais nobre que tornar-se um exemplo de retidão para os mais jovens. Cavaleiros correm o mundo em busca de oportunidades para praticar seus valores. Protegem os fracos, combatem o crime, perseguem o mal, recompensam a bondade. Enquanto outros enxergam códigos como amarras ou restrições, o cavaleiro extrai deles sua força, seu ímpeto para seguir lutando. Seus códigos são sua certeza, seu horizonte, sua linha-mestra. Sem eles, está perdido. Por suas qualidades e confiabilidade, cavaleiros estão entre os membros favoritos em qualquer grupo Arcanauta — mas podem atuar em qualquer lugar onde se sintam necessários, do espaço profundo aos mundos virtuais.","powers":[{"name":"Armadura completa","description":"Quando sofre um ataque, você pode escolher gastar 2PM para reduzir em –1 o resultado de cada dado do atacante. Se ele rolar um 4, por exemplo, conta como 3. Essa redução, inclusive, cancela acertos críticos. Você ainda faz seu teste de defesa normalmente."},{"name":"Força da honra","description":"Você recebe um Ganho em qualquer teste, uma vez por cena, para cada Código que você tem. Se violar qualquer de seus Códigos, não pode usar este poder até se redimir. (Note que você pode escolher adotar mais de dois Códigos, embora não receba pontos de personagem por estes.)"},{"name":"Inspirar aliado","description":"Você pode gastar 1PM e uma ação para inspirar um aliado que possa vê-lo. Ele recebe Ganho em um teste em seu próximo turno. Não é possível “guardar” Ganhos para depois."}],"page":13},{"name":"Celebridade","nuclei":"Era das Arcas, Guerra da Galáxia, Operação ARSENAL","requirements":"Famoso, Torcida","description":"A chegada de raças exóticas, poderes miraculosos e histórias épicas mudou os sonhos das pessoas. Produziu um exército de novos astros e estrelas. Entraram em cena os grandes campeões na batalha pela atenção e admiração do público. Embora muitas celebridades sejam artistas de diversos tipos, como atores, cantores e modelos, nem todas o são. Expoentes em quase qualquer área podem conquistar esse status, desde astros dos esportes até heróis de guerra, passando por grandes cientistas, chefs internacionais, empresários inovadores, bilionários excêntricos, políticos importantes, campeões de artes marciais, exploradores intrépidos, influenciadores polêmicos e — é claro — Arcanautas. Várias celebridades se juntam a aventureiros, e até participam de missões perigosas, para conquistar ainda mais notoriedade. Outras, por outro lado, tornam-se célebres justamente por atuar em grandes aventuras, derrotar vilões, salvar o mundo. Outras ainda buscam fama com motivações ocultas, como realizar um sonho secreto, aliviar a dor de uma perda, proteger sua verdadeira ocupação, ou disfarçar algum plano de dominação mundial!","powers":[{"name":"Grande fama","description":"Você gasta 2PM, em vez de 3, para usar a vantagem Famoso."},{"name":"Ovação","description":"Quando está sob efeito de sua Torcida, você pode gastar um turno para recuperar 1D Pontos de Mana."},{"name":"Rugido das massas","description":"Além do Ganho recebido por Torcida, seu teste causa um acerto crítico com 5 ou 6."}],"page":14},{"name":"Cientista","nuclei":"Era das Arcas, Guerra da Galáxia, UniPotência","requirements":"Saber","description":"As ciências jamais foram tão desafiadoras quanto agora. A Era das Arcas trouxe seres de biologia estranha, materiais fantásticos, tesouros técnicos, violações das leis naturais conhecidas. Mais que tudo isso, trouxe magia — ou melhor, ciência que ainda não compreendemos. Neste cenário, cientistas estão entre os maiores desbravadores, e talvez aqueles de que mais precisamos. Uma descoberta científica pode ser a chave para salvar a humanidade do próximo kaiju enfurecido ou exército alienígena invasor. Embora a maior parte dos cientistas atue em bibliotecas e laboratórios, existem aqueles mais audazes, com necessidade de sair em campo. Exploram ruínas antigas para desvendar segredos das primeiras Convergências. Encontram aplicações para metais exóticos e gemas elementais. Desvendam o funcionamento de armas alienígenas e naves estelares. Avisam sobre ameaças antes que aconteçam, são ignorados, e então pesquisam formas de derrotá-las. Cientistas estão sempre salvando o mundo, ou tornando-o um lugar melhor. Em qualquer grupo de aventureiros, um cientista será sempre ajuda valiosa, mesmo quando não sabe lutar. Mas vários sabem. Usam seus conhecimentos como arma e armadura, de formas que alguns até diriam ser bruxaria!","powers":[{"name":"Eureka!","description":"Você pode produzir um invento ou método capaz de resolver um problema. Uma vez por sessão, com um movimento e 3PM, você adquire uma vantagem de custo 1pt à sua escolha, até o fim da cena. Você ainda deve pagar quaisquer outros custos da vantagem escolhida."},{"name":"Método científico","description":"Você enxerga padrões nos eventos ao redor. Uma vez por cena, pode usar Saber para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Pesquisa","description":"Você pode gastar um movimento e 1PM para fazer um teste de Saber (9) e descobrir informações sobre um personagem na cena. Escolha: atributos, perícias, vantagens, desvantagens, técnicas ou itens. A critério do mestre, você também pode descobrir outros segredos."}],"page":15},{"name":"Clérigo","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Devoto","description":"Muito pouco é conhecido sobre o mundo (mundos?) além-Convergência. Suspeita-se, no entanto, existir ali entidades extraplanares poderosas, consideradas “deuses”. Seriam capazes de oferecer poderes fantásticos a seus devotos, enquanto estes obedeciam a obrigações e pregavam os ideais da divindade padroeira. Quem ou quantos seriam esses deuses, não se sabe. Seus títulos verdadeiros não chegaram até aqui, ou chegaram de forma deturpada. Não existem igrejas ou religiões organizadas que os cultuem. Contudo, uma pequena parte de sua influência poderosa alcança este mundo, através de artefatos. Um medalhão com um símbolo sagrado, uma estatueta ou pintura sacra, uma arma ou armadura santa. Tais relíquias permitem aos escolhidos comungar com as entidades divinas longínquas e fazer pactos. Servir em troca de poder mágico. Chamados de clérigos, estes campeões de deuses distantes nem sempre conhecem a verdadeira identidade dos padroeiros, ou mesmo seus nomes — muitos os tratam apenas por títulos, como Deus da Justiça, Deus dos Ladrões, Deusa da Magia. Recebem seus comandos em sonhos enigmáticos, visões misteriosas ou simples intuição. Ainda, o patrono nem sempre é nobre ou bondoso; existem deuses malignos, cruéis, trapaceiros, que escolhem servos de igual afinidade.","powers":[{"name":"Devoto fervoroso","description":"Você pode usar a vantagem Devoto até três vezes por cena, em vez de duas."},{"name":"Dom divino","description":"Sua divindade permite realizar milagres mágicos variados. Uma vez por cena, com um movimento e 3PM, você adquire uma perícia ou vantagem de custo 1pt à sua escolha, até o fim da cena. Você ainda deve pagar outros custos da vantagem escolhida."},{"name":"Poder concedido","description":"Escolha uma vantagem entre as seguintes: Anulação, Confusão, Cura, Defesa Especial (qualquer), Magia, Paralisia. Se tiver essa vantagem (ou a escolheu como Dom Divino), você pode usá-la sem gastar PM uma vez por cena."}],"page":16},{"name":"Cosmonauta da ORDEM","nuclei":"Guerra da Galáxia","requirements":"Patrono, Inimigo (aliens)","description":"Enquanto o Exército da Luz atua principalmente na Terra, a frota espacial chamada ORDEM — Organização de Resistência a Divergência Extraterrestre Maledicente — combate através do universo em suas naves estelares. Com a missão de localizar e enfrentar ameaças alienígenas em sua origem, teve atuação decisiva na Guerra da Galáxia, impedindo as forças extraterrestres de alcançar nosso planeta. Apesar de sua origem e prioridade militares, a ORDEM é também uma frota de pesquisa e exploração, responsável por contatar novos mundos e povos. Seus membros são preparados para atuar em planetas estranhos e interagir com formas de vida desconhecidas. Seus veteranos de guerra são considerados heróis, e sua gigantesca nau-capitânia, a Aristóteles, foi recentemente convertida em cidade universitária para preparar novos cosmonautas e exploradores. Assim, o cosmonauta da ORDEM é também um valente cientista e aventureiro, pronto para desafiar o desconhecido não apenas com armas futuristas, mas também curiosidade, conhecimento e boa vontade. E embora sua especialidade seja o espaço profundo, alguns atuam na Terra para rastrear aliens infiltrados e outras ameaças.","powers":[{"name":"Primeiro contato","description":"Você é treinado para enfrentar o desconhecido. Pode gastar 2PM para receber +3 em qualquer teste de Saber ou Sobrevivência."},{"name":"Inimigo meu","description":"Você pode usar a vantagem Inimigo para seres extraterrestres que nunca viu antes. Apesar do nome, também afeta testes para interações sociais amistosas e prestação de ajuda."},{"name":"Sensores avançados","description":"Você pode pagar 2PM para adquirir um Sentido à sua escolha, para um único teste."}],"page":17},{"name":"Curandeiro","nuclei":"Era das Arcas, UniPotência, Tormenta ALPHA","requirements":"Medicina; Cura","description":"Com a chegada das Arcas, veio também a demanda por exploradores com poderes especializados, úteis em combate. Não apenas aqueles de ataque e defesa, mas também para restaurar saúde aos feridos. Assim, além de Arcanautas, qualquer grupo de aventureiros pensaria cem vezes antes de aceitar uma missão perigosa sem um curandeiro. Poderes de cura podem ter origens muito variadas, tornando os próprios curandeiros muito diferentes entre si. Alguns são médicos de competência extrema ou tecnologia médica de ponta. Outros servem a divindades benevolentes de além-Convergência, que dizem prover curas mágicas a seus devotos. De forma similar, outros dominam técnicas curativas dos Viajantes, ou apenas nascem com tal capacidade, restaurando a vida com um simples toque, palavra de conforto, canção revigorante, refeição sublime, secreções regenerativas ou mesmo um beijo. Curandeiros tendem a ser bondosos, caridosos — mas também existem aqueles pragmáticos ou egoístas, curando apenas quando o pagamento é bom. Curandeiros são sempre os mais procurados para compor Arcanautas e outros grupos. Pelo menos um curandeiro — ou clérigo, ou outro Arcanauta com essa capacidade — é exigido em Arcas gerenciadas pela BUSCA. São também populares em missões de Tormenta ALPHA.","powers":[{"name":"Paramédico","description":"Você pode curar 1D Pontos de Vida com uma ação e um teste de Medicina (9)."},{"name":"Cura crítica","description":"Sempre que você rola 6 em um dado de Cura, pode rolar um dado extra. Isso também vale para os dados extras."},{"name":"Explosão de cura","description":"Uma vez por cena, você pode usar sua Cura em capacidade máxima (1D para cada ponto de Habilidade) sem gastar PM."}],"page":18},{"name":"Detetive","nuclei":"Guerra da Galáxia, Operação ARSENAL, UniPotência","requirements":"Manha, Percepção","description":"Mesmo neste novo mundo de raças fantásticas, magia e poderes estranhos, detetives ainda estão entre os profissionais mais procurados para desvendar casos. Especialmente quando o próprio detetive pode pertencer a uma raça fantástica ou recorrer a magia e poderes estranhos! Detetives investigam e resolvem crimes, identificam suspeitos, reúnem evidências e coletam informações. Alguns são oficiais de polícia, outros pertencem a agências privadas ou departamentos de segurança, e outros ainda são investigadores particulares com escritórios próprios. Diferente de um caça-prêmios, o detetive atua quando existe algum mistério envolvido, como localizar pessoas desaparecidas, descortinar fraudes e crimes financeiros, determinar o verdadeiro culpado de um delito, ou simplesmente descobrir como um crime aconteceu. Na Era das Arcas, detetives muitas vezes unem-se a aventureiros para procurar pistas e solucionar casos. Alguns detetives são mais cerebrais, outros resolvem tudo com pistolas ou punhos; um método investigativo popular (praticado por certo vigilante fantasiado de morcego) consiste em sair pelas ruas espancando bandidos até algum deles dizer o que você precisa saber!","powers":[{"name":"Elementar!","description":"Uma vez por cena, você pode usar Percepção para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Obter informação","description":"Quando tem um crítico em um teste de Manha ou Percepção, em vez de somar o atributo outra vez, você pode escolher obter uma Pista (anote P, a lápis, em algum lugar da ficha). Você pode fazer isso até três vezes por cena. Em outros testes de Manha ou Percepção, você pode gastar uma ou mais Pistas; cada Pista concede um crítico automático. Pistas não usadas até o fim da cena esfriam e são perdidas."},{"name":"Caso encerrado","description":"Em sua presença, inimigos derrotados permanecem nessa condição até o fim da cena, mesmo se recuperam PV."}],"page":19},{"name":"DPS","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"P3, Ataque Especial (qualquer)","description":"DPS é abreviação para damage per second, “dano por segundo”. Outrora usado apenas em videogames, o termo acabaria adotado também por grupos Arcanautas e outros aventureiros, para definir aqueles que resolvem problemas e superam obstáculos simplesmente zerando seus Pontos de Vida! Como fazem isso depende de seus métodos, mas basicamente existe o melee DPS (combate corpo a corpo) e o ranged DPS (longa distância). Ambos são presença quase obrigatória em qualquer grupo Arcanauta, acompanhados por tanques e curandeiros. De fato, grupos credenciados pela BUSCA exigem a presença de pelo menos dois DPS — embora outros personagens com poder ofensivo também sejam aceitos na função. DPS são focados em causar dano, em detrimento de outras capacidades — sobretudo defesa. Podem ser espetaculares em atacar, mas dependem de companheiros habilidosos em funções diferentes para outros tipos de desafio. Desnecessário dizer, DPS são encontrados em praticamente todos os núcleos, sendo mais populares na exploração de Arcas, torneios da Ilha do Martelo e missões de Tormenta ALPHA.","powers":[{"name":"Estilo de combate","description":"Escolha entre melee ou ranged. Você recebe Especialização (Luta) para atacar Perto (melee) ou Longe e além (ranged). No entanto, é considerado Inapto para qualquer defesa e para ataques no estilo não escolhido."},{"name":"Ataque gratuito","description":"Uma vez por cena, você pode usar um Ataque Especial sem gastar PM."},{"name":"Último recurso","description":"Quando você está perto da derrota, todos os seus ataques no estilo escolhido têm Ganho."}],"page":20},{"name":"Druida","nuclei":"Era das Arcas, Guerra da Galáxia, Operação ARSENAL","requirements":"Animais; Ajudante, Transformação; Código Dahllan","description":"Entre os seres com habilidades fantásticas trazidos com as Convergências, existem os defensores da Mãe Natureza conhecidos como druidas. O que faziam em seu mundo nativo, ninguém sabe ao certo. Aqui, contudo, assumem a missão de proteger a vida natural — que confiam ser a verdadeira origem de seus poderes. Tornam-se não apenas ativistas contra o desmatamento e caça ilegal, mas inimigos de tudo e todos que ameaçam o equilíbrio ecológico. O que muitas vezes inclui corporações inescrupulosas, invasores alienígenas e — claro — monstros.","powers":[{"name":"Forma selvagem","description":"Sua Transformação permite mudar para várias feras poderosas com habilidades diferentes. Cada vez que muda para sua segunda forma, escolha duas vantagens extras entre as seguintes, sem custo: Aceleração, Ágil, Alcance 1, Forte, Imune (Anfíbio, Doenças ou Resiliente), +Membros, Paralisia, Regeneração, Sentido (Aguçado, Infravisão ou Radar), Vigoroso, Voo."},{"name":"Irmãos selvagens","description":"Onde você estiver, animais (e plantas!) surgem para ajudá-lo. Você pode mudar seu Ajudante para um tipo diferente no início de cada cena."},{"name":"Dádiva da natureza","description":"Animais (e plantas!) ajudam em suas tarefas. Uma vez por cena, você pode usar Animais para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena. Código Dahllan (–1 pt) Não consumir produtos de origem animal. Nunca atacar um animal, nem deixar de prestar ajuda a um animal em dificuldade."}],"page":21},{"name":"Elementalista","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Magia, Ambiente, Fraqueza","description":"Magia é algo que este mundo apenas começou a compreender. No além-Convergência, contudo, existem escolas de magia focadas em seus muitos aspectos. A Escola Elementalista é formada por magos especializados em um único elemento da natureza. Além dos quatro clássicos (água, vento, fogo, terra) existem outros, como gelo, eletricidade, metal, madeira, luz, trevas, vácuo. Elementalistas manipulam com precisão o elemento de sua especialidade, usando-o para construir, destruir, curar, lutar. Mas todo elemento tem um oposto — às vezes óbvio, como água/fogo, vento/terra ou luz/trevas, mas nem sempre. Essa sempre será sua fraqueza. Poderes elementais nem sempre seguem nossas leis naturais. Um grande elementalista pode curar com fogo, afogar com terra, golpear com vento, soprar com água, profanar com luz, queimar com trevas! Façanhas impossíveis com elementos impróprios faz parte desta escola de magia.","powers":[{"name":"Ambiente elemental","description":"Seu elemento escolhido é seu Ambiente. A desvantagem segue suas regras normais (ao rolar 1 em 1D, Perda em todos os testes). No entanto, se rolar 6, seu elemento existe em abundância na cena; você tem direito a uma utilização de Magia sem gastar PM."},{"name":"Elemento primordial","description":"Você sabe controlar seu elemento para conseguir efeitos variados. Uma vez por sessão, com um movimento e 3PM, você adquire uma perícia ou vantagem de custo 1pt à sua escolha, até o fim da cena. Você ainda deve pagar quaisquer outros custos da vantagem escolhida."},{"name":"Moldar essência","description":"Na primeira rodada de cada cena, você pode mudar seus atributos e perícias livremente — mas não vantagens, desvantagens e técnicas. Você reverte à forma normal no fim da cena. Fraqueza Elemental (–1-2 pt) Escolha um elemento oposto, diferente do seu, como sua Fraqueza. Decida se é comum ou incomum. A desvantagem segue suas regras normais (Perda em todos os testes se estiver Perto)."}],"page":22},{"name":"Engenheiro Mecha","nuclei":"Guerra da Galáxia, UniPotência","requirements":"Máquinas; Utensílio (ferramentas)","description":"Neste mundo de altíssima tecnologia, naves estelares, robôs gigantes e construtos vivos, o engenheiro mecha emerge como um herói pioneiro e visionário, um campeão do progresso e esperança. Sua mente brilhante projeta, constrói e até pilota engenhos fantásticos. Com perícia incrível, faz mechas ganharem vida como um elo inquebrável entre pessoa e máquina. O engenheiro mecha não atua simplesmente na manutenção de construtos imensos, longe disso. Ele é um inventor fabuloso, um mestre da maquinaria pesada, capaz de controlar ou construir qualquer coisa — desde armas e armaduras cibernéticas a computadores e veículos robóticos incríveis. Sempre será, também, o melhor amigo dos golens e androides — sempre pronto a fazer reparos ou ampliar suas capacidades. Este herói do amanhã não é apenas um mecânico habilidoso, mas também um brilhante estrategista e solucionador de problemas. Adapta mechas para qualquer situação, batalhando inimigos gigantes ou realizando resgates ousados em situações de emergência. O engenheiro mecha acredita na capacidade da tecnologia para forjar um futuro melhor.","powers":[{"name":"A ferramenta certa","description":"Não há problema que algumas marteladas não resolvam. Uma vez por cena, você pode usar Máquinas para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Engenheiro de campo","description":"Você pode criar ou improvisar aparelhos na hora. Se bem-sucedido em um teste de Máquinas (9), gaste 1PM para ter um Ajudante de tipo à sua escolha, até o fim da cena. Você ainda deve pagar PM por cada utilização do Ajudante."},{"name":"Martelinho de ouro","description":"Você pode gastar uma ação para fazer um teste de Máquinas (9). Se bem-sucedido, cura 2D PVs em um personagem construto Perto, ou soma 1D ao seu próximo teste. (Esse personagem pode ser você, caso seja um construto.)"}],"page":23},{"name":"Entidade Exilada","nuclei":"Era das Arcas, Guerra da Galáxia, UniPotência","requirements":"nenhuma.","description":"Sejam trazidos pelas Convergências, invocados por rituais de conjuração, ou náufragos de outros planetas, muitos seres não chegaram a este mundo por livre vontade. Ou, quando vieram, não planejavam ficar. Uma entidade exilada é qualquer ser estrangeiro — alien, abissal, celestial, fantasma, Viajantes em geral — impossibilitado de voltar a seu mundo nativo. Alguns apenas se escondem em lugares remotos ou assumindo disfarces. Outros fazem seu melhor para tentar se adaptar, adotando o modo de vida local, até encontrar um meio de voltar para casa. Um meio e, talvez, um motivo — caso tenha se apegado aos amigos da Terra. Entidades exiladas podem ser desconcertantes quando conseguem se integrar à nossa cultura, seja trabalhando em lanchonetes, conquistando fama ou ascendendo em corporações. Seu vizinho pode ser um demônio, ou metaliano, ou algo ainda mais esquisito! Não é surpresa, portanto, que tantos acabem como aventureiros; seus poderes estranhos podem ser mais úteis explorando Arcas do que atendendo clientes no balcão da cafeteria. O que não impede muitos de fazê-lo.","powers":[{"name":"Não conheci o outro mundo por querer!","description":"Em testes de morte, você pode rolar 1D extra e descartar o dado mais baixo."},{"name":"Sorte extraplanar","description":"Seus dons incomuns funcionam na hora certa. Uma vez por sessão, você pode usar uma vantagem, técnica ou Energia youkai (a seguir) sem gastar PM."},{"name":"Energia youkai","description":"Você pode usar uma ação para gastar qualquer quantidade de PM e curar PV, em você mesmo ou alguém com quem tenha Elo Mental. Cada 2PM curam 1PV."}],"page":24},{"name":"Estudante","nuclei":"Guerra da Galáxia, UniPotência","requirements":"Qualquer perícia; Mentor","description":"Você deve saber o que é um estudante. Mas sabe como é ser um estudante na Era das Arcas? O mundo mudou e, com ele, mudaram as formas de entendê-lo. Mudaram os meios de adquirir conhecimento, desenvolver habilidades, contribuir com a sociedade, preparar-se para o futuro. Profissões antigas desapareceram, mil outras novas surgiram. E embora exista ensino remoto, ainda há escolas, universidades, academias — mas muito diferentes de como você as conhece. Teoria da magia, anatomia alienígena e procedimentos para ataque de kaiju são coisa rotineira. Salas de aula usam realidade virtual, mágica ilusória e conjuração de criaturas para melhor imersão na matéria. Tarefas de casa envolvem construir robôs, decifrar escrituras ou traçar diagramas alquímicos básicos. Clubes escolares dedicam-se a magibol, subcultura élfica, engenharia espacial e estudo das Arcas. A escola moderna é onde vive-se as primeiras grandes aventuras, onde nascem as mais fortes amizades, os mais acirrados torneios, os mais desastrados romances. Seja na lendária UniPotência, onde formam-se magos, heróis, ninjas, pilotos mecha e intendentes; seja na escolinha do bairro, onde uma professora qareen teletransporta a classe inteira para estudar unicórnios em seu habitat natural.","powers":[{"name":"Hora do intervalo","description":"Após uma cena de conflito, você recebe uma refeição básica (Ganho em um único teste, à sua escolha, até o fim do dia). Você não recebe uma nova refeição antes de consumir a anterior."},{"name":"Prova real","description":"Você pode pagar 2PM para rolar 1D extra em um teste de perícia que possua, e descartar o resultado mais baixo."},{"name":"Quem não cola","description":"Você pode usar a vantagem Mentor uma segunda vez por cena."}],"page":25},{"name":"Exército da Luz","nuclei":"Guerra da Galáxia","requirements":"Patrono","description":"No passado recente, membros de forças especiais como os Boinas Verdes, Força Delta, Seals, Spetsnaz e outras eram considerados os melhores soldados do mundo. Hoje, com inimigos muito mais perigosos que terroristas ou nações hostis, esse título pertence aos membros do Exército da Luz. Seus soldados personificam a coragem, honra e esperança em um mundo repleto de perigos. Seu compromisso com a justiça e a proteção da humanidade os torna heróis incomparáveis, prontos para enfrentar qualquer desafio com otimismo e determinação. Treinados e equipados para combater o que existe de pior no universo, o Exército da Luz são os defensores finais do planeta contra extraterrestes, kaijus e outras ameaças. Diferente de qualquer força armada tradicional, seus membros têm nacionalidades e origens variadas — grande parte, inclusive, é formada por não-humanos. Por suas façanhas, muitas vezes conquistam grande prestígio público. São reconhecidos e admirados como heróis, inspirando jovens a ingressar em suas academias e integrar suas fileiras. O Exército da Luz tem acesso a armas e equipamentos incríveis, usando tecnologia alienígena conquistada no campo de batalha. E embora atuem em suas próprias tropas, não é raro que soldados sejam designados para integrar ou comandar grupos de mercenários aventureiros em missões especiais.","powers":[{"name":"Artilharia total","description":"Uma vez por cena, você pode fazer um Ataque Especial de até 3pt à sua escolha. Você ainda deve pagar seu custo em PM."},{"name":"Armadura radiante","description":"Por seu treino rigoroso e tecnologias de proteção, você adiciona 1D a qualquer teste para resistir a efeitos nocivos (incluindo testes de defesa), descartando o dado mais baixo."},{"name":"Ombro a ombro","description":"Você pode gastar 2PM para conceder Ganho a um teste de um aliado Perto."}],"page":26},{"name":"Experimento","nuclei":"Guerra da Galáxia, Operação ARSENAL","requirements":"Imune; +Mana ou +Vida","description":"A tecnologia e magia proporcionadas pela Era das Arcas vem permitindo produzir novas formas de vida, novos seres — ou modificar profundamente aqueles já existentes. Os propósitos de tais experimentos podem ser nobres ou nefastos. E os resultados podem ser maravilhosos ou trágicos. Embora aberrantes e construtos sejam os casos mais comuns, praticamente qualquer criatura pode nascer em laboratório — até mesmo aquelas tradicionalmente místicas, como dahllan, fadas, vampiros e outras. O fruto de um experimento pode ser bem-sucedido, glorioso, até mesmo amado por seus criadores; ou algo monstruoso, marcado por dor e revolta, rechaçado e ressentido por sua origem maldita. Talvez ele sequer conheça a verdade sobre seu passado, acabando obcecado por desvendar esse mistério, descobrir o propósito de sua criação. Em qualquer dos casos, terá que escolher entre usar seus poderes exóticos para o bem ou o mal. Mesmo neste mundo de seres tão variados, um experimento está sempre sozinho. Talvez procure companhia entre pessoas tão estranhas quanto ele, como algum grupo de aventureiros. Ou pode acabar, ele próprio, como um monstro caçado por eles.","powers":[{"name":"Adaptação","description":"Você tem duas formas de imunidade pela vantagem Imune, em vez de uma."},{"name":"Bioenergia","description":"Em vez de +10, você recebe +15PM ou +15PV pela vantagem +Mana ou +Vida (escolha uma)."},{"name":"Mutação","description":"Escolha um atributo. Sempre que faz um teste com o atributo escolhido, você pode pagar 2PM para rolar 1D extra e descartar o dado mais baixo."}],"page":27},{"name":"Gatuno Galante","nuclei":"Era das Arcas, Tormenta ALPHA","requirements":"Manha; Ágil, Carismático ou Gênio","description":"O gatuno galante é um virtuoso na arte da infiltração e escapadas ousadas — um artista da dissimulação, elegância e charme. Operando nas sombras ele combina astúcia, intelecto e refinamento para realizar façanhas incríveis. Desliza pela escuridão com graça, silencioso e sem deixar rastro, mas seu porte e presença carismáticos também permitem se misturar em ambientes sociais. Por sua inteligência aguçada, o gatuno é habilidoso em decifrar enigmas, quebrar códigos e planejar estratégias de infiltração intrincadas. É também um mestre da retórica, capaz de persuadir com suas palavras envolventes; pode obter informações valiosas ou recrutar aliados de maneira convincente, recorrendo a seu charme e astúcia. A missão do gatuno é desvendar segredos, recuperar tesouros perdidos e desafiar autoridades corruptas. Ele opera na fronteira entre herói e anti-herói, usando seus talentos para combater a injustiça e restaurar o equilíbrio. O gatuno acredita em adotar identidades falsas, aplicar artimanhas e usar sua elegância para alcançar um bem maior. Suas aventuras são repletas de charme, mistério e reviravoltas, cativando aqueles que cruzam seu caminho.","powers":[{"name":"Ardiloso","description":"Você pode pagar 3PM para ter os benefícios da vantagem Confusão, Invisível, Inofensivo ou Telepata durante um turno. Você ainda deve pagar outros custos em PM se houver."},{"name":"Reconhecimento de terreno","description":"Uma vez por sessão, por ter investigado o lugar antes, você pode escolher o local de uma cena como Arena."},{"name":"Um passo à frente","description":"O gatuno escapa do veneno porque já tomou o antídoto! Você pode gastar 2PM para ter Ganho em um teste para evitar qualquer efeito negativo (exceto dano). Você pode fazer isso um número de vezes por cena igual à sua Habilidade."}],"page":28},{"name":"Gigante da Luz","nuclei":"Guerra da Galáxia, UniPotência","requirements":"Transformação; Código do Combate e Heróis","description":"Gigantes da luz são guerreiros de estrelas distantes que protegem o universo contra os kaiju e vilões que os utilizam. Em suas formas naturais, são humanoides gigantescos com pelo menos 50m de altura. Contudo, quando se estabelecem na Terra em longas missões, tomam como hospedeiro o corpo de algum nativo digno. Esse campeão pode ser escolhido após algum ato de grande nobreza e coragem, quando arrisca ou até sacrifica a própria vida — sendo ressuscitado pelo herói alienígena, que agora reside em seu corpo. O escolhido pode então se transformar em gigante da luz por breves períodos, em situações de perigo extremo. Alguns gigantes comunicam-se mentalmente com o escolhido, mas muitos permanecem em silêncio misterioso. Outros obedecem a mestres secretos que autorizam ou possibilitam a transformação. Quase todos exigem que o escolhido guarde segredo, ou aceitam ser revelados apenas para companheiros próximos.","powers":[{"name":"Poder interior","description":"Sua forma original é aprimorada. Escolha entre Forte, Ágil ou Vigoroso. Esta vantagem também se aplica à segunda forma."},{"name":"Transformação gigante","description":"Você tem uma segunda forma, seguindo as regras normais desta vantagem, exceto que também eleva sua escala para Kiodai até o fim da cena. Esta forma também recebe as vantagens Alcance (uma variedade de raios e lâminas de energia), Golpe Final e Voo, sem custo. Um sinal piscante avisa quando você está perto da derrota, e você reverte para a forma normal caso seja derrotado. Esta Transformação não pode ser executada se não existir adversário de escala Kiodai em cena, nem em caso de violação dos Códigos."},{"name":"Transformação menor","description":"Você pode adotar sua segunda forma em tamanho normal, com as mesmas vantagens, poderes e limitações, mas sem mudar de escala."}],"page":29},{"name":"Guerreira Mágica","nuclei":"Era das Arcas, UniPotência","requirements":"Mística; Magia","description":"Nem todos aqueles que protegem o mundo são soldados embrutecidos em armaduras pesadas. Às vezes nossa salvação vem embalada em vestidinhos, lacinhos e babados. A guerreira mágica é um símbolo de pureza, coragem e esperança contra a escuridão e as forças do mal. Uma heroína destinada a proteger a humanidade, usando poderes mágicos e atitude positiva (ainda que nem todas aceitem essa nobre missão por livre vontade...). Uma guerreira mágica sabe que amizade, amor e compaixão são armas tão poderosas quanto qualquer magia. Com o coração cheio de confiança, está disposta a enfrentar vilões, resgatar reféns e salvar o dia, ainda deixando tempo para a lição de casa. Guerreiras mágicas contam com uma variedade de feitiços e ataques, desde rajadas de energia a invocações de elementos. Muitas também têm parceiros como fadas ou animais encantados, que auxiliam em suas missões fornecendo sabedoria e suporte. Algumas podem ser vaidosas, teimosas, medrosas ou preguiçosas, mas todas sempre deixam essas fraquezas de lado quando existe algum mal a ser punido.","powers":[{"name":"Auxílio mágico","description":"Quando usa Magia para emular efeitos de vantagens (veja em +Magia), você gasta PM igual ao custo da vantagem (em vez de x3) para Ataque Especial (qualquer), Ajudante (qualquer), Alcance e Mentor."},{"name":"Punirei você!","description":"Contra um alvo perto da derrota, seu custo em PM para Magia cai pela metade. Apesar do nome, você também pode usar este poder para ajudar aliados em perigo."},{"name":"Transformação radiante","description":"Você pode gastar um movimento para vestir seu traje mágico de combate (com musiquinha e coreografia). Nesta forma, pode gastar 2PM para ter Ganho em um teste de Mística, e testes para descobrir sua verdadeira identidade sofrem Perda. A transformação dura até o fim da cena."}],"page":30},{"name":"Guerreiro","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Luta; Ataque Especial ou Defesa Especial","description":"Enquanto muitos aventureiros escolhem métodos mirabolantes ou magias firulentas para vencer desafios, o guerreiro é simplesmente alguém que supera obstáculos através de combate. Usará os próprios punhos, armas, poderes ou técnicas de luta para derrubar o que estiver na frente. Para ele, violência costuma ser a resposta — mesmo quando gostaria de evitá-la. Para o verdadeiro guerreiro, lutar não é apenas um meio para alcançar um objetivo — lutar é o próprio objetivo. Talvez ele sonhe se tornar o lutador mais forte do mundo. Talvez viva procurando lutas para esquecer algum evento passado, cumprir uma promessa importante, ou realizar um grande destino. Ou ainda, talvez ele acredite existir apenas com esse propósito, sendo incapaz de apreciar ou valorizar qualquer outra coisa na vida. Mas nem todo guerreiro é amargurado ou conformado. Pelo contrário, alguns lutam para que outros não precisem, lutam por um futuro sem guerras, sem necessidade de conflito. Guerreiros podem ser cordiais, calorosos e otimistas, reunindo amigos para desfrutar seus raros momentos de paz. Pois cada um pode ser o último.","powers":[{"name":"Lutar é tudo!","description":"Quando faz um teste de Luta, você pode gastar 2PM para adicionar +3 ao resultado, após a rolagem (antes do oponente rolar a defesa)."},{"name":"Manobra especial","description":"Uma vez por cena, você pode usar um Ataque ou Defesa Especial sem gastar PM."},{"name":"Sem parar","description":"Quando reduz um oponente a 0PV de forma violenta, você pode imediatamente fazer um ataque contra outro oponente ao alcance."}],"page":31},{"name":"Herói Sentai","nuclei":"Era das Arcas, Guerra da Galáxia, UniPotência.","requirements":"Elo Mental, Golpe Final, Patrono.","description":"Um herói sentai, como sugere o nome, atua como membro de um superesquadrão em defesa do planeta. Sempre atuando em equipe, é um exemplo vivo de que a união faz a força. Formidável sozinho, mas invencível com seus aliados. Salvo raras exceções, todas as equipes sentai no mundo respondem a uma mesma liderança, a organização Defensores da Terra. Entre seus comandantes estão a entidade extradimensional Antena-Z (ou apenas Zeta) e também os membros fundadores do primeiro esquadrão, Furuutsu Sentai. De sua base central na lua, Zeta convoca equipes para missões por todo o planeta e além, provendo transporte e equipamentos conforme a tarefa. O típico herói sentai usa um uniforme colorido, de altíssima tecnologia, que amplia suas capacidades. Seus poderes seguem um tema: bandas de black metal, constelações do zodíaco, carros populares, frutas, insetos, anfíbios, times de futebol... não importa. Embora atue quase sempre com outros agentes de mesmo tipo, existem aqueles que adotam um grupo Arcanauta, ou outros aventureiros, como seu esquadrão.","powers":[{"name":"Hora de sincronizar","description":"Seu Elo Mental funciona com todos os seus aliados (no máximo 5). Eles não precisam ter também esta vantagem, mas recebem seus benefícios."},{"name":"Soltar faísca","description":"Quando você sofre dano, pode escolher pagar 1PM para anular 3 pontos de dano."},{"name":"Finalização","description":"Quando você executa um Golpe Final, cada aliado pode escolher pagar 3PM para somar seu próprio Poder a esse ataque."}],"page":32},{"name":"Idol","nuclei":"Era das Arcas, Operação ARSENAL","requirements":"Arte; Carismática, Famosa","description":"Uma idol é uma estrela radiante que brilha nos palcos e telas, cativando o público com seu talento, beleza e personalidade vibrante. Ela encanta com a voz graciosa, dança empolgante e trajes deslumbrantes. É uma diva inspiradora, elevando corações com positividade e esperança. Muito mais que uma simples artista, é uma fonte de alegria e admiração, capaz de unir multidões com sua presença carismática e performances espetaculares. Quando decide se aventurar, a idol canaliza seu carisma para se tornar uma heroína otimista e corajosa. Ela eleva o espírito dos aliados, inspira bravura e liberta o poder da canção como uma arma contra as trevas. Utiliza seu encanto para influenciar pessoas e cativar multidões, conquistando aliados e recursos valiosos para as missões. Seu talento para a dança não é apenas impressionante, mas também eficaz em campo de batalha, com movimentos coreografados que guiam aliados e desorientam os inimigos. Uma idol acredita que sua música e alegria podem superar qualquer obstáculo, unir corações e transformar as situações mais sombrias em triunfos brilhantes.","power
