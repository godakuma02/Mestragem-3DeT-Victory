s":[{"name":"Seu sorriso","description":"Para você a vantagem Carismática oferece P+3, em vez de +2."},{"name":"...É tão resplandecente!","description":"Você faz tudo de forma artística. Uma vez por cena, você pode usar Arte para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Me dê a mão!","description":"Em caso de sucesso em um teste de Arte (9), você pode gastar um movimento e 1PM para conceder Ganho a um aliado que consiga ver e ouvir você."}],"page":33},{"name":"Ilusionista","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Arte, Mística ou Telepata; Ilusão","description":"Ilusionistas podem ser conjuradores verdadeiros, ou não. Podem usar mágica real, truques de palco ou poderes mentais para controlar aquilo que seus alvos percebem. Tais habilidades são terríveis nas mãos de vilões, mas há aqueles que escolhem usá-las para proteger o mundo. Ilusionistas são, em essência, criativos e astutos. Adoram desafios mentais, raramente encontrando situações que não possam contornar com imaginação. São membros valiosos no grupo de aventureiros, usando ilusões para distrair e confundir inimigos. Ainda que fraco em combate, um ilusionista imaginativo é oponente perigoso: um ogro ilusório pode estar apenas distraindo você enquanto o verdadeiro atacante se aproxima pelas costas... Com personalidade otimista e mente afiada, o ilusionista pode ser um brincalhão incorrigível, mas também a voz da esperança em momentos sombrios. Ele sabe que qualquer obstáculo pode ser superado quando a mente é flexível.","powers":[{"name":"Gambito ilusório","description":"Seus inimigos não sabem quando atacam você ou uma ilusão! Uma vez por rodada, você pode gastar 1PM para ter Ganho em um teste de defesa."},{"name":"Glamour","description":"Você pode usar seus poderes para mudar a própria aparência (Ganho em testes de Manha) ou a aparência de aliados e objetos, conforme os limites de tamanho normais para Ilusão. Essas ilusões se movem juntamente com seus alvos e não gastam movimentos do ilusionista."},{"name":"Ilusão autônoma","description":"Você pode criar uma ilusão que age sozinha, sem gastar seus movimentos (mas você ainda precisa ser capaz de vê-la), pelo custo normal em PM. Você pode manter ativa apenas uma ilusão deste tipo. No entanto, você ainda é livre para criar outras ilusões."}],"page":34},{"name":"Impostor","nuclei":"Era das Arcas, Guerra da Galáxia, UniPotência","requirements":"Influência; Imitar","description":"Mestre do disfarce, o impostor é especializado em personificar outras pessoas. Podem alcançar esse objetivo por meios mundanos como roupas e maquiagens, ou métodos fantásticos — magia ilusória, poder camaleônico, hipnose, tecnologia de hologramas. O impostor realmente hábil não imita apenas aparência, voz e gestos — ele adquire até mesmo talentos de seus alvos, fingindo conhecimentos ou habilidades que na verdade não tem. Adota posturas de luta como um guerreiro, exibe truques como um mago, desfila termos complicados como um cientista — e na ponta da língua, sempre uma desculpa para quando seus “poderes” não funcionam. Impostores podem adotar disfarces rápidos, improvisados, para sumir na multidão ou enganar adversários casuais — ou mergulhar profundamente em papéis duradouros, a ponto de convencer até conhecidos íntimos do alvo. Alguns são nobres, agindo para proteger o mundo, enquanto outros são vilões perigosos.","powers":[{"name":"Disfarce perfeito","description":"Com um movimento e 3PM, você pode assumir a aparência de qualquer pessoa ou criatura que conheça ou consiga ver (para alvos que não conheça, use a vantagem Imitar). É impossível enxergar através de seu disfarce, exceto com Telepatia ou Sentidos, e mesmo assim o teste de Percepção tem Perda."},{"name":"Engenheiro social","description":"Uma vez por cena, você pode usar Influência para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Jogo da imitação","description":"Você pode copiar e manter duas vantagens por vez com Imitar, em vez de uma."}],"page":35},{"name":"Intendente","nuclei":"Quais ele quiser.","requirements":"Arte ou Sobrevivência; Improviso","description":"Intendentes. Criados. Copeiras. Mordomos. Maids. Butlers. Eles podem ter vários nomes, podem ser vistos apenas como servos. Mas nada, nada poderia estar mais distante da verdade. Mesmo nesta era de artistas marciais extremos, equipes sentai explosivas, policiais do espaço e pilotos mecha, são os intendentes que realmente asseguram a paz no mundo. Não se deixe impressionar pela equipe de super-heróis coloridos. Veja aquele mordomo ali, servindo chá: ele é o membro mais perigoso! Formados exclusivamente no Instituto Maior de Intendência na cidade de Akibara, intendentes passam por treinamentos que fariam um ninja chorar. Enquanto heróis “comuns” exploram Arcas, enfrentam a Guerra da Galáxia ou lutam na Ilha do Martelo, intendentes fazem tudo isso em seus momentos de folga. Suas missões épicas envolvem jornadas pelo espaço e tempo, através de outras dimensões, lidando com perigos cósmicos que nem mesmo deuses ouviram falar. Os seguintes poderes representam intendentes ainda em treinamento ou recém-formados, disponíveis para jogadores. Quanto aos melhores alunos de cada turma, suas habilidades fantásticas quebrariam o jogo (e o mundo) em meio segundo.","powers":[{"name":"Excelência","description":"Quando consegue um crítico em um teste de perícia que possua (incluindo perícias aprendidas com Improviso), você pode gastar 3PM para somar o atributo no teste mais uma vez."},{"name":"Housekeeping","description":"Você é especialista em economia doméstica e administração de recursos. Por 3PM, escolha um número máximo de aliados voluntários (incluindo você, se quiser) igual à sua Habilidade. Eles somam seus PM atuais. Esse total é compartilhado por todos até o fim da cena, ou até você ser derrotado. Se o efeito acaba, os PM restantes são divididos igualmente (arredonde para baixo)."},{"name":"Sempre a postos","description":"Você gasta 2PM (em vez de 3) para aprender perícias com Improviso. Além disso, pode manter até duas perícias ao mesmo tempo."}],"page":36},{"name":"Ladino","nuclei":"Era das Arcas, Tormenta ALPHA","requirements":"Manha; Ágil ou Gênio","description":"Muito mais que um simples criminoso, o ladino é um aventureiro ousado e inventivo, que recorre a meios não convencionais para alcançar vitórias. Enquanto o guerreiro usa aço e o mago usa magias, o ladino não confia em qualquer dos dois — ou utiliza ambos! Seu método é não ter método. A surpresa é sua arma. Então, sendo inesperado e imprevisível, não pode ser detido. Sim, você conhece aqueles ladinos de RPG que movem-se furtivamente, destrancam fechaduras, desativam armadilhas. Mas na Era das Arcas, com poderes extremos em jogo, o ladino precisa ser muito mais. Ele brilha como um mestre da astúcia e destreza, personificação da agilidade e versatilidade. Enxerga além do óbvio e encontra soluções engenhosas para desafios complexos. Com esperteza afiada e sorriso confiante, o ladino domina a arte do ataque-surpresa. Mas sua verdadeira força reside na capacidade de desvendar segredos, farejar tesouros e decifrar os planos dos adversários. Ele não tem respeito por regras e leis, é verdade. Mas muitos ladinos, contrariando o que se espera, usam suas habilidades para fazer justiça.","powers":[{"name":"Ataque furtivo","description":"Quando ataca um alvo desprevenido, você pode gastar 2PM para reduzir em –1 sua Resistência para defesa. Você também pode gastar +1PM para fazer um ataque furtivo contra um alvo envolvido em combate com um aliado."},{"name":"Malandragem","description":"Para tudo se dá um jeitinho. Uma vez por cena, você pode usar Manha para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Trapaça","description":"Ao usar um poder surpreendente (veja em +Ação!!!), você pode gastar 1 Ponto de Ação para ter qualquer vantagem (mesmo aquelas que custam mais de 1pt)."}],"page":37},{"name":"Maginauta","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Magia, Mística","description":"Quando uma barreira mágica bloqueia uma passagem importante, quando o feiticeiro maligno encanta sua horda de mortos-vivos com encantos imbatíveis, quando um mago comum simplesmente não tem poder suficiente, há ainda esperança, um outro herói a quem recorrer: o maginauta. Ele é o hacker do mundo mágico, surfista das ondas místicas, cowboy das fronteiras da realidade. Aquele que domina as terras e complicações do magiespaço, dimensão cósmica onde a magia é criada e manipulada. Maginautas são estranhos. Por sua percepção diferenciada da realidade, não raro se tornam reclusos e distantes do mundo real, absorvidos em suas viagens e incursões no magiespaço, por vezes sem comer, beber ou dormir por dias. Mas, no magiespaço, estão em seu ambiente familiar: surfam ondas místicas, percorrem distâncias impossíveis, anulam feitiços julgados invencíveis. Não há limites para um maginauta habilidoso!","powers":[{"name":"Imersão","description":"Você usa uma ação completa e 2PM para imergir a consciência no magiespaço. Enquanto está ali seu corpo físico fica imóvel e indefeso, mas você sempre tem Ganho em testes de Mística, a vantagem Magia (e técnicas que a tenham como requisito) gasta metade dos PM, e pode afetar alvos até Muito Longe sem penalidade. No entanto, não pode interagir sem usar Magia com nenhum personagem ou objeto. Manter a imersão custa 1PM por rodada, e pode encerrá-la com um movimento."},{"name":"Interferência","description":"Você pode usar uma ação e 2PM para conceder Ganho ou causar Perda em um teste de Mística de outro personagem, que seja feito até seu próximo turno. No magiespaço, este poder gasta apenas um movimento."},{"name":"Sobrecarga","description":"Você sobrecarrega suas magias até quase estourar. Ao usar Magia, faça um teste de Mística (9). Com sucesso, recebe +2 no teste afetado. Cada crítico aumenta em +1. Em caso de falha a magia não tem efeito, mas ainda gasta PM (falha crítica gasta o dobro)."}],"page":38},{"name":"Mago","nuclei":"Era das Arcas, UniPotência, Tormenta ALPHA","requirements":"Mística; Magia","description":"Magia pode ser utilizada de forma bruta, manifestada por instinto, manipulada por simples vontade. Mas o verdadeiro mago é diferente. Este profundo estudioso recorre a fórmulas herméticas para conseguir efeitos mágicos acurados, específicos. Para o mago, magia é uma ciência tão complexa quanto física quântica ou quaisquer outras existentes no mundo moderno. Sendo impossível dominar a magia arcana sem muito estudo, magos são considerados grandes “nerds” entre os aventureiros. Cercam-se de grimórios grossos e pergaminhos antigos, mergulham em longas noites de pesquisa, sacrificando a própria saúde. Há também aqueles que recorrem às conveniências do mundo moderno, registrando magias em celulares e tablets, armazenando feitiços na nuvem, debatendo sobre conjurações em fóruns online — ou adquirindo educação formal no Liceu de Artes Arcanas da UniPotência. Magos são metódicos, inteligentes e brilhantes, muitas vezes ascendendo em corporações ou assumindo a liderança em grupos Arcanautas. Em combate, são temidos a ponto de sempre serem atacados primeiro — pois a magia certa na hora certa pode decidir a vitória.","powers":[{"name":"Aptidão mágica","description":"Seu bônus máximo da vantagem Magia é H+2 (em vez de H)."},{"name":"Bateria de mana","description":"Uma vez por cena, você pode usar uma ação completa para recuperar 1D+H PM."},{"name":"Preparar magias","description":"Sempre que estiver com Pontos de Mana completos (tipicamente após um descanso) e não envolvido em conflito, você pode escolher deixar certas magias preparadas, otimizando o gasto de mana. Faça uma lista com os efeitos de Magia que preferir (por exemplo, +2 em ataque, +3 em defesa, +2 em uma perícia...). Você gasta metade dos PM para preparar essas magias. Elas não podem ser mudadas, e seus PM não podem ser recuperados, até você usá-las."}],"page":39},{"name":"Menestreamer","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Arte, Influência ou Carismático; Famoso","description":"O nome, claro, vem da combinação de “menestrel” e “streamer”. Na Era das Arcas, menestreamers (ou apenas “menes”) são os bardos modernos. São influencers que acompanham grupos Arcanautas, transmitindo suas aventuras e batalhas para seguidores online. Mas também sendo útil nas mesmas aventuras e batalhas. Espera-se! Mais que um simples narrador, cabe ao menestreamer inspirar os colegas, atuar como suporte valioso. Fará isso com descrições dramáticas, música climática, atuação audaciosa, elogios desavergonhados, manobras firulentas e qualquer outro meio ao alcance. Tornará cada ação dos companheiros uma façanha épica, momento comovente, exemplo inspirador ou fonte de gargalhadas. Expedições perigosas em masmorras escuras são transformadas em aventuras coloridas, emocionantes, divertidas. Cada mene tem seu estilo. Podem ser otimistas, engraçados, dramáticos ou até trágicos. Enquanto conquistam corações, curtidas e compartilhamentos, muitas vezes assumem o comando do grupo como líderes inspiradores — ou então fazem seu melhor para exaltar as qualidades do líder. Embora atuem principalmente na exploração de Arcas, menes também são vistos narrando combates na Ilha do Martelo, ou durante quests de Tormenta ALPHA, ou qualquer evento que seus seguidores gostariam de ver.","powers":[{"name":"Inspirar","description":"Você pode gastar um movimento e 3PM para conceder Ganho ao teste de perícia de um aliado Perto ou Longe. Esse teste deve ser realizado até o próximo turno do aliado; não é possível “guardar” para depois. Se já tiver este poder (pelo arquétipo Celestial ou outra fonte), o custo cai para 1PM."},{"name":"É meu amigo!","description":"Menes transformam seus companheiros em celebridades. Você pode pagar 1PM para conceder a um aliado os benefícios da vantagem Famoso durante uma cena."},{"name":"Audiência generosa","description":"Com um teste de Arte ou Influência (9), o menestreamer pode arrecadar doações de seus seguidores para ter Ganho em um teste de compra."}],"page":40},{"name":"Mercenário","nuclei":"Era das Arcas, Guerra da Galáxia, Operação ARSENAL","requirements":"Devoto, Patrono, Código","description":"Embora heróis tenham objetivos pessoais para se aventurar, vários consideram essa atividade uma profissão, trabalhando por pagamento. De fato, muitos acham que todos os aventureiros são apenas mercenários. Mas o verdadeiro mercenário é mais que isso. O mercenário tem uma reputação a zelar. Ele segue seu próprio código de honra: uma vez que aceite um contrato, vai cumpri-lo a qualquer custo, priorizar as necessidades de seu patrono acima de tudo. Sua lealdade pode ser comprada pelo preço certo — mas, uma vez adquirida, será absoluta. E quando falha, não mede esforços para compensar seu erro, mesmo que demore a vida inteira. Embora prefira agir sozinho, muitas vezes será ele a reunir um grupo de aventureiros, após negociar a missão com o contratante. Mercenários podem ser impiedosos, capazes de grandes crueldades quando o contrato exige (talvez até gostando disso). Outros, contudo, são generosos e nobres, sofrendo internamente quando obrigados a praticar injustiças.","powers":[{"name":"Nem morto","description":"Você não morre sem cumprir a missão. Enquanto tiver um contrato, sempre que fizer um teste de morte, role +1D e descarte o menor resultado."},{"name":"Melhor no que faz","description":"Você é devotado a cumprir seus contratos. Pode usar Devoto até três vezes por cena, em vez de duas."},{"name":"Trato feito","description":"No início de cada sessão, se não houver violação do Código (veja a seguir), você pode escolher mudar de Patrono, representando seu contratante atual. Além disso, em testes de compra para o Patrono, some +3 ao resultado final. Código do Mercenário (–1pt) Jamais trair seu Patrono. Jamais falhar em cumprir uma missão para seu Patrono. Este Código pode ser adquirido apenas por personagens com Patrono."}],"page":41},{"name":"Mestre-Cuca","nuclei":"Era das Arcas, UniPotência","requirements":"Arte ou Sobrevivência","description":"Nem todas as batalhas são vencidas com aço e magia. Às vezes, o caminho para a vitória passa pelo estômago. O mestre-cuca é um profissional culinário altamente treinado, especializado em alta gastronomia. Ele domina a arte de preparar uma ampla variedade de pratos, até criando suas próprias receitas exclusivas. Além de suas técnicas culinárias excepcionais, o mestre-cuca é capaz de harmonizar sabores, texturas e apresentações para criar experiências gastronômicas memoráveis, proporcionando a seus clientes e convidados um deleite inesquecível. Nem todos os mestres-cucas são chefs de cozinha em grandes restaurantes. Alguns escolhem correr riscos e participar de aventuras com objetivos variados: prover apoio a Arcanautas com boa comida, descobrir receitas miraculosas em livros e pergaminhos antigos, preparar pratos fabulosos com ingredientes das Arcas, provar sua habilidade ao mundo, ou apenas usar seu talento para fazer um amanhã melhor. Alguns podem ser geniosos e rabugentos, mas quase todos são figuras carismáticas, capazes de apaziguar o monstro mais furioso com o aroma de uma refeição sublime.","powers":[{"name":"Talento culinário","description":"Você recebe +3 em todos os testes de Arte e Sobrevivência para preparar refeições."},{"name":"Prato milagroso","description":"Uma vez por sessão, quando prepara uma refeição, você pode gastar Pontos de Ação para conceder uma vantagem (veja em +Ação!!!) como poder surpreendente a você mesmo ou um aliado, pela duração do efeito do prato."},{"name":"Despensa cheia","description":"Você começa cada sessão com um número de refeições básicas igual à sua Habilidade. Você pode trocar três refeições básicas por uma refeição gourmet, ou cinco básicas por uma refeição do chef que já conheça."}],"page":42},{"name":"Monge","nuclei":"Era das Arcas, Operação ARSENAL","requirements":"Ágil; Resoluto ou Vigoroso; 1ª Lei de Asimov","description":"Monges existem aqui e além-Convergência. Em ambos os lugares, suas tradições de meditação, combate desarmado e busca por harmonia têm milhares de anos. Agora, na Era das Arcas — entre arranha-céus, tecnologia avançada e magia assombrosa —, o monge moderno busca praticar seus ideais de pacifismo neste mundo novo e estranho. Monges buscam a paz, mas são combatentes excepcionais, tão resistentes quanto graciosos. Treinam corpo e mente à exaustão, adquirem agilidade incomparável, sendo quase impossível atingi-los ou derrubá-los. Correm, esquivam e saltam como se pudessem voar. Alguns podem! Um monge luta apenas para se defender, ou para proteger inocentes. Embora quase todos vivam enclausurados em mosteiros para treinos diários, alguns percorrem o mundo em jornadas de iluminação, até participando de grupos Arcanautas (tipicamente assumindo o papel de tanques) ou lutando na Ilha do Martelo.","powers":[{"name":"Agilidade superior","description":"Para você a vantagem Ágil oferece H+3, em vez de +2."},{"name":"Alma de aço","description":"Sempre que faz um teste de R (incluindo defesas), você pode gastar 1PM para aumentar em +1 o resultado de um dado. Esse poder não provoca acertos críticos, mas anula falhas críticas."},{"name":"Controle dos chakras","description":"Em situação de conflito, você pode gastar um turno completo para recuperar 1D+H PV ou 1D+H PM. Você pode usar este poder apenas se tiver pelo menos 1PV e 1PM."}],"page":43},{"name":"Motoqueiro Mascarado","nuclei":"Guerra da Galáxia, UniPotência, Operação ARSENAL","requirements":"Luta; Ajudante (Montaria)","description":"Existem poderes malignos capazes de transformar pessoas em monstros. Entidades misteriosas de além-Convergência, corporações buscando produzir supersoldados, cultos criando messias para guiá-los a uma nova era. Tais seres nem sempre aceitam o papel, rejeitando seus criadores (até enfrentando-os) e buscando seus próprios destinos. Tornam-se combatentes da justiça e da liberdade, correndo o mundo em suas motocicletas para ajudar os necessitados, sempre em busca do próximo desafio. Motoqueiros mascarados são assim chamados por usar máscaras literais, que conferem seus poderes — ou porque sua transformação oculta a verdadeira face. Além disso, cavalgam veículos especiais que podem ser motos ou criaturas vivas, ou ambos. Diferente de muitos heróis que obedecem a mentores ou patronos, estes espíritos livres seguem o próprio coração, até desafiando autoridades para fazer o que acham certo. Em geral atuam como guerreiros solitários, mas aceitam alianças ocasionais com outros heróis. Não existem muitos motoqueiros mascarados. Embora alguns tragam grande nobreza e esperança na humanidade, há também aqueles dominados pelo mal, aceitando plenamente o objetivo sinistro para o qual foram criados.","powers":[{"name":"Henshin","description":"Você pode gastar um movimento para invocar sua máscara e traje de combate, ou abandonar seu disfarce humano e reverter para sua forma verdadeira. Nesta forma, pode gastar 2PM para ter Ganho em um teste de Luta, e testes para descobrir sua verdadeira identidade sofrem Perda. A transformação dura até o fim da cena."},{"name":"Moto de batalha","description":"Você pode pagar 2PM para que seu ajudante atue como Lutador, em vez de Montaria."},{"name":"Até o fim","description":"Você não sofre Perda e pode seguir lutando normalmente quando está derrotado. Você ainda pode morrer se receber dano nesse estado."}],"page":44},{"name":"Necromante","nuclei":"Era das Arcas, Tormenta ALPHA, UniPotência","requirements":"Mística; Magia","description":"Na Era das Arcas, mortos-vivos não são sempre perigosos ou assustadores. Osteon, fantasmas e vampiros podem ser heróis. Ou seus vizinhos. Ou até atendentes no balcão da cafeteria. O mesmo vale para necromantes. Estes mestres da energia negativa podem ter sido apenas vilões em histórias de fantasia, mas no mundo moderno seus poderes são apreciados e prestigiados. Os mais poderosos conseguem até ressuscitar falecidos, ainda que um pouco mais pálidos: diz um ditado popular, o necromante é apenas um curandeiro meio atrasado! Um necromante é o melhor amigo dos aventureiros osteon e outros mortos-vivos, sendo capaz de prover-lhes cura e outros benefícios. Muitos, inclusive, escolhem eles próprios essa carreira para desfrutar seus poderes. Sua personalidade pode ser sinistra, soturna, fatalista (alguns são realmente malignos); mas também existem aqueles cordiais, otimistas, que aproveitam a vida — por contraditório que pareça!","powers":[{"name":"Criar morto-vivo","description":"Você conjura servos desmortos. Se bem- -sucedido em um teste de Mística (9), gaste 1PM para receber um Ajudante de tipo à sua escolha, até o fim da cena. Você ainda deve pagar PM por cada utilização do Ajudante."},{"name":"Energia negativa","description":"Suas vantagens de cura (incluindo um Ajudante Curandeiro) funcionam em seres Sem Vida* (mas não se aplica a descanso ou itens)."},{"name":"Fortificar morto-vivo","description":"Você gasta –1PM (mínimo 1) para usar Magia em seres Sem Vida*. *Incluindo você mesmo, se tiver essa desvantagem. O mestre pode vetar casos em que isso não se aplica, como ciborgues e construtos; ou fazer exceções, como vampiros."}],"page":45},{"name":"Negociador","nuclei":"Era das Arcas, Guerra da Galáxia, UniPotência","requirements":"Influência, Carismático","description":"Mesmo neste mundo de poderes violentos, ainda há aqueles que acreditam em superar desafios e derrotar inimigos com diálogo. Pois foi dito, não estarei destruindo meus inimigos quando os transformo em meus amigos? Um negociador é alguém habilidoso na arte de facilitar acordos e resolver conflitos. Com uma combinação de empatia, comunicação eficaz e conhecimento do assunto em questão, ele busca soluções mutuamente benéficas para as partes envolvidas, criando um ambiente que promove entendimento mútuo e resolução pacífica de disputas. Ele ouve atento, compreende necessidades e preocupações, propõe alternativas criativas. Para o negociador, palavras são mais poderosas que espadas. Nunca subestime um negociador empenhado e motivado! Ele será capaz de confundir capangas, acalmar monstros furiosos, abalar a convicção de vilões. Diante de olhares incrédulos, vai convencer uma porta a abrir, uma máquina quebrada a ligar, um veneno a cessar seu efeito. Quando ele tem chance de dialogar, literalmente tudo se resolve na conversa.","powers":[{"name":"Argumentação","description":"Uma vez por cena, você pode usar Influência para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"Empatia","description":"Você entende e questiona as motivações dos outros. Pode pagar 2PM para anular um Ganho em um teste de Poder (incluindo combate) realizado contra você."},{"name":"Palavras de conforto","description":"Sempre que qualquer poder de cura é utilizado em sua presença, o teste tem Ganho ou recupera +2PV."}],"page":46},{"name":"Ninja","nuclei":"Era das Arcas, Operação ARSENAL, UniPotência","requirements":"Manha; Mentor","description":"No passado, ninjas eram temidos como espiões, assassinos e demônios. Hoje, são reconhecidos como realmente são: guerreiros altamente treinados em artes marciais e técnicas secretas. (Ok, alguns podem ser mesmo demônios!) O ninja atual é um mestre da furtividade e eficiência. Alguns ainda servem a antigos clãs, e outros obedecem apenas aos ensinamentos de seus mestres, usando suas habilidades para proteger o mundo ou alcançar ambições pessoais. Enquanto mantém um perfil discreto (ou não) na sociedade, o ninja preserva valores tradicionais de disciplina e respeito pelas artes ancestrais. A lealdade, trabalho em equipe e busca pela excelência são seus princípios fundamentais. O Ginásio Ninja Akibara é atualmente responsável pelo treinamento e formação dos ninjas modernos, lado a lado com outros heróis. Seus formandos podem ser vistos integrando grupos Arcanautas, lutando na Ilha do Martelo, ou mesmo percorrendo o espaço na Guerra da Galáxia. Isto é, quando escolhem ser vistos.","powers":[{"name":"Mestre ninja","description":"Você tem Ganho em dois testes de perícia por cena pela vantagem Mentor, em vez de um."},{"name":"Ninpo de combate","description":"Uma vez por rodada, você pode gastar 1PM para trocar um teste de ataque ou defesa por um teste de Manha (Habilidade). Você pode usar vantagens e técnicas como se fosse um ataque ou defesa normal."},{"name":"Ougi","description":"Escolha uma de suas vantagens ou técnicas: ela será seu ougi, ou técnica secreta. Custará –1PM (mínimo 1) e, no primeiro uso da sessão, o alvo tem Perda no teste resistido. Você pode trocar seu ougi sempre que passar por uma evolução dramática."}],"page":47},{"name":"Operativo","nuclei":"Guerra da Galáxia, Operação ARSENAL","requirements":"Luta, Sobrevivência; Patrono","description":"Na Era das Arcas, quase não há mais exércitos nacionais. É desperdício de recursos manter grandes forças armadas para atacar países vizinhos, quando há poderes e perigos muito maiores com que lidar. Existem, no entanto, numerosas forças armadas privadas e organizações secretas — mantidas por bilionários, megacorporações, ou prestando serviço como freelancers. Operativos são os melhores agentes em tais organizações. Estes supersoldados são altamente treinados e aprimorados, muitas vezes através de procedimentos experimentais (ou mesmo magia). Agem em pequenas forças-tarefa de poucos membros, compensando com extrema perícia e equipamentos de altíssima tecnologia. São mestres do combate tático, espionagem e estratégia, capazes de realizar missões perigosas com precisão e eficiência notáveis. Por atuarem em operações confidenciais, operativos raramente são reconhecidos por suas façanhas, exceto nos círculos militares. Aquele novo membro no grupo Arcanauta, ou aquele novo desafiante na Ilha do Martelo, pode ser na verdade um soldado de elite em missão secreta.","powers":[{"name":"Combate tático","description":"Sempre que executa uma manobra de combate (agarrão, ataque concentrado, ataque direcionado, ataque total, contra-ataque, defesa total, fuga), você pode pagar 1PM para ter +3 em seu teste de ataque ou defesa."},{"name":"Armas secretas","description":"Tentativas de revelar ou anular suas vantagens e técnicas (como Anulação ou Telepatia) sempre sofrem Perda, ou gastam PM dobrado."},{"name":"Equipamento de espião","description":"Uma vez por sessão, seu Patrono fornece um aparelho com efeito igual a uma vantagem de 1pt (escolhida no início da sessão), que funciona uma única vez. Para vantagens que gastam Pontos de Mana, o aparelho tem carga equivalente a 3PM."}],"page":48},{"name":"Paladino","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA.","requirements":"Devoto; Código dos Heróis e Honestidade","description":"No mundo além-Convergência, pelo que se sabe, paladinos atuavam como guerreiros santos para os deuses maiores do bem e ordem. Tais divindades não existem aqui, apenas fragmentos de seu poder alcançaram este mundo. Ainda assim, existem campeões capazes de extrair poder de sua devoção. Alguns paladinos são realmente abençoados por alguma entidade superior, enquanto outros lutam por uma causa ou ideal. Podem ser cavaleiros de armadura, espada e escudo, remetendo à figura clássica — ou completamente diferentes, usando armas de alta tecnologia e armaduras robóticas. Podem ser humanos (a maioria é) ou pertencer a qualquer raça da Era das Arcas. Mesmo seres supostamente malignos, como abissais ou vampiros, podem abraçar a devoção de um paladino. O paladino é um herói natural. Por vezes assume a liderança ou, no mínimo, o papel de negociador — pois todos confiam em paladinos. Por outro lado, ele pode acabar sendo um problema em grupos que às vezes recorrem a meios malandros...","powers":[{"name":"Bravura final","description":"Sua virtude vence a morte. Você não faz testes de morte: em vez disso, qualquer dano que recebe neste estado é descontado de seus PM restantes. Se ficar sem PM, você cai automaticamente Quase Morto. PM perdidos assim só podem ser recuperados com descanso."},{"name":"Me dê sua força!","description":"O poder da sua devoção o fortalece. Quando usa Devoto para ter Ganho em um teste, some +1 ao resultado de cada dado. Isso não afeta acertos críticos, mas cancela falhas críticas."},{"name":"Sétimo sentido","description":"Quando está perto da derrota, você pode gastar 2PM para fazer um ataque ou defesa uma escala acima."}],"page":49},{"name":"Patrulheiro","nuclei":"Era das Arcas, Tormenta ALPHA","requirements":"Sobrevivência","description":"Patrulheiros, ou rangers, são aventureiros rústicos, especializados em agir nos ermos. São exploradores audaciosos, com uma profunda ligação com a natureza e disposição para protegê-la. Embora sejam rastreadores exímios e caçadores implacáveis, abatem apenas o absolutamente necessário, sejam animais ou monstros. Sobrevivente extremo, o patrulheiro pode encontrar abrigo e sustento mesmo nos ambientes mais rigorosos, para si mesmo e seus companheiros. Nenhuma expedição a regiões remotas é prudente sem sua assistência. Muitos também adquirem pontaria impecável — tornando-se mestre no arco e flecha, armas de fogo ou outros meios para abates a longas distâncias. Outros preferem fazer emboscadas e usar o terreno a seu favor. Embora alguns patrulheiros sejam caçadores sanguinários, outros atuam como guardiões da vida selvagem, lutando contra a caça ilegal e poluição. Amam a beleza natural do mundo, lutando pelo equilíbrio entre as criaturas da floresta e as comunidades humanas.","powers":[{"name":"Natureza provedora","description":"Uma vez por cena, você pode usar Sobrevivência para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."},{"name":"À prova de tudo","description":"Você é automaticamente bem-sucedido em testes de Sobrevivência para achar lugar adequado de descanso para você e seus aliados. Você também pode pagar 1PM para que você ou um aliado receba +3 em um teste contra privações (cansaço, respiração, fome e sede, sono)."},{"name":"Rastreador perfeito","description":"Você pode pagar 2PM para adquirir um Sentido à sua escolha, para um único teste."}],"page":50},{"name":"Pescador Parrudo","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Poder 3; Sobrevivência; Vigoroso","description":"Esse curioso aventureiro se destaca por sua força impressionante, constituição robusta, personalidade cativante e incapacidade de abotoar a camisa. Combinando grande força e carisma, o pescador parrudo pode igualmente esmagar inimigos com braços poderosos ou com um sorriso contagiante. Ele impressiona aliados e ofusca adversários com seu físico vigoroso e músculos lustrosos. É um verdadeiro gigante gentil, sempre otimista e disposto a enfrentar desafios hercúleos, longas jornadas e batalhas exaustivas sem sinais de cansaço. Sua potência e presença intensas invariavelmente levam o grupo à vitória. Lendas são contadas nos lugares que esse vulto atlético percorre. Alguns afirmam que ele é amnésico; outros, que veio do futuro. Dizem que costuma integrar grupos Arcanautas — mas ninguém tem certeza disso, pois o brilho oleoso de seus peitorais faz com que os companheiros sejam ignorados. Também dizem que, às vezes, ele pesca.","powers":[{"name":"Quem sou?","description":"Onde estou? Uma vez por cena, você pode usar os benefícios da vantagem Vigoroso em testes de Poder."},{"name":"Parrudez","description":"Você pode gastar 1PM para fazer um teste de defesa usando a perícia Sobrevivência. Quando o faz, some +1 ao resultado de cada dado (não afeta acertos críticos, mas cancela falhas críticas). Qualquer defesa bem-sucedida é considerada perfeita."},{"name":"Pescado do dia","description":"No início da cena, faça um teste de Sobrevivência (meta 6 +1 para cada aliado). Se tiver sucesso, todos ganham +1 em testes de Resistência, incluindo defesa, até o fim da cena. Funciona apenas próximo a lugares com possibilidade de pesca (rio, lago, mar, peixaria...)."}],"page":51},{"name":"Piloto Mecha","nuclei":"Guerra da Galáxia, Operação ARSENAL, UniPotência","requirements":"Máquinas; Ajudante","description":"Quando um adversário é poderoso demais, você tem duas formas de derrotá-lo. Consiga mais poder. Ou um robô gigante. Com a obtenção de tesouros técnicos obtidos na Guerra da Galáxia — sobretudo corpos robóticos traktorianos — a ciência cibernética avançou muito na Era das Arcas. Grandes máquinas robóticas, ou mecha, seriam empregadas em todo o planeta e além. Especialmente nos campos de batalha. Formados na Alta Academia Gattai da UniPotência, pilotos mecha estão entre os poucos operadores capacitados a controlar mechas de combate, levando-os a confrontar os maiores inimigos da humanidade. São selecionados por sua habilidade e competência extremas, ou algum fator misterioso de compatibilidade (certos mechas poderosos escolhem seus pilotos, não o contrário). Muitas vezes esses escolhidos são jovens superconfiantes e imprudentes, tão resolutos em seus assentos de piloto quanto fora deles, embora também existam pilotos veteranos embrutecidos ou adolescentes tímidos. Apesar da perícia na cabine, o piloto não depende apenas de sua máquina para proteger o mundo. Quase todos contam com treino em combate corpo a corpo, armas futuristas e outros poderes, reservando o mecha gigante apenas para situações extremas. Outros ainda, em vez de pilotar colossos, utilizam superarmaduras pessoais.","powers":[{"name":"Ajudante robô","description":"Seu Ajudante robótico funciona como arma, armadura e veículo, sendo considerado Lutador e Montaria. Você ainda deve pagar PM para cada utilização."},{"name":"Ás indomável","description":"Você é um mestre das manobras impossíveis. Uma vez por sessão, quando usar 1 Ponto de Ação para qualquer teste, você também pode aumentar esse teste uma escala."},{"name":"Kiodai mecha","description":"Uma vez por sessão, ou a critério do mestre, você pode invocar um veículo de 10 pontos em escala Kiodai (cruzador espacial, robô gigante, dinossauro mecânico...). O veículo surge apenas se houver um oponente de escala Kiodai na cena."}],"page":52},{"name":"Policial do Espaço","nuclei":"Guerra da Galáxia, Operação ARSENAL, UniPotência","requirements":"Luta; Ajudante, Patrono; Código dos Heróis","description":"O universo é hostil, mas tem guardiões. Policiais do espaço são agentes designados para proteger mundos contra a destruição perpetrada por monstros e vilões. Pertencentes a raças variadas, recebem treinamento de combate rigoroso e equipamentos avançados, desde armaduras tecnológicas até cruzadores estelares e robôs gigantes. Todos respondem a algum poder superior, que pode ser uma entidade galáctica secreta — por vezes tão sigilosa que apenas ele conhece sua existência. Outros seguem ordens de mestres distantes, enquanto outros ainda são sobreviventes de mundos destruídos buscando evitar que isso se repita. Atuam sozinhos, com ajudantes, ou formam pequenas equipes. Quase todos são alienígenas e, embora muitos tenham aparência humana em suas identidades civis, tendem a ser socialmente desastrados na Terra. Uns poucos são humanos especialmente selecionados para a missão. Outros ainda são androides. Proteger a Terra contra ameaças extraterrestres após a Guerra da Galáxia é trabalho comum para policiais do espaço. Alguns também são treinados com esse propósito na UniPotência, e outros caçam bandidos procurados na Operação ARSENAL.","powers":[{"name":"Jouchaku!","description":"Você pode gastar um movimento para invocar um traje de combate tecnológico, ou abandonar seu disfarce humano e reverter para sua forma verdadeira. Nesta forma, pode gastar 2PM para um único uso da vantagem Alcance 1 (pistola de raios) ou Golpe Final. A transformação dura até o fim da cena."},{"name":"Assistente","description":"Seu Ajudante custa –1PM (mínimo 1PM) para ser utilizado."},{"name":"Kiodai mecha","description":"Uma vez por sessão, ou a critério do mestre, seu Patrono disponibiliza um veículo de 10 pontos em escala Kiodai (cruzador espacial, robô gigante, dinossauro mecânico...). O veículo surge apenas se houver um oponente de escala Kiodai na cena."}],"page":53},{"name":"Psiônico","nuclei":"Guerra da Galáxia, Operação ARSENAL, UniPotência","requirements":"Obstinado, Sentido (Intuição), Telepata","description":"Poderes psíquicos podem se manifestar por muitos motivos. Experimentos genéticos, origens alienígenas, mutações, até mesmo magia. Pode- -se nascer (ou ser criado) com eles, ou recebê-los de forma artificial. Esses poderes podem ser muito variados, mas quase sempre incluem alguma forma de intuição aguçada ou dom telepático, então evoluindo para manifestações mais dramáticas. Rajadas cinéticas, pirotecnia, invisibilidade, teleporte, voo... qualquer magia ou superpoder pode ter origem psíquica. Psiônicos podem ser seres muito poderosos, mas também perigosos, até para si mesmos. Seus poderes, quando excedem limites, consomem corpo e mente. Podem causar sangramentos nasais, dores de cabeça, até combustão espontânea ou desintegração! Apesar dos riscos, vários psiônicos acreditam que receberam seus dons especiais para proteger o mundo, unindo-se a aventureiros. Outros perseguem objetivos pessoais, que podem ser sonhos nobres, vinganças terríveis ou ambições malignas.","powers":[{"name":"Dom telepático","description":"Você não precisa gastar um movimento (mas ainda gasta PM) para usar Telepata."},{"name":"Intuição psíquica","description":"Você pode pagar 1PM para ter Ganho em um teste de Percepção usando Sentido (Intuição)."},{"name":"Sobrecarga psíquica","description":"Quando utiliza Obstinado, você pode escolher gastar 1 ponto de atributo como se fossem 2 Pontos de Ação, em vez de 1. Sempre que fizer isso, role um dado. Com um resultado 1, seus PV caem para zero e você deve fazer um teste de morte."}],"page":54},{"name":"Repórter Extremo","nuclei":"Guerra da Galáxia, Operação ARSENAL, UniPotência","requirements":"Percepção; Sentido (Intuição)","description":"A Era das Arcas é uma época de maravilhas. O povo quer conhecer essas maravilhas. Para atender a esse desejo, surgiria um mercado gigantesco de jornalismo e entretenimento, com corporações de mídia mais ricas e poderosas que muitos países. Repórteres e jornalistas são seus campeões, com a missão de descortinar ao povo este novo mundo de aventuras e mistérios. Armado com curiosidade insaciável, o repórter extremo busca tudo que é desconhecido — para tornar conhecido. Onde houver uma história intrigante, ameaça oculta ou herói anônimo, ele lutará para entregar a verdade ao público. Como o mais ferrenho detetive ou caça-prêmios, vai caçar pistas e coletar depoimentos, sem descansar até enviar o material para a redação. Para ele, nenhum segredo é sagrado. O público sempre tem o direito de saber. Repórteres extremos podem estar em qualquer lugar, mas vários juntam-se a Arcanautas para superar obstáculos e chegar aonde a notícia está. Até porque, muitas vezes, são eles os responsáveis pela notícia, seja boa ou ruim...","powers":[{"name":"Faro para notícia","description":"Você fuça até achar. Pode pagar 1PM para trocar sua Intuição por outro Sentido, para um único teste."},{"name":"Fontes confiáveis","description":"Uma vez por sessão, você pode contactar suas fontes para revelar uma informação crucial no momento certo. Durante uma cena, escolha uma vantagem entre Ajudante, Arena, Base, Inimigo ou Telepata. Você ainda paga custos em PM da vantagem escolhida, se houver."},{"name":"Furo de reportagem","description":"Uma vez por cena, você pode usar Percepção para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."}],"page":55},{"name":"Samurai","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Patrono ou Código","description":"O samurai do Japão feudal pode ter desaparecido, mas eles ainda existem em algum lugar no além-Convergência, originários de uma cultura idêntica. Vários deles chegaram a este mundo como Viajantes, trazendo consigo sua habilidade com a katana e devoção à honra. Outros simplesmente vieram do nosso passado — descendendo de antigos clãs, preservados, ou como viajantes do tempo, entre outras explicações. Em sua terra/época de origem, samurais foram guerreiros de elite que pertenciam à aristocracia, membros da alta nobreza. Servir é sua natureza, é o próprio significado da palavra samurai, “aquele que serve”. Assim, quando não tem um patrono, o samurai escolhe servir a seus próprios códigos de honra. Samurais sem mestre ou honra são chamados ronin, sem acesso total a seus poderes. Quase todos os samurais são humanos, mas existem alguns pertencentes a outras raças. E embora cultivem tradições antigas, vários recorrem a armas e armaduras de alta tecnologia, mas seguindo sua estética ancestral.","powers":[{"name":"Guerreiro poeta","description":"Samurais são treinados em arte e etiqueta. Você pode gastar 2PM para receber +3 em qualquer teste de Arte ou Influência."},{"name":"Artefato ancestral","description":"No início de seu turno, você pode gastar PM para imbuir sua arma ou armadura com uma qualidade de artefato (veja em Recompensas) durante um turno. O custo é igual a um décimo do custo em XP. Por exemplo, pode tornar sua arma Encantada +1 por 1PM, ou sua armadura Fortificada por 2PM. Você pode aplicar apenas uma qualidade por vez."},{"name":"Guerreiro honrado","description":"Você tem 1 Ponto de Ação extra para cada Patrono e Código que possua. Se desobedecer a seu Patrono ou violar qualquer de seus Códigos, perde esses pontos extras até se redimir. (Note que você pode escolher adotar mais de dois Códigos, embora não receba pontos de personagem por estes.)"}],"page":56},{"name":"Servo da Centelha","nuclei":"Operação ARSENAL","requirements":"Luta; Devoto","description":"Existem raros praticantes de artes marciais que, em algum momento de suas vidas, experimentam a Centelha — uma energia ardente que inflama seus corpos e impulsiona a lutar com intensidade implacável. Outros são inspirados por lendas, relatos de outros lutadores e testemunhos de lutas épicas. Após perceberem seu poder transformador, embarcam em uma jornada de autodescoberta e treinamento rigoroso para dominar essa energia única e sua capacidade ilimitada. Servos da Centelha têm um compromisso incomparável com a melhoria constante. Eles se concentram intensamente em seus treinamentos, buscando desafios e oponentes cada vez mais difíceis. Alguns acabam obcecados por essa busca, ignorando tudo o mais. Outros entendem que esse poder de luta pode ser usado para façanhas grandiosas, como proteger a humanidade. Ou conquistá-la! Muitos servos da Centelha acreditam que o Torneio da Ilha do Martelo é o único caminho para despertar o potencial máximo da Centelha. Dizem que o General Púrpura é atualmente o único que alcançou tal nível. No entanto, alguns afirmam que ele próprio ainda procura formas de despertar o auge desse poder.","powers":[{"name":"Bater onde dói","description":"Quando faz um ataque, você pode gastar 2PM para impor R–1 no teste de defesa do oponente."},{"name":"Combate violento","description":"Para cada acerto crítico em um teste de ataque, além do efeito normal, você também soma +2 ao resultado final."},{"name":"Faísca da Centelha","description":"Você é devotado ao despertar da Centelha. Quando usa sua vantagem Devoto, em vez do benefício normal, você recebe P+2 e R+1 (não afeta seus recursos). O efeito dura uma quantidade de rodadas igual seu Poder, após o ajuste."}],"page":57},{"name":"Shinigami","nuclei":"Era das Arcas, Operação ARSENAL, UniPotência","requirements":"Imortal, Inimigo (espíritos)","description":"O shinigami, deus da morte, é um guerreiro espiritual com a missão de proteger o equilíbrio entre o mundo dos vivos e o reino dos mortos. Incorporando a figura da morte, ele recebe poderes e conhecimentos que o capacitam a cumprir essa tarefa sombria, mas necessária. A tarefa principal do shinigami é impedir que espíritos causem transtornos aos vivos, e vice-versa. Ele será convocado para caçar espíritos monstruosos ou malignos que atacam os vivos, ou vilões que os utilizam. Da mesma forma, vai proteger os espíritos que escolhem viver pacificamente em sociedade. A ação dos shinigami é grande responsável por manter a harmonia entre humanos e abissais, osteon, vampiros e outros. Eles são orientados por justiça e compaixão, comprometidos em proteger a humanidade da influência negativa de entidades sobrenaturais. Alguns shinigami pertencem a ordens secretas ancestrais, enquanto outros são escolhidos por forças além da compreensão. Poucos são humanos: a maioria pertence a raças espirituais, como celestiais e abissais, ou mesmo mortos-vivos. Em todos os casos, são treinados desde jovens no domínio das artes espirituais e mistérios do universo.","powers":[{"name":"Eu voltarei!","description":"Um shinigami morto retorna com recursos completos no início da cena seguinte. A única forma de destruí-lo permanentemente é pelo ataque de outro shinigami."},{"name":"Guia dos mortos","description":"Cabe ao shinigami adiar a passagem daqueles cuja hora final ainda não chegou. Você pode conceder um Ganho a qualquer teste de morte realizado em sua presença."},{"name":"Inimigo espiritual","description":"Um espírito derrotado por um shinigami não recupera PV e permanece derrotado até o fim da cena, ou até ser destruído."}],"page":58},{"name":"Superatleta","nuclei":"Operação ARSENAL, UniPotência","requirements":"Esportes","description":"Os esportes sempre desafiaram os limites humanos. Agora, com a chegada de seres mais fortes, rápidos e vigorosos, assim como o surgimento de poderes e habilidades fantásticas, o mundo dos esportes mudou por completo. Recordes mundiais são quebrados a todo momento. Torneios e campeonatos são mais imprevisíveis que nunca. O superatleta personifica o espírito esportivo e a excelência física. É um esportista extraordinário, dotado de força, agilidade e resistência incomparáveis. Ele domina uma variedade de modalidades, desde atletismo e esportes de equipe até esportes radicais. Sempre otimista e motivado, abraça desafios e competições, buscando a vitória em cada empreendimento. Embora estádios e arenas sejam seu terreno favorecido, o superatleta também pode buscar superação vivendo aventuras — escalar montanhas, remar em corredeiras, saltar de paraquedas e mergulhar nas profundezas são aquilo que ele vive para fazer. Ele é um herói inspirador, dedicado a superar obstáculos e alcançar a excelência esportiva.","powers":[{"name":"Aquecimento","description":"No início de uma nova cena, você sempre recupera um número de PM igual a seu maior atributo."},{"name":"Espírito olímpico","description":"Suas vitórias inspiram seus companheiros. Sempre que você tem sucesso em um teste, todos os seus aliados recebem +1 em seu teste seguinte."},{"name":"Medalha de ouro","description":"Uma vez por cena, você pode usar Esportes para substituir qualquer outra perícia. Você pode pagar 3PM para cada nova utilização na mesma cena."}],"page":59},{"name":"Super-Herói","nuclei":"Guerra da Galáxia, UniPotência, Operação ARSENAL","requirements":"Ágil, Carismático, Forte, Gênio, Resoluto ou Vigoroso; Código dos Heróis","description":"Entre habilidades incríveis trazidas pelos Viajantes, novas tecnologias, milagres vindos do espaço, fenômenos mágicos ou simplesmente treino, existem numerosas pessoas com superpoderes. Estes, quando escolhem usar seus dons especiais para proteger o planeta e seus povos, recebem o título de super-heróis. O típico super-herói tem um único superpoder de destaque, que acaba se tornando sua melhor arma e marca registrada, utilizada de formas diferentes e imprevisíveis. Vários outros, no entanto, têm conjuntos de poderes relacionados, como técnicas. E outros ainda são versáteis, prontos para qualquer situação. Muitos supers aprendem a lidar com seus poderes (e inimigos) por tentativa e erro. Outros são guiados por mentores ou patronos, outros ainda unem-se a heróis ou aventureiros. Mas grande parte apenas cursou as disciplinas apropriadas na UniPotência — única instituição de ensino no mundo preparada para educar e treinar estudantes superpoderosos. Embora sua fundadora Vitória consiga lidar com qualquer ameaça, a semideusa acredita ser melhor fornecer meios para que o planeta consiga se proteger sem ajuda.","powers":[{"name":"Sobrehumano","description":"Escolha uma vantagem das exigências que você possua. Você pode gastar 1PM para aumentar seu bônus de atributo em +4, em vez de +2."},{"name":"Façanha épica","description":"Uma vez por sessão, em um teste envolvendo um atributo sobrehumano, você pode aumentar esse teste uma escala."},{"name":"Herói de ação","description":"Você tem 2 Pontos de Ação extras (Poder+2)."}],"page":60},{"name":"Tanque","nuclei":"Era das Arcas, UniPotência, Tormenta ALPHA","requirements":"R3, Defesa Especial (Provocação)","description":"Enquanto muitos Arcanautas são focados em causar dano e outros são dedicados a curar, existe um terceiro grupo especializado em defesa. Atuam como escudos vivos para os companheiros, com o papel de atrair ataques inimigos sobre si — e sobreviver ao castigo. Tanques costumam se sobressair no grupo Arcanauta como brutamontes com armaduras mais pesadas, mas nem todos são assim. Alguns são enganosamente pequenos e/ou frágeis, mas ainda capazes de tolerar danos que fariam um caminhão chorar. Como único traço comum, todos são chamativos, provocadores, aqueles de aparência mais perigosa no campo de batalha — isto é, assim tentam parecer. Não existe tanque tímido ou furtivo: para proteger o grupo, cabe-lhe usar todos os meios para atrair o olhar inimigo. E seus ataques. Sempre buscando ser a isca mais atraente, muitos tanques são vistosos e coloridos. Outros recorrem a provocações, blefes, fintas e insultos. E outros tantos apelam aos métodos mais exóticos, como danças rituais, feromônios, comandos telepáticos, comidas gostosas ou apelo sensual! Por tudo isso, quase todos os tanques são vaidosos e metidos, com egos tão altos quanto seus Pontos de Vida.","powers":[{"name":"Hoje não!","description":"Uma vez por cena, quando recebe dano que o levaria a 0PV, você pode ignorar completamente esse dano."},{"name":"Defesa gratuita","description":"Uma vez por cena, você pode usar uma Defesa Especial sem gastar PM."},{"name":"Último bastião","description":"Quando você está perto da derrota, todos os seus testes de defesa têm Ganho."}],"page":61},{"name":"Treinador de Monstros","nuclei":"Todos","requirements":"Animais; Ajudante (qualquer)","description":"Dragões. Elementais. Golens. Quimeras. As Convergências trouxeram um sem-número de criaturas exóticas, e outras tantas chegaram de outros planetas ou surgiram em laboratórios. Muitas são monstros perigosos. Outras podem ser companheiros leais. E outras mais, são ambos. O treinador de monstros é alguém com grande afinidade por tais mascotes fantásticas. Não apenas tem consigo um ou mais companheiros monstruosos, como também pode capturar e domar — ou apenas convencer — outros em estado selvagem, onde estiver. Suas criaturas atuam como parceiros de batalha para o mundo proteger, ou apenas para duelar em grandes torneios. Para quase todos os treinadores, não há objetivo maior que acumular monstros e torná-los mais fortes. Ainda que os utilize em lutas, será sempre atencioso, por considerá-los seus amigos mais queridos. Arriscará a própria vida por eles quando necessário, uma dedicação que seus monstros de estimação retribuem com esforço e obediência.","powers":[{"name":"Amigo dos monstros","description":"Para você, cada utilização de Ajudante custa –1PM (mínimo 1PM)."},{"name":"Eu escolho você!","description":"Se tiver mais de um Ajudante, você pode utilizar a vantagem duas vezes por rodada, em vez de uma (apenas duas, mesmo se tiver mais de dois Ajudantes). Você não pode usar o mesmo Ajudante mais de uma vez em cada rodada, e você ainda deve pagar o custo em PM por cada utilização."},{"name":"Temos que pegar!","description":"No início da cena, você pode fazer um teste de Animais (9 ou mais, a critério do mestre). Em caso de sucesso, um novo Ajudante (tipo escolhido pelo mestre) surge para ajudá-lo até o fim da cena. Você ainda deve pagar o custo em PM por sua utilização. Este poder funciona apenas uma vez por sessão."}],"page":62},{"name":"Vigilante Sombrio","nuclei":"Era das Arcas, Operação ARSENAL, Tormenta ALPHA","requirements":"Invisível, Sentido (infravisão)","description":"Nem todos os heróis em Era das Arcas são coloridos ou luminosos. Aliás, nem todos podem ser exatamente chamados de “heróis”... O vigilante sombrio é um sinistro campeão das trevas, especialista em explorar a escuridão e aterrorizar seus inimigos. Como um fantasma, ele desaparece nas sombras para ressurgir onde e quando menos se espera. Este anti-herói não se preocupa em ser admirado ou inspirador, muito pelo contrário: medo e intimidação são sua arma. Como um ninja, usará alguma máscara ou disfarce escuro para mesclar-se às trevas e parecer mais assustador — isto é, quando sua aparência natural não é assustadora ou bastante. Alguns aberrantes, abissais, osteon e vampiros estão entre os vigilantes sombrios mais temidos. Muitos estão em jornadas de violência e vingança por alguma injustiça sofrida no passado, ou apenas para satisfazer desejos perversos. Mas outros tantos, apesar de seus métodos, buscam fazer justiça e combater o crime. Como anjos das trevas, usam o terror e escuridão para proteger o sono dos inocentes.","powers":[{"name":"Forma sombria","description":"Você pode gastar um movimento para adquirir a vantagem Incorpóreo ao custo de 1PM por turno, por uma quantidade de turnos igual a 5 ou sua Habilidade, o que for menor. Se já tem Incorpóreo pode interagir com o mundo físico (inclusive atacar) ao custo de 1PM por interação."},{"name":"Terror da noite","description":"Sempre que causa dano, você pode gastar 2PM para forçar o alvo a fazer um teste de R (6 + H do vigilante). Se falhar, ele tem Perda na defesa contra o próximo ataque que receber. Caso seja uma falha crítica, ele fica indefeso."},{"name":"Sumir nas sombras","description":"Você gasta 1PM (em vez de 3) para ficar Invisível."}],"page":63}]}; 
CATALOG.vantagens = CATALOG_DATA.catalog.vantagens;
CATALOG.desvantagens = CATALOG_DATA.catalog.desvantagens;
Object.assign(SKILL_DESCRIPTIONS, CATALOG_DATA.skills);
CHARACTER_KITS.splice(0, CHARACTER_KITS.length, ...CATALOG_DATA.kits);

// Preserva os índices dos itens já salvos nas fichas.
catalogSection = function(c, type) {
    ensureCatalog(c);
    const entries = c.entries[type] || [];
    const labels = { vantagens: 'Vantagens', desvantagens: 'Desvantagens', tecnicas: 'Técnicas' };
    const list = CATALOG[type] || [];
    return `<div class="card catalogbox"><h3>${labels[type] || type} <button onclick="addEntry('${type}')">+</button></h3>
    ${entries.map((entry, i) => {
        const item = list[entry.index];
        const costChecked = item && entry.counted === true;
        return `<div class="catalogrow">
            <label class="skill-cost" title="Marque para contar o custo nos pontos de personagem" style="white-space:nowrap;"><input type="checkbox" ${costChecked ? 'checked' : ''} ${item ? '' : 'disabled'} onchange="setCatalogCost('${type}',${i},this.checked)"></label>
            <select onchange="changeEntry('${type}',${i},this.value)"><option value="">Selecione...</option>
            ${list.map((x, j) => `<option value="${j}" ${entry.index === j ? 'selected' : ''}>${esc(x.name)} (${esc(x.cost || (x.points + 'pt'))})</option>`).join('')}
            </select>
            <button type="button" title="Ver informações completas" onclick="showEntry('${type}',${i})">🔍</button>
            <button type="button" title="Enviar informações ao chat" onclick="announceEntry('${type}',${i})">i</button>
            <button type="button" class="danger" title="Remover" onclick="removeEntry('${type}',${i})">×</button>
        </div>${item ? `<p class="mini muted">${esc(item.description)}</p>` : ''}`;
    }).join('') || '<p class="muted">Clique em + para adicionar.</p>'}</div>`;
};

showEntry = function(type, i) {
    const c = currentCharacter();
    const entry = c?.entries?.[type]?.[i];
    const item = entry && CATALOG[type]?.[entry.index];
    if (!item) return alert('Selecione um item da lista primeiro.');
    const cost = item.cost || (item.points + 'pt');
    alert(`${item.name} (${cost})\nLivro Básico • página ${item.page}\n\n${item.description}`);
};

announceEntry = function(type, i) {
    const c = currentCharacter();
    const entry = c?.entries?.[type]?.[i];
    const item = entry && CATALOG[type]?.[entry.index];
    if (!item) return alert('Selecione um item da lista primeiro.');
    const cost = item.cost || (item.points + 'pt');
    const kind = ({ vantagens: 'Vantagem', desvantagens: 'Desvantagem', tecnicas: 'Técnica' })[type] || type;
    logMessage(`ℹ ${c.name} — ${kind}: ${item.name} (${cost})\n${item.description}`);
};

function kitFullText(kit) {
    return `Kit: ${kit.name}\nNúcleos: ${kit.nuclei || 'Não informado'}\nExigências: ${kit.requirements || 'Nenhuma'}\nManual do Arcanauta • página ${kit.page}\n\n${kit.description || ''}\n\nPoderes do kit:\n${(kit.powers || []).map((p, i) => `${i + 1}. ${p.name}\n${p.description}`).join('\n\n')}`;
}
function kitAt(index) {
    const c = currentCharacter();
    if (!c || !Array.isArray(c.kits)) return null;
    return CHARACTER_KITS.find(k => k.name === c.kits[index]) || null;
}
function showKitDetails(index) {
    const kit = kitAt(index);
    if (!kit) return alert('Kit não encontrado.');
    alert(kitFullText(kit));
}
function announceKitDetails(index) {
    const c = currentCharacter(), kit = kitAt(index);
    if (!c || !kit) return alert('Kit não encontrado.');
    logMessage(`ℹ ${c.name} — Informações completas do kit\n${kitFullText(kit)}`);
}
function showKitPower(kitIndex, powerIndex) {
    const kit = kitAt(kitIndex), power = kit?.powers?.[powerIndex];
    if (!kit || !power) return alert('Poder do kit não encontrado.');
    alert(`Kit: ${kit.name}\nPoder: ${power.name}\nManual do Arcanauta • página ${kit.page}\n\n${power.description}`);
}
function announceKitPower(kitIndex, powerIndex) {
    const c = currentCharacter(), kit = kitAt(kitIndex), power = kit?.powers?.[powerIndex];
    if (!c || !kit || !power) return alert('Poder do kit não encontrado.');
    logMessage(`ℹ ${c.name} — ${kit.name}: ${power.name}\n${power.description}`);
}

// Exibe os kits e seus poderes completos.
renderKitsTab = function(c) {
    ensureCatalog(c);
    const cards = (c.kits || []).map((name, i) => {
        const kit = CHARACTER_KITS.find(k => k.name === name);
        if (!kit) return '';
        const powers = (kit.powers || []).map((p, j) => `<div class="kit-power">
            <div class="kit-power-head"><strong>${esc(p.name)}</strong><div>
                <button type="button" title="Ver descrição completa" onclick="showKitPower(${i},${j})">🔍</button>
                <button type="button" title="Enviar descrição ao chat" onclick="announceKitPower(${i},${j})">i</button>
            </div></div><p>${esc(p.description)}</p></div>`).join('');
        return `<article class="card kit-card">
            <div class="row" style="justify-content:space-between"><h3>${esc(kit.name)} <span class="pill">${i + 1}º kit • custo: ${i + 1} pt</span></h3>
                <div class="row"><button type="button" title="Ver todas as informações do kit" onclick="showKitDetails(${i})">🔍</button>
                <button type="button" title="Enviar informações completas ao chat" onclick="announceKitDetails(${i})">i</button>
                <button class="danger" onclick="removeKit(${i})">Remover Kit</button></div></div>
            <p class="muted"><strong>Núcleos:</strong> ${esc(kit.nuclei || 'Não informado')}</p>
            <p class="muted"><strong>Exigências:</strong> ${esc(kit.requirements || 'Nenhuma')}</p>
            <p style="white-space:pre-wrap;line-height:1.45">${esc(kit.description || '')}</p>
            <h4 style="margin-top:12px">Poderes do kit</h4><div class="kit-powers">${powers}</div>
        </article>`;
    }).join('');
    const availableKits = CHARACTER_KITS.filter(k => !(c.kits || []).includes(k.name));
    return `<div class="card"><h3>Kits de Personagem</h3>
        <p class="muted">O 1º kit custa 1 ponto, o 2º custa 2 pontos, o 3º custa 3 pontos, e assim sucessivamente.</p>
        <div class="kit-list">${cards || '<p class="notice">Nenhum kit adicionado até o momento.</p>'}</div>
        ${availableKits.length ? `<div class="field" style="margin-top:15px"><label>Escolha um Kit para Adicionar</label>
        <select id="kitSelectChoice"><option value="">Selecione na lista...</option>${availableKits.map(k => `<option value="${esc(k.name)}">${esc(k.name)} (custo: ${(c.kits || []).length + 1}pt)</option>`).join('')}</select>
        <button style="margin-top:8px" onclick="addKitFromSelect()">+ Adicionar Kit Selecionado</button></div>` : '<p class="muted">Todos os kits disponíveis já foram adicionados.</p>'}
    </div>`;
};
</script>



</body>
