        { name: 'Ás Indomável', pm: '0 a 2PM', description: 'Você é um prodígio da pilotagem. Quando comanda um veículo, pode usar as seguintes manobras:\n• Até o limite! Você força o veículo até quase explodir. Pode usar PV do veículo em vez de PM para ativar uma vantagem, com custo máximo igual à sua Habilidade.\n• Drifting. Você usa uma ação e 2PM para colocar-se em posição de vantagem, tem Ganho em um teste na próxima rodada.\n• Nunca me diga as chances! Você gasta 2PM para anular uma Perda em um teste, fazendo algo que parecia impossível. Só pode fazer isso uma vez por teste.\n• Vai, corredor, vai! Você gasta 1PM para fazer um movimento extra, como se tivesse Aceleração.', requirements: 'Esporte ou Máquinas' },
        { name: 'Barreira Mística', pm: '1 a 2PM por uso', description: 'Você usa seus poderes mágicos para se defender. Com 1PM, você conjura uma Barreira Mística como reação contra um ataque. Seu teste de defesa é normal, mas você pode escolher usar a perícia Mística em vez de Luta.\n\nVocê também pode gastar 1PM extra para adicionar um destes efeitos:\n• Debilitante. Se sua defesa superar o ataque, você reduz um atributo do atacante (à sua escolha) em –1, até o fim da cena. Isso não afeta os seus recursos.\n• Drenante. Se sua defesa superar o ataque, você recupera 2PM. Cada crítico na defesa recupera mais 2PM.\n• Elétrica. Sua defesa eletrifica e atordoa o alvo; o próximo ataque contra ele tem Ganho.\n• Espinhosa. Se o atacante está Perto, ele sofre 1 ponto de dano. Cada crítico na defesa causa mais 1 ponto de dano.\n• Luminosa. Se sua defesa superar o ataque, a barreira causa um clarão que ofusca o atacante, causando Perda em seu próximo teste.\n• Maciça. Você tem defesa perfeita.\n• Solidária. Você pode conjurar a Barreira Mística para um aliado Perto. Ele tem Ganho na defesa. Você não recebe nenhum benefício nesta rodada.\n\nVocê só precisa conjurar a Barreira Mística uma vez por rodada, no primeiro ataque recebido. Ela permanece ativa até seu próximo turno.', requirements: 'Magia, Mística' },
        { name: 'Cancioneiro Popular', pm: '2PM', description: 'Suas canções têm efeitos emocionais diversos:\n• Canção de amor. Escolha um alvo e faça um teste de Arte (9). Com sucesso, ele se tornará amigável a você, garantindo Ganho em seu próximo teste social contra ele. Dobrar a meta pode fazer com que ele se apaixone de verdade!\n• Canção de ninar. Você canta para o grupo antes de dormir, aumentando a recuperação de recursos em terreno ruim em +1D PM e PV.\n• Canção de protesto. Escolha um alvo para protestar e faça um teste de Arte (9). Com sucesso, ele terá Perda em seu próximo teste social.\n• Canção de rua. Faça um teste de Arte (9) onde houver muitos transeuntes (tipicamente vias urbanas). Se passar, tem Ganho no próximo teste de compra.\n• Canção relaxante. Você canta para o grupo em um momento de descanso, aumentando a recuperação de recursos em um descanso curto em +1 por ponto de atributo.\n\nCancioneiro Popular não pode ser usado em combate ou conflitos.', requirements: 'Arte' },
        { name: 'Dobrar Elemento', pm: '1PM ou mais por uso', description: 'Você pode controlar um único elemento à sua escolha, como fogo, terra, água, ar, luz ou trevas; ou elementos mais exóticos, como vapor, gelo, relâmpago ou outros. Para cada elemento você deve aprender um truque diferente.\n\nNa maioria dos casos, o elemento deve estar presente para ser controlado. Você precisa estar próximo de um corpo d\'água para Dobrar Água, ou em terra firme para Dobrar Terra. Alguns elementos, no entanto, podem ser produzidos se houver condições. Você pode Dobrar Fogo para aquecer lenha até o ponto da combustão, criando fogo — mas não pode criar combustível do nada.\n\nDobrar Elemento não serve para atacar ou causar dano direto. Para isso, use seus próprios atributos, ou vantagens como Ataque Especial e Magia.\n\nVocê pode gastar 1PM ou mais para:\n• Manipular, levitar ou controlar pequenas quantidades do elemento, até cerca de 1kg (para líquidos e sólidos) ou meio metro cúbico (para gases ou energias). Você pode gastar mais PM para controlar quantidades maiores.\n• Causar incômodo a um alvo, impondo Perda em um teste. Por exemplo, usando água para tornar o chão escorregadio, ou uma lufada de ar para desequilibrá-lo. 2PM.\n• Reforçar um ataque com o elemento, adicionando um tipo de dano adequado (como fogo, frio, pancada ou outro) sem causar Perda.\n• Usar o elemento para se proteger, conseguindo defesa perfeita se vencer o teste de defesa.\n• Outros efeitos menores ligados ao elemento escolhido. Dobrar Vapor para fazer um motor funcionar, enquanto Dobrar Fogo pode aquecer água ou outro item (mas não a ponto de causar dano).', requirements: '—' },
        { name: 'Golpes', pm: 'Variável', description: 'Você domina diversas manobras únicas de artes marciais. Este é um conjunto de truques diferente, pois não contém um grupo completo de habilidades; em vez disso, você escolhe dois golpes da lista. Você pode comprar este truque várias vezes: cada vez, escolhe mais dois golpes.\n\nGolpes não podem ser combinados com outras técnicas e vantagens, exceto quando dito o contrário. Sempre que uma técnica ou habilidade fala em "golpe", será uma das manobras desta lista. Um Combo, por exemplo, só utiliza golpes, jamais outras vantagens e técnicas.\n\n• Derrubar. Quando vence a defesa do adversário, em vez de causar dano, você pode escolher derrubá-lo (ou gastar 1PM para causar dano e também derrubá-lo). Um oponente derrubado tem Perda em todos os testes até usar um movimento para se levantar.\n• Finta. Você pode usar um movimento e 1PM para causar Perda no próximo ataque que receber antes de seu próximo turno. Se a defesa vencer o ataque, você tem defesa perfeita, e pode fazer um ataque com Ganho contra o mesmo adversário no seu próximo turno.\n• Golpe Arriscado. Gaste 1PM ao atacar. Você tem chance de crítico máxima (4, 5 ou 6 em cada dado), mas qualquer outro resultado é considerado 0. Se não rolar pelo menos um crítico, será uma falha crítica.\n• Golpe Atordoante. Gaste 2PM ao atacar. Se causar dano maior que a Resistência do alvo, ele fica atordoado: não pode realizar uma ação no próximo turno, apenas um movimento.\n• Golpe Debilitante. Gaste 2PM ao atacar. Se vencer a defesa, em vez de causar dano, reduz um atributo do oponente (à sua escolha) em –1 até o fim do combate. Se você rolar pelo menos um crítico, reduz em –2. Isso não afeta os recursos do adversário.\n• Golpe Forte. Gaste 1PM ao atacar. Se vencer a defesa do oponente, causa +2 pontos de dano. Cada crítico aumenta o dano extra em +1. Se a defesa vencer, mas não com defesa perfeita, você ainda causa 1 ponto de dano extra. O dano extra ignora limite de dano.\n• Golpe Rápido. Você pode gastar 1PM para fazer um ataque com um movimento, mas o teste tem Perda e não pode utilizar vantagens e técnicas.\n• Recuperar Fôlego. Você faz uma pausa breve para se recobrar e voltar ao combate. Use um movimento para recuperar 1D pontos de mana, até um máximo igual à sua Resistência. Você só pode fazer isso durante combates e conflitos.', requirements: 'Luta' },
        { name: 'Grimório Debilitante', pm: '3PM por uso', description: 'Você utiliza sua magia para atrapalhar adversários, alterando as condições do ambiente para ter vantagens contra eles.\n• Luz/Trevas. Você ilumina ou escurece a área Perto de um alvo. Uma área escurecida causa Perda em ações que usam a visão (incluindo atacar e defender). Uma área subitamente iluminada causa Perda por uma rodada, enquanto os olhos se ajustam à claridade. Duradoura.\n• Pés de Chumbo. Você aumenta a gravidade no alvo, deixando-o mais lento. O alvo precisa gastar uma ação para realizar um movimento, uma ação completa para uma ação, e uma ação completa extra para tudo que demore mais. O alvo pode resistir com um teste de Resistência contra a sua Habilidade. Duradoura.\n• Tempestade Mental. Você faz um ataque contra um alvo, podendo receber bônus no teste usando Magia. Se superar a defesa, em vez de PV, você diminuirá seus PM. Instantânea.\n• Terreno Escorregadio de Neo. A área Perto do alvo fica escorregadia. Qualquer ação que depende de movimentação (incluindo atacar e defender) tem Perda, e qualquer falha resulta em queda. Um personagem caído tem Perda em todos os testes até usar um movimento para se levantar. Dura 1 turno, mas você pode gastar 9PM para tornar duradoura.', requirements: 'Magia' },
        { name: 'Grimório Irritante', pm: '0 a 1PM ou mais', description: 'Em vez de efeitos dramáticos de poder arcano, você utiliza sua magia para irritar e provocar. Bem chato, mas raramente tem efeito mecânico. Contra alvos tentando tarefas que exigem concentração, pode causar Perda.\n• A Porrinhação do Caos. Você cria um pequeno enxame de criaturas que não causam dano, mas incomodam o alvo e causam Perda em um teste, apenas fora de combate. Custa 1PM, mas pode ser mantido gastando mais 1PM por turno.\n• O Apavorante Gás de Luignaccio. O alvo tem direito a um teste de Resistência (9). Se falhar, começa a emitir sonoras flatulências durante uma rodada para cada PM gasto. Durante esse tempo, tem Perda em testes sociais contra qualquer infeliz capaz de farejá-lo.\n• A Flor Perene de Milady "A". Esta magia simples, de custo 0, faz um gerânio inofensivo nascer no local desejado (que pode ser uma criatura). Se arrancado, desaparece — e uma nova flor nasce no lugar, e assim sucessivamente até a magia ser cancelada (veja na vantagem Magia).\n• A Gagueira de Ravioliius. O alvo tem direito a um teste de Resistência (9). Se falhar, é acometido por gagueira incontrolável durante uma rodada para cada PM gasto. Durante esse tempo, tem Perda em testes que usam a voz (como cantar, usar Influência, comandar Aliados ou conjurar Magia).', requirements: 'Magia' },
        { name: 'Monasticismo Marcial', pm: '2PM por uso', description: 'Você passou por treinamento marcial rigoroso, como os monges shaolin.\n• Corpo fechado. Ganho em um teste de Resistência para evitar um efeito negativo de vantagens ou poderes.\n• Inviolável. Mantendo-se imóvel (sem realizar ações ou movimentos), você tem Ganho e defesa perfeita em todos os testes de defesa até seu próximo turno.\n• Palma de ferro. Ganho em um teste de Poder para quebrar objetos inanimados (mas não testes de ataque).\n• Realinhar chakras. Usando uma ação, você pode repetir um teste de Resistência para eliminar algum efeito negativo (e pode gastar mais 2PM para usar Corpo Fechado e ter Ganho nesse teste).', requirements: '—' },
        { name: 'Ninjutsu', pm: '2PM por uso', description: 'Você é um mestre em truques de infiltração e sabotagem.\n• Bomba de fumaça. Usando uma ação, todos os personagens Perto (incluindo aliados) ficam cegos por uma rodada, recebendo Perda em testes que usam a visão (como fazer um ataque, ou impedir sua fuga).\n• Corrida ninja. Você dobra seu deslocamento neste turno. Por exemplo, pode ir de Perto para Muito Longe com apenas um movimento.\n• Estrepes. Usando uma ação, você espalha objetos espinhosos no chão para atrapalhar um alvo Perto. Ele tem Perda em um teste que você escolher, até seu próximo turno.\n• Jutsu de troca. Como reação, você troca de lugar com um item próximo, como um tronco de árvore. Ganho no teste de defesa, apenas uma vez por rodada.\n• Pipa ninja. Você usa um movimento para saltar até Longe, e uma ação para abrir uma grande capa de tecido e voar durante uma rodada. Você pode continuar voando se usar uma ação por rodada para controlar a pipa, ou pode fechá-la com um movimento e voltar ao chão sem sofrer dano.', requirements: 'Manha' },
        { name: 'Pequenos Desejos', pm: '0 a 1PM por uso', description: 'Esta magia realiza uma série de efeitos e ilusões inofensivas, mais para distrair e entreter que qualquer outra coisa. Para truques muito simples não há custo em PM, basta um teste de Mística.\n• Criar pequenos objetos sem utilidade prática, como flores, lenços, borboletas ou pombos (mágicos, que logo desaparecem).\n• Levitar e mover um item leve, lentamente, como se tivesse Poder 0.\n• Colorir, limpar ou sujar itens pequenos (incluindo roupas).\n• Aquece, esfriar e/ou temperar (mas não produzir) uma refeição, ou outro item de até 500g.\n• Criar um pequeno ser feérico, feito de magia, que realiza uma tarefa simples como apanhar lenha, colher frutos, pescar, vigiar uma área, alimentar um mascote, etc. 1PM.\n\nPersonagens treinados em Mística e com a vantagem Magia recebem esta técnica sem gastar XP.', requirements: 'Mística' },
        { name: 'Praga', pm: '2PM', description: 'Você aponta o dedo e roga uma praga contra alguém! Faça um teste de Poder contra a Resistência do alvo. Se vencer, ele sofre um dos efeitos a seguir, à sua escolha:\n• -1 em testes de um atributo, até o fim da cena.\n• Perda em um único teste à sua escolha, até o fim da sessão.\n• Vantagens e técnicas custam +1PM, até o fim da cena.\n• Qualquer resultado 1 em um teste causa falha crítica, até o fim da cena.', requirements: 'Mística' },
        { name: 'Raio Místico', pm: '1 a 2PM por uso', description: 'Você usa seus poderes mágicos para atacar. Com uma ação e 1PM, você dispara um Raio Místico contra um alvo Perto ou Longe. Seu teste de ataque é normal, mas você pode escolher usar a perícia Mística em vez de Luta.\n\nVocê também pode gastar 1PM extra para adicionar um destes efeitos:\n• Ácido. Na próxima rodada, o alvo faz um teste de Resistência (6 + dano sofrido). Se falhar, sofre 1D–1 de dano extra.\n• Congelante. Se sofrer dano, o alvo congela, sofrendo Perda em seu próximo teste.\n• Debilitante. Se vencer a defesa, em vez de causar dano, você reduz um atributo do alvo (à sua escolha) em –1, até o fim da cena. Isso não afeta os seus recursos.\n• Distante. O alcance do raio muda para Muito Longe.\n• Elétrico. Se causar dano, o choque atordoa o alvo; o próximo ataque contra ele tem Ganho.\n• Flamejante. Faça o teste de ataque com Poder +2.', requirements: 'Magia, Mística' },
        { name: 'Super-Movimento', pm: '1PM por uso', description: 'Através de treinamento ou magia, você realiza movimentos impossíveis para uma pessoa comum.\n• Pode andar em paredes e tetos. Se descer, deve gastar mais 1PM para prender-se novamente.\n• Saltar até Muito Longe com um movimento, sem sofrer Perda nem dano de queda ao voltar ao chão.\n• Correr sobre a água ou outra superfície instável. Deve gastar um movimento e 1PM por rodada, ou afundará.\n• Ganho em um teste para se livrar de cordas, amarras e outros tipos de contenção.', requirements: 'Esporte, Luta ou Magia' },
        { name: 'Memória dos Ancestrais', pm: '2PM por uso', description: 'Você entra em um transe profundo e acessa a sabedoria dos seus ancestrais. Quando faz isso, recebe um dos benefícios a seguir:\n• Pode fazer um teste de Arte, Mística ou Saber (9) para adquirir algum conhecimento específico, como o Ponto Fraco de um inimigo, ou a localização de um item. O mestre pode aumentar a meta para conhecimentos muito obscuros ou importantes para a aventura.\n• Pode fazer um teste de uma perícia que não tem como se a tivesse, até uma vez por cena.\n• Recebe Ganho ou anula uma Perda em um teste.\n• Troca esta técnica por outro conjunto de truques à sua escolha até o fim da cena. Você ainda deve cumprir todas as exigências do conjunto escolhido.\n\nEsta técnica requer concentração para entrar no transe e acessar o mundo dos espíritos. Por isso, não pode ser utilizada em combates, cenas de conflito ou testes resistidos.', requirements: 'Arte, Mística ou Saber' },
        { name: 'Monstro Interior', pm: 'Veja adiante', description: 'Você carrega a essência demoníaca de alguma criatura sobrenatural, seja por herança sanguínea, incorporação etérea ou implantada através de rituais complexos.\n• Energia maligna. Gaste 1PV quando ataca ou defende em combate violento. Se vencer a defesa do oponente com um acerto crítico, ou conseguir uma defesa perfeita, você recupera 1D PM.\n• Fôlego infernal. Use um movimento para recuperar 1D PM, até um máximo igual à sua Resistência. Você só pode fazer isso durante combates violentos.\n• Mal posso esperar. Quando o mestre possessor tenta controlar seu personagem, você pode impedir gastando 3PV e recuperando todos os seus PM.\n• Pacto (nem tão) justo. Quando causa dano a um alvo Perto, em vez disso você pode recuperar 1 PM para cada 3 pontos de dano que causaria.', requirements: 'Possuído' },
        { name: 'Ritual da Troca Equivalente', pm: 'Veja adiante', description: 'Você é capaz de conjurar rituais de troca através de acordos macabros ou alquimia sobrenatural. Na prática, você oferece algo de valor e, em troca, é beneficiado por algo de valor equivalente.\n\nTransmutação Alquímica. Você pode sacrificar ingredientes em troca de um item composto por esses ingredientes. Por exemplo, metal e madeira para criar uma espada. Para tal, deve ter os ingredientes (a critério do mestre), gastar 2PM e fazer um teste de Mística (9). Se passar, cria o item; se falhar, não cria nada e perde os PM e ingredientes. Você não pode criar consumíveis ou artefatos. Itens criados com este truque desaparecem no fim da cena.\n\nBrizao de Homúnculo. Você pode sacrificar ingredientes que compõem uma criatura viva para criar um homúnculo que simula a criatura. Para tal, deve ter os ingredientes (a critério do mestre), gastar 4PM e fazer um teste de Mística (12). Se passar, cria o homúnculo; se falhar, não cria nada e perde os PM e ingredientes. O homúnculo funciona como um Ajudante de tipo à sua escolha. O homúnculo se desmancha no fim da cena.\n\nInvocação de Entidade. Você pode sacrificar algo precioso e invocar uma entidade para ajudá-lo. Para tal, deve ter um item precioso para sacrificar (a critério do mestre), gastar 10PM e fazer um teste de Mística (15). Se passar, invoca a entidade; se falhar, não invoca nada, perde PM e o item; se obter falha crítica, invoca outra entidade, diferente da que estava buscando (e que certamente vai te sacanear). A entidade é um NPC determinado pelo mestre.', requirements: 'Habilidade 2, Mística, Magia' },
        { name: 'Metamorfose', pm: '2PM', description: 'Você é um trickster, um trapaceiro. Tem controle absoluto sobre o próprio corpo, pode assumir a forma de animais, monstros e até pessoas! Isso não afeta a maior parte de suas habilidades, mas tem pequenos benefícios.\n\nVocê pode gastar 2PM para:\n• Ganho em um teste para se esconder ou enganar alguém.\n• Fazer um teste de Percepção como se tivesse um Sentido à sua escolha.\n• Fazer um teste como se tivesse Ágil, Forte ou Vigoroso.\n• Ganhar um movimento especial como escalar paredes, nadar como um peixe, ou voar.\n\nNarrativamente, você pode manter a forma alternativa por quanto tempo quiser, mas deve pagar o custo novamente sempre que faz um teste ou usa o movimento especial. Se não puder ou quiser pagar, retorna à forma original.', requirements: 'Magia' },
        { name: 'Mascotinho Mágico', pm: '1PM por uso', description: 'Você sabe invocar uma criaturinha fofa para apoio emocional, tático e estético. Ela não é forte, nem resistente, mas conquista fãs mais rápido que você.\n• Abracinho. Usando um movimento, você faz seu mascote curar 1D PV ou remover uma Perda em você ou um aliado Perto.\n• Distração. Usando uma ação, um inimigo Perto recebe Perda em testes que usam a visão (como fazer um ataque, ou impedir sua fuga), por uma rodada.\n• Ganbatte! O bichinho faz você seguir adiante. Usando um movimento, você ou um aliado Perto recebe Ganho para resistir a um efeito adverso.\n• Trrrp! Um aliado Perto pode gastar um movimento para fazer carinho no mascotinho. Ele faz um barulhinho acalentador que recupera 1PM.', requirements: 'Animais, Mística ou Magia' }
    ],
    comum: [
        { name: 'Absorver Mana', pm: '0', description: 'No lugar de gastar sua própria energia para ativar poderes, você pode absorvê-la do ambiente. Você pode usar um movimento para absorver 1D PM, ou uma ação para absorver 1D+H PM. Estes PM podem superar o seu limite, mas você não pode absorver mais mana até gastar o que já foi absorvido. Mana ambiental é volátil: você só pode segurá-lo por uma rodada; PM absorvidos que não sejam gastos até o fim do seu próximo turno são perdidos.', requirements: 'Mística' },
        { name: 'Área de Batalha', pm: '2PM para ativar, 1PM por rodada para manter', description: 'Usando uma ação, você transporta a você e um número máximo de personagens igual a seu Poder ou Habilidade (escolha um) para um campo de batalha especial, em outra dimensão, onde possui vantagens sobre eles. Oponentes que não queiram ser transportados podem fazer um teste oposto de Resistência para anular a técnica.\n\nEscolha duas vantagens de 1 ponto, ou uma de 2 pontos. Você não precisa possuí-las; enquanto está na área de batalha, elas passam a fazer parte da sua ficha. Se tiver a vantagem, seu custo em PM é reduzido à metade.\n\nHá áreas de batalha que funcionam como uma Arena, outras deixam o usuário mais Ágil, Forte ou Vigoroso, concedem Ataques e Defesas Especiais, ou até permitem usar Magia! Seja criativo.\n\nAdquirindo a técnica diversas vezes, você pode ter mais de uma área de batalha, ou uma única que concede vantagens maiores quando invocada. Você pode ativar todas elas com uma única ação, mas deve pagar o custo total em PM de todas as técnicas.', requirements: 'Poder ou Habilidade 2, Mística' },
        { name: 'Bola de Fogo', pm: '3PM + Magia', description: 'Um dos mais conhecidos feitiços de ataque, esta técnica cria uma grande esfera flamejante que explode ao atingir o alvo.\n\nFaça um ataque. Você pode aumentar a intensidade do fogo, usando Magia para ter bônus no teste. Se usar a regra de Tipos de Dano, este ataque causa dano de fogo.\n\nDevido à grande área da explosão, a Bola de Fogo também atinge todos os alvos Perto do alvo original. Além disso, todos sofrem Perda em seus testes de defesa.', requirements: 'Habilidade 2, Magia' },
        { name: 'Combo', pm: '0', description: 'Você pode realizar diversos golpes em sequência. Quando acerta um golpe (ou seja, seu ataque supera a defesa) no oponente, pode usar um movimento para realizar um novo golpe contra ele. O oponente rola a defesa uma só vez, mas você rola um novo ataque para superá-la a cada novo golpe. Se tiver mais movimentos e seguir vencendo a defesa, você pode adicionar mais golpes ao combo.', requirements: 'Habilidade 1, Golpe' },
        { name: 'Desprezo', pm: '2PM, depois 1PM por uso', description: 'Seu inimigo é inferior, e você sabe deixar isso bem claro. Com uma ação e 2PM, você lança um olhar de desprezo contra o alvo, ou palavras ácidas que ironizam suas capacidades (ou a falta delas).\n\nFaça um teste de Poder contra a Resistência do alvo. Se vencer, até o fim da cena, você pode gastar 1PM como reação para causar Perda sempre que ele fizer um teste. Toda vez que fizer isso, ele pode fazer um novo teste de Resistência para interromper a técnica.', requirements: 'Poder 2 e Arte ou Influência' },
        { name: 'Disparo de Energia', pm: '3PM', description: 'Você concentra sua energia espiritual em uma esfera, raio ou outro formato, e dispara contra um alvo.\n\nVocê pode fazer um ataque com Poder +2 e atingir um personagem Longe, sem Perda, mesmo sem a vantagem Alcance. Você pode gastar tempo e movimentos para concentrar energia — cada movimento aumenta o Poder em +2, sem custo extra em PM, até um máximo de movimentos igual ao Poder inicial. Você pode usar mais de uma rodada para acumular o bônus, mas não pode fazer outras ações e movimentos durante esse tempo.\n\nTodo disparo de energia tem um nome próprio e impressionante, que o atacante grita quando dispara. Invente esse nome. Se você (o jogador!) gritá-lo, a técnica gasta –1PM.', requirements: 'Luta ou Magia' },
        { name: 'Consertar', pm: '2 a 10PM', description: 'Você pode gastar uma ação e 2PM para curar 1D Pontos de Vida em um construto. Você pode gastar mais PM para aumentar a recuperação, até um máximo de dados igual à sua Habilidade ou 5, o que for menor.', requirements: 'Máquinas' },
        { name: 'Encantar', pm: '3PM (ou mais com Magia)', description: 'Seja por fala mansa, música cativante, ou poder mágico puro e simples, você torna um alvo extremamente amigável a você.\n\nFaça um teste de Poder resistido por um de Resistência do alvo; se tiver sucesso, ele não poderá realizar ações agressivas contra você (como atacá-lo). Além disso, também vai entender qualquer pedido seu como uma sugestão muito razoável. Pedidos muito difíceis ou contrários à sua natureza, como atacar um aliado ou violar um Código, permitem que ele faça um novo teste de Resistência para quebrar o encanto.\n\nUsando Magia, você pode gastar mais PM para ter bônus no teste, seguindo as regras da vantagem.', requirements: 'Arte, Influência ou Magia' },
        { name: 'Gambiarra', pm: '2PM', description: 'Você junta um barbante, chiclete, clipes de papel e faz uma bomba. Ou um computador. Ou ambos!\n\nVocê pode gastar 2PM para trocar qualquer perícia por Saber em um teste, mantendo a mesma meta. Você só pode fazer isso se tiver tempo e recursos suficientes; não é possível durante um combate, cenas de conflito ou testes resistidos.', requirements: 'Saber, Maestria (Saber)' },
        { name: 'Golpe Púrpura', pm: '3PM', description: 'Tornado famoso pelo General Púrpura, líder do exército ARSENAL e senhor da Ilha do Martelo, este golpe poderoso atinge o alvo com força tremenda.\n\nFaça um ataque. Você recebe um crítico automático. Além disso, caso consiga outro crítico, o alvo é também arremessado um passo de distância. Cada novo crítico aumenta essa distância, chegando a Fora de Alcance se rolar mais três críticos!\n\nSe houver obstáculos ou barreiras no caminho, o alvo também sofre 1D de dano extra para cada distância percorrida.', requirements: 'Poder 3, Luta' },
        { name: 'Grito da Selva', pm: '3PM', description: 'Você usa uma ação completa, toma fôlego e emite um grito poderoso, ouvido a quilômetros de distância. No início de seu próximo turno, animais selvagens ou outras criaturas da região surgem para ajudá-lo.\n\nOs animais permanecem até o fim da cena, atuando como um Ajudante de tipo à sua escolha em cada utilização. Ainda é preciso pagar PM de acordo com a regra da vantagem.\n\nOs animais surgem mesmo nos lugares mais improváveis — afinal, a vida sempre encontra um meio! Contudo, se o mestre achar isso impossível, ninguém responde ao chamado — mas você ganha um dharma como compensação, apenas uma vez na aventura!', requirements: 'Poder 2, Animais' },
        { name: 'Inspirar', pm: '3 ou 6PM', description: 'Você inspira um aliado com uma música ou discurso edificante.\n\nFaça um teste de Poder (9). Com sucesso, o aliado ganha +2 em todos os testes até o fim da cena. Cada acerto crítico em seu teste aumenta esse bônus em +1.\n\nGastando 6PM, você afeta todos os aliados Perto.', requirements: 'Poder 2 e Arte, Influência ou Devoto' },
        { name: 'Invocar Elemental', pm: '3PM', description: 'Você invoca uma criatura elemental, um ser de outro plano de existência, feito inteiramente de um elemento como água, ar, terra ou fogo.\n\nEnquanto está neste plano, ele age como um Ajudante, de um tipo escolhido por você ao conjurar a magia. Ainda é preciso pagar PM de cada utilização como Ajudante.', requirements: 'Habilidade 2, Magia' },
        { name: 'Megalon', pm: '10PM', description: 'Você aumenta o tamanho de uma criatura, tornando-a mais robusta, porém desajeitada.\n\nO alvo tem Ganho em todos os testes que envolvem esforço ou vigor físico, mas também Perda em testes de agilidade, coordenação e furtividade.\n\nUm alvo recebendo esta magia contra a vontade tem direito a um teste de Resistência contra a sua Habilidade para evitá-la.', requirements: 'Habilidade 3, Magia' },
        { name: 'Mikron', pm: '10PM', description: 'Você diminui o tamanho de uma criatura, tornando-a ágil, porém enfraquecida.\n\nO alvo tem Ganho em todos os testes que envolvem agilidade, coordenação e furtividade, mas passa a ter Perda em testes que envolvem esforço ou vigor físico.\n\nUm alvo recebendo esta magia contra a vontade tem direito a um teste de Resistência contra a sua Habilidade para evitá-la.', requirements: 'Habilidade 3, Magia' },
        { name: 'Pisão do Titã', pm: '3PM', description: 'Faça um ataque. Você golpeia o chão, atingindo com uma onda de choque todos os alvos (inimigos e aliados) Perto.\n\nAlvos que recebam dano acima de seu valor de Resistência são derrubados. Um personagem caído tem Perda em todos os testes até usar um movimento para se levantar.', requirements: 'Poder 3' },
        { name: 'Poeira Glacial', pm: '3PM + bônus de Magia', description: 'Você esfria o ar ao redor de um alvo, congelando-o.\n\nFaça um ataque. Você pode aumentar a intensidade do frio, usando Magia para receber bônus no teste. Se usar a regra de Tipos de Dano, este ataque causa dano de frio.\n\nSe o alvo perde um valor de PV acima de sua Resistência, ele congela, recebendo Perda em todos os testes por uma rodada.', requirements: 'Habilidade 2, Magia' },
        { name: 'Queimar o Cosmo', pm: '5 a 25PM', description: 'Você usa uma ação para queimar energia cósmica, fazendo-a fluir pelo seu corpo e aumentando suas capacidades.\n\nCada 5PM aumentam +1 seu Poder, Habilidade e Resistência, até o fim da cena (recursos não são afetados). O bônus máximo é igual à sua Resistência original, ou +5, o que for menor.', requirements: 'Resistência 2, Luta' },
        { name: 'Raio da Fúria', pm: '10PM', description: 'Você tem o poder de enfurecer os seres e transformá-los em monstros incontroláveis.\n\nO alvo recebe Poder +2 em testes de ataque, e tem críticos com 5 ou 6. No entanto, também tem Perda em todos os outros testes (incluindo defesa), e gasta o dobro de PM para vantagens e técnicas. Quando o efeito termina, o alvo fica exausto; seus PM caem a zero e tem Perda em todos os testes até descansar.\n\nUm alvo recebendo esta magia contra a vontade tem direito a um teste de Resistência contra seu Poder para evitá-la.', requirements: 'Habilidade 3, Magia' },
        { name: 'Rajada de Golpes', pm: '3PM', description: 'Você atinge o alvo com uma sequência veloz de golpes, atacando com Poder+2 e chance de crítico 5 ou 6.\n\nVocê pode gastar movimentos no mesmo turno para desferir ainda mais golpes; cada movimento aumenta o Poder em +2, sem custo extra em PM, até um máximo de movimentos igual à sua Habilidade.', requirements: 'Habilidade 2, Luta' },
        { name: 'Relâmpago', pm: '3PM + bônus de Magia', description: 'Você dispara um raio elétrico contra o alvo.\n\nFaça um ataque. Você pode aumentar a intensidade da eletricidade, usando Magia para ter bônus no teste. Se usar a regra de Tipos de Dano, este ataque causa dano de choque.\n\nSe o alvo perde um valor de PV acima da sua Resistência, fica atordoado, dando Ganho ao oponente em todos os testes resistidos (inclusive ataque e defesa) por uma rodada.', requirements: 'Habilidade 2, Magia' },
        { name: 'Sabedoria dos Ermos', pm: '1 ou 3PM', description: 'Seu conhecimento de sobrevivência permite obter itens necessários em locais com os quais você está familiarizado.\n\nQuando está na sua Arena, você pode gastar 1PM para usar um item comum, ou 3PM para um item incomum, além do que tiver no Inventário. Você não pode usar este item para recuperar os PM que acabou de gastar na técnica (claro que não!).', requirements: 'Arena, Sobrevivência' },
        { name: 'Role os Dados', pm: '5PM', description: 'O bardo do grupo também pode cantar o maior sucesso da banda Holy Avenger! Role um teste de Arte (9). Com sucesso, você e todos os aliados Perto recuperam 1PA. Para cada crítico na rolagem, recuperam 1PA extra.\n\nSe você (o jogador!) cantar o refrão da música (role os dados, e descubra o que vai acontecer...), a técnica custa –1PM para ser usada. Se o grupo inteiro cantar, reduz em –2PM!', requirements: 'Habilidade 3, Arte' },
        { name: 'Setas Infalíveis de Petrovna', pm: '1PM por seta', description: 'Você usa uma ação para criar uma ou mais setas de energia mágica, até um máximo de setas igual à sua Habilidade, que ficam flutuando ao seu redor — permanecendo até o fim da cena, ou até serem disparadas.\n\nCom um movimento, você pode disparar todas as setas para um ou mais alvos à sua escolha, dividindo-as como quiser. As setas atingem automaticamente, sem teste de ataque ou defesa — cada uma causando 1 ponto de dano e então sumindo. Alvos com defesa perfeita automática não sofrem dano.\n\nVocê pode manter apenas um conjunto de setas preparado por vez.', requirements: 'Habilidade 1, Magia' },
        { name: 'Bateu-Levou', pm: '4PM', description: 'Você transforma dor em poder de luta.\n\nSempre que você recebe um ataque que causa dano maior que 1PV, como reação, você pode pagar o custo da técnica para fazer imediatamente um ataque contra o agressor. Esse ataque tem um Ganho para cada crítico que você tenha sofrido.\n\nVocê pode realizar esse ataque mesmo que tenha sido derrotado pelo golpe inimigo, pois reage antes de cair (se tiver PM para o custo).', requirements: 'Habilidade 3, Luta' },
        { name: 'Escudo Sagrado', pm: '4PM', description: 'Você invoca uma barreira de energia santificada que protege você e seus companheiros.\n\nComo reação, faça um teste de defesa com +1 escala. Até o fim de seu próximo turno, qualquer aliado Perto pode substituir seu próprio teste de defesa pelo resultado do usuário da técnica.\n\nVocê não pode realizar outras ações ou movimentos enquanto mantém o escudo ativo.', requirements: 'Devoto' },
        { name: 'Foco Veloz', pm: '3PM', description: 'Você entra em estado de concentração total instantânea, mirando com velocidade e precisão sobre-humana.\n\nVocê recebe o benefício da vantagem Foco imediatamente com uma ação, sem precisar gastar um turno se concentrando (e nem ficar vulnerável enquanto o faz). Além disso, esse ataque recebe Ganho.', requirements: 'Poder 3, Resistência 3, Foco' },
        { name: 'Golpe Coordenado', pm: '3PM', description: 'Você sincroniza seus ataques com um aliado, aproveitando brechas fatais.\n\nQuando um aliado ataca um alvo que esteja ao seu alcance, você pode pagar o custo em PM da técnica para fazer um ataque contra o mesmo alvo como reação, na mesma iniciativa. Este ataque recebe Ganho. Se usar vantagens ou técnicas para este ataque, você também deve pagar seu custo, se houver.', requirements: 'Habilidade 3, Luta' },
        { name: 'Golpe Quebrador', pm: '3PM', description: 'Um ataque poderoso e acurado que despedaça a guarda do inimigo. Além de alguns dentes.\n\nFaça um ataque. Caso consiga um crítico, pague o custo da técnica. O alvo sofre Perda em testes de defesa até o fim do próximo turno do usuário da técnica.\n\nCaso consiga dois críticos, aumente a duração do efeito +1 turno; caso consiga três críticos ou mais, o alvo sofre Perda na defesa até o fim da cena.', requirements: 'Poder 3, Habilidade 3, Luta' },
        { name: 'Grito de Guerra', pm: '3PM', description: 'Quando a situação vai mal, você levanta a moral de seus aliados com um brado poderoso.\n\nCom um movimento e custo em PM, todos os membros do grupo até Longe recebem bônus em Poder e Resistência para cada problema a seguir:\n• +1 se o grupo está em desvantagem numérica.\n• +1 para cada escala superior do oponente.\n• +1 para cada aliado perto da derrota ou derrotado.\n• +2 para cada aliado morto.\n\nValem apenas problemas presentes no instante do Grito de Guerra, não aqueles que apareçam depois (a menos que use o Grito outra vez, pagando seu custo). O bônus máximo é igual ao Poder do usuário da técnica.', requirements: 'Poder 3, Esporte ou Luta, Influência' },
        { name: 'Onda de Cura', pm: '4PM', description: 'Você canaliza energia vital em uma pulsação luminosa que percorre o campo de batalha.\n\nTodos os seus aliados Perto recuperam 1D+1 PV. Aliados que estejam com metade ou menos de seus PV totais recuperam 2D+2 PV.\n\nVocê pode gastar +2PM adicionais para afetar todos os aliados até Longe.', requirements: 'Medicina ou Cura' },
        { name: 'Provocar o Destino', pm: '2PM', description: 'Você desafia os inimigos com uma atitude tão irritante quanto heroica. Ou convence os monstros de que seus aliados são menos apetitosos.\n\nQuando você ativa a técnica, até o fim de seu próximo turno, todos os inimigos na cena sofrem Perda em testes para atacar qualquer de seus aliados — mas não para atacar você!\n\nPela duração do efeito, você também pode usar Defesa Especial (Provocação) sem custo em PM.', requirements: 'Defesa Especial (Provocação)' },
        { name: 'Bênção da Coragem', pm: '3PM', description: 'Você conhece métodos mágicos ou mundanos para lidar com a força do cagaço e o pavor. O alvo da técnica recebe Ganho contra efeitos de medo.', requirements: 'Resistência 2' },
        { name: 'Presença Assustadora', pm: '3PM', description: 'Você sabe como se tornar intimidador. Pela duração da técnica, recebe Ganho em testes para amedrontar — e qualquer criatura amedrontada por você sofre Perda em testes contra você.', requirements: 'Habilidade 2, Influência' },
        { name: 'Possessão', pm: 'Veja a seguir', description: 'Você pode possuir o corpo de outro ser inteligente. O alvo deve estar adormecido, inconsciente ou derrotado.\n\nFaça um teste de Poder resistido pela Resistência do alvo (bônus e penalidades em relação à magia e poderes mentais se aplicam); se tiver sucesso, você pode controlar aquele corpo, mantendo seus atributos, recursos, vantagens e desvantagens físicas. Pontos de Mana, perícias, conhecimentos e valores morais (como Códigos) não são afetados — ou seja, você ainda utiliza os seus, não da vítima.\n\nA técnica consome PM em valor igual à Resistência da vítima. Se a vítima tem algum bônus ou penalidade em relação a magia, esse ajuste se aplica ao custo da possessão, em PM (por exemplo, uma vítima com R3 e Resoluto custa 5PM). Você pode possuir uma quantidade de vítimas simultâneas igual à sua H. Fantasmas podem tentar possuir vítimas despertas por +3PM.', requirements: 'Habilidade 4 ou Fantasma ou Incorpóreo' },
        { name: 'Rolamento Defensivo', pm: '2PM', description: 'Quando sofre um ataque, você pode usar essa técnica como reação. Gaste 2PM e some sua Habilidade ao teste de defesa. Sua Habilidade é somada mais uma vez para cada crítico que rolar. — Se rolar não funcionou, você não rolou o bastante.', requirements: 'Habilidade 2, Luta' },
        { name: 'Vínculo de Sangue', pm: '3PM', description: 'Quando seu protegido está em cena, você está disposto a sangrar até a morte por ele. Pela duração da técnica, enquanto pode ver seu protegido, você recebe todo o dano que ele sofreria, mantendo-o seguro. Além disso, você recebe Ganho em testes de defesa.', requirements: 'Resistência 2, Protegido' },
        { name: 'Metamorfose Maior', pm: '3PM por ponto para ativar, 2PM por rodada para manter', description: 'Quando entra em um conflito violento, você pode usar a técnica Metamorfose para se transformar em criaturas realmente assustadoras. Garras, carapaças protetoras, chifres espiralados, presas, asas cortantes: qualquer coisa pode surgir em seus ataques selvagens.\n\nAo ativar a técnica, você pode escolher entre as seguintes vantagens: Aceleração, Ágil, Alcance, Ataque Especial, Defesa Especial, Forte, +Membros, Sentidos, +Vida, Vigoroso e Voo. Cada ponto de custo das vantagens escolhidas custa 3PM, até um máximo de pontos igual a sua Habilidade. Manter a técnica ativa ainda custa 2PM/rodada, não importando o número de vantagens em uso.', requirements: 'Habilidade 4, Metamorfose' },
        { name: 'Criatura Mágica', pm: 'Veja adiante', description: 'Magia pura pode ser usada para construir criaturas: fantasmas de papel, estátuas de fogo, pássaros de luz... qualquer coisa que sua imaginação mandar.\n\nO poder da criatura depende dos Pontos de Mana investidos. Ela pode ter as seguintes vantagens: Aceleração (+1PM), Incorpóreo (+2PM), Inofensivo (+1PM), Sentido (+1PM cada) ou Voo (+1PM). Se alguma vantagem gasta PM para usar, é você quem paga. Sempre que a criatura faz um teste, o atributo conta como metade do seu.\n\nA criatura tem PV na mesma quantidade dos PM gastos. Você pode investir mais durante a criação para aumentá-los. Essas criaturas não recuperam PV; quando eles zeram, são imediatamente dissipadas.\n\nA criatura não tem mente própria; você a controla, usando suas próprias ações e movimentos (você fica imóvel enquanto ela age). Os poderes da criatura são fixos — se quiser mudá-los, precisa gastar mais PM e construir tudo de novo. Você pode ver e ouvir por meio da criatura, mas ela não pode se afastar além do alcance.\n\nEnquanto a criatura existe, PM gastos para invocá-la ficam “presos” nela. Você só pode recuperá-los depois de desfazer a criatura (não gasta ação ou movimento). Criaturas mágicas têm Imune (Abiótico, Doenças, Sem Mente) e Sem Vida.', requirements: 'Magia e Animais ou Mística' },
        { name: 'Flashback Dramático', pm: '2PM', description: 'Você ativa seu poder mais perigoso — uma lembrança dramática demais para ser ignorada. Com um movimento, você inicia um flashback narrado em voz grave, com iluminação contrastada e trilha sonora pesada. O alvo, pego de surpresa pela súbita carga narrativa, hesita.\n\nEscolha um inimigo Perto. Faça um teste de Arte ou Influência resistido por Percepção ou Manha do alvo. Se vencer, o inimigo fica impactado e só pode fazer uma ação ou movimento até sua próxima rodada. Se o alvo rola uma falha crítica, perde o turno paralisado pela profundidade de sua dor.', requirements: 'Arte ou Influência' },
        { name: 'Sorriso Inquebrável', pm: '2PM, depois 1PM por uso', description: 'Quando tudo parece desmoronar, você sorri. Não por coragem — mas porque o desespero que o inimigo causa não merece reconhecimento. Com uma ação e 2PM, você encara o alvo com um sorriso calmo, confiante e impossível de ignorar.\n\nFaça um teste de Resistência contra o Poder do inimigo. Se vencer, até o fim da cena você pode gastar 1PM para ter Ganho em cada teste contra ele. Sempre que você faz isso, o alvo pode fazer um novo teste de Poder para encerrar a técnica, superando a vergonha, medo ou raiva de ser provocado por um simples sorriso insolente.', requirements: 'Resistência 2 e Arte ou Influência' }
    ],
    lendaria: [
        { name: 'Abrir Chakra', pm: '15PM', description: 'Você desbloqueia um chakra, um vórtice de energia espiritual em seu corpo. Cada atributo tem um chakra correspondente, que são técnicas separadas.\n\nAbrir o chakra usa um movimento. Até o fim da cena, você tem Ganho e um crítico automático em testes do atributo correspondente (incluindo testes de ataque e defesa).\n\nCada atributo também tem um efeito extra quando seu chakra é aberto:\n• Poder. O alvo tem Perda em testes de defesa.\n• Habilidade. Você pode gastar 1PM para fazer um movimento extra. O máximo de movimentos por rodada é igual ao atributo. Cada três movimentos podem ser trocados por uma ação extra, mas você só pode realizar um ataque extra por rodada, independente de quantas ações realizar.\n• Resistência. Você recebe 20PV extras e todas as suas defesas são perfeitas.\n\nQuando o efeito termina você cai exausto, com o recurso daquele atributo reduzido a zero. Caso seja Resistência, você cai derrotado e inconsciente (pois não tem mais PV). Para os demais, tem Perda em todos os testes devido ao cansaço, até se recuperar.', requirements: 'Atributo 4, Luta' },
        { name: 'Bomba Vital', pm: 'Veja a seguir', description: 'Você absorve energia da própria natureza, acumulando magia ambiente bruta e moldando-a como uma esfera brilhante, arremessada contra um oponente.\n\nUse uma ação completa e faça um teste de Resistência (9). Para cada ponto que seu teste superar a meta, você acumula 1PM na bomba, até uma quantidade máxima por rodada igual ao atributo. Você pode demorar mais para acumular mais energia, até um limite de rodadas igual à sua Resistência. Quando chegar a esse limite, precisa arremessar a bomba ou dissipá-la.\n\nEnquanto está acumulando energia, aliados Perto podem doar PM a você. Cada ação de um aliado doa 1D PM. Diferente de você, seus aliados gastam os próprios PM.\n\nQuando estiver pronto, você pode usar outra ação completa para arremessar a bomba. Este ataque atinge todos os alvos Perto do alvo principal, com um bônus de Poder igual aos PM acumulados. Para 20PM ou mais, o ataque tem Ganho.\n\nMesmo não usando sua própria energia, a exaustão faz seus PM caírem a zero. Você também tem Perda em todos os testes até descansar.', requirements: 'Resistência 4, Luta' },
        { name: 'Dim Mak', pm: '5PM', description: 'Você sabe atingir pontos de pressão no corpo do oponente, para paralisar membros ou órgãos vitais, e até matar com um simples toque!\n\nQuando usa o Dim Mak, você faz um ataque com chance de crítico máxima (4, 5 ou 6) que não pode ser combinado com nenhuma outra vantagem ou técnica. Superando a defesa, em vez de causar dano, o alvo perde 2 pontos em um atributo à sua escolha. Cada crítico faz perder 1 ponto adicional.\n\nCaso o atributo seja reduzido a 0, é considerado nulo. O alvo perde os recursos desse atributo, e não pode fazer testes que o utilizem. Caso seja Resistência, o alvo entra em coma e deve fazer imediatamente um teste de morte.\n\nSe sobreviver, a recuperação será demorada: 1 ponto de atributo para cada 1D dias de repouso absoluto.', requirements: 'Habilidade 5, Luta' },
        { name: 'Mata-Kaiju', pm: '10PM + bônus de Magia', description: 'Uma das mais poderosas magias de destruição conhecidas, dispara uma avassaladora descarga de energia que destrói uma grande área ao redor do ponto de impacto.\n\nMata-Kaiju requer três rodadas para ser conjurada. A primeira, usando Magia para aumentar o seu ataque ao máximo, gastando PM para ter bônus no teste; a segunda, concentrando e intensificando a energia reunida; e a terceira, para fazer o disparo. O teste de ataque tem dois críticos automáticos (duas escalas acima!) e atinge todos os alvos Longe do alvo principal (é melhor estar Muito Longe quando utilizá-la!). Devido à imensa área do ataque, todos os testes de defesa recebem duas Perdas.', requirements: 'Habilidade 5, Magia' },
        { name: 'Megalon Superior', pm: '25 ou 50PM', description: 'Versão aprimorada da magia Megalon, capaz de transformar o alvo em algo realmente titânico! O alvo é elevado uma escala acima (25PM) ou duas (50PM).', requirements: 'Habilidade 6, Megalon' },
        { name: 'Metamagia', pm: 'Veja abaixo', description: 'Você domina as artes místicas com tamanha precisão que pode modificar todos os seus parâmetros!\n\nEste é um conjunto de truques lendários, que altera o efeito da vantagem Magia e qualquer técnica que a tenha entre os requisitos. Sempre que usar Magia ou suas técnicas, você pode gastar mais PM para adicionar os seguintes efeitos:\n• Acelerar magia. +5PM para diminuir o tipo de ação da magia em um passo (de ação para movimento, por exemplo).\n• Alvos extras. +1PM por alvo extra, até um máximo de alvos iguais à sua Habilidade. O efeito da magia deve ser dividido entre eles (por exemplo, um bônus de +4 pode ser dividido entre dois alvos que recebem +2 cada).\n• Duplicar magia. Cria um efeito extra da magia na mesma ação, pagando duas vezes o custo em PM.\n• Estender magia. +3PM para aumentar o alcance de magia um passo (de Perto para Longe, por exemplo). Você pode usar mais PM para estendê-lo ainda mais.\n• Expandir magia. +3PM para afetar todos Perto do alvo, +9PM para todos Longe, e +15PM para todos Muito Longe. Cada passo de distância impõe uma Perda em testes de defesa para evitar. Lembre que você mesmo pode acabar dentro da área de efeito!\n\nVocê pode adicionar um máximo de efeitos em cada magia igual à sua Habilidade. Um personagem com H5, por exemplo, pode adicionar acelerar magia, três alvos extras, e estender magia.\n\nDuplicar magia conta como dois efeitos. Em estender magia, cada distância além de Perto é um efeito extra. Em expandir magia, cada distância são dois efeitos.', requirements: 'Habilidade 5, Magia, Maestria (Mística)' },
        { name: 'Morte Estelar', pm: '100PM', description: 'Esta talvez seja a magia mais destrutiva de todo o universo conhecido! Usada pela própria semideusa Vitória para derrotar o deus-monstro K\'Athanoa, consome toda a energia de uma estrela, que desaparece do céu. Essa energia então é convertida em um único disparo, destruindo imediatamente o alvo — não importando ser uma criatura, uma cidade, um planeta ou mesmo um deus!\n\nObviamente, cada vez que essa técnica é usada, um sol morre em algum lugar do universo — existindo uma chance de extinção para mundos ou civilizações inteiras. Caso isso ocorra (resultado 1 em 1D), entidades cósmicas mantenedoras do equilíbrio universal procuram o conjurador para aplicar penalidades adequadas. Pode ir fazendo outro personagem!', requirements: 'Habilidade 9, Magia' },
        { name: 'Percepção Cósmica', pm: '5PM para ativar, 1PM por rodada para manter', description: 'Você é um com o mundo! Com uma ação e 5PM, pode entrar em um estado de conexão profunda com o universo, e enxergar as próprias linhas de energia que ligam os seres vivos e o mundo ao seu redor. Você deve gastar 1PM no começo de seu turno para manter esse estado de conexão cósmica.\n\nEnquanto está com a técnica ativa, você tem Ganho e um crítico automático em todos os testes de Percepção. Além disso, pode gastar 1PM para adquirir qualquer Sentido por uma rodada, ou trocar a perícia de qualquer teste (inclusive ataque e defesa) por Percepção.', requirements: 'Habilidade 5, Maestria (Percepção)' },
        { name: 'Rapsódia das Arcas', pm: '3PM por rodada', description: 'Você executa uma longa canção épica, exaltando os feitos de seus companheiros, tornando-os a melhor versão de si mesmos.\n\nA cada rodada você faz um teste de Poder com meta crescente. Para cada sucesso, seus aliados Perto recebem um novo benefício:\n• 1ª Rodada (6). Todas as vantagens e técnicas de seus aliados custam –2PM.\n• 2ª Rodada (9). Seus aliados recuperam 5PV e 5PM no começo de seu turno.\n• 3ª Rodada (12). Seus aliados conseguem crítico com 5 ou 6.\n• 4ª Rodada (15). Seus aliados têm defesa perfeita e Ganho em um teste na rodada.\n\nOs benefícios são cumulativos. Após a quarta rodada, a música termina no início de seu próximo turno. Quando isso acontece, ou se você falhar em algum teste, todos os benefícios são perdidos. Mas se o público pedir bis, você pode começar de novo!', requirements: 'Poder 4, Maestria (Arte)' },
        { name: 'Sabedoria Selvagem', pm: '5 ou 10PM', description: 'Você é ainda mais eficiente em encontrar itens de utilidade em locais com os quais é familiarizado.\n\nQuando está na sua Arena, você pode gastar 5PM para usar um item raro, ou 10PM para um item lendário.\n\nNão, você não pode usar esse item para recuperar os PM que gastou na própria técnica!', requirements: 'Habilidade 4, Sabedoria dos Ermos' },
        { name: 'Trapacear o Destino', pm: '5 a 15PM', description: 'Você é tão esguio e trapaceiro que nem o próprio destino consegue pegá-lo!\n\nSempre que rolar 1 em um dado, você pode gastar 5PM para virá-lo do outro lado e trocá-lo por um 6 (e um acerto crítico). Você pode até transformar uma falha crítica em um sucesso devastador! Diferente de outras técnicas, este custo nunca pode ser reduzido por vantagens, poderes ou outros meios.', requirements: 'Habilidade 5, Maestria (Manha)' },
        { name: 'Visão do Futuro', pm: '3PM', description: 'O futuro é show! Você consegue enxergar alguns instantes no futuro e, talvez, fazer algo para mudá-lo.\n\nSempre que alguém faz um teste contra você, seja um ataque, defesa ou teste resistido, você pode gastar 3PM como reação para fazê-lo rolar esse teste duas vezes, e ficar com o resultado que você escolher.', requirements: 'Habilidade 5' },
        { name: 'Despertar da Centelha', pm: '10PM para ativar, 2PM por rodada para manter', description: 'Durante um momento de combate extremo — quando tudo parece perdido, o sangue ferve e o mundo desacelera — você sente. Uma fagulha. Um estalo. Um rugido silencioso que vem de dentro. Você não se torna uma fera; você se torna você mesmo, sem limites!\n\nO Despertar da Centelha é uma transformação intensa. Os olhos brilham, os golpes fazem o chão tremer, seu estilo de luta se torna uma dança brutal de emoção e força. Como se a realidade perdesse firmeza ao seu redor — e, por breves instantes, você se torna o protagonista absoluto da cena.\n\nEsta técnica não é ensinada; ela é despertada. Pode surgir espontaneamente durante uma luta memorável, um momento dramático, ou ser transmitida por um mestre da Centelha durante um evento decisivo.\n\nEnquanto a técnica está ativa, você recebe os seguintes efeitos:\n• Seus testes de Luta e Esporte aumentam uma escala.\n• Seus ataques ignoram Perdas.\n• Quando um ataque vence a defesa do alvo, pode gastar 1PM para atacar uma segunda vez com Perda (que não pode ser ignorada), uma vez por turno.\n• Você é automaticamente bem-sucedido em testes de Luta e Esportes (exceto ataques) com meta 12 ou menos.\n\nAssim que a duração acaba (quando a cena termina, por escolha ou por ficar sem PM), você sofre exaustão intensa e os seguintes efeitos:\n• Seus PM caem a zero.\n• Você sofre Perda em todos os testes até recuperar metade dos PM.\n• Não pode ativar esta técnica novamente na mesma sessão.', requirements: 'Habilidade 5; Esporte, Luta; ter participado de uma luta com risco real de morte' },
        { name: 'Erga-se!', pm: 'Veja adiante', description: 'Você pode ressuscitar um inimigo vencido como seu servo.\n\nA técnica pode ser utilizada apenas em um alvo que você derrotou e destruiu sem ajuda (você mesmo reduziu todos os seus Pontos de Vida), na mesma cena. Você gasta PM e faz um teste de Mística, com meta igual à soma dos atributos do alvo (P+H+R); este também é o custo em PM para usar a técnica.\n\nEm caso de sucesso, o alvo ressuscita em forma fantasmagórica, mas com a mesma ficha original. Ele segue todas as ordens do invocador dentro de suas capacidades, até o fim da cena.\n\nUm servo ressuscitado com sucesso pode ser invocado outras vezes mais tarde, pelo mesmo custo em PM. Inimigos de escala superior são imunes a esta técnica.', requirements: 'Habilidade 5, Mística, Magia' },
        { name: 'Explosão de Glória', pm: 'Veja adiante', description: 'Como técnica de último recurso, você gasta todos os seus PV e PM restantes para causar uma grande detonação. A bomba é você mesmo.\n\nO dano da explosão é igual a seu Poder + 2D. Adicione +1D se está perto da derrota, ou +2D se está derrotado. A explosão atinge todos os inimigos até Longe (mas não aliados).\n\nApós a explosão todos os seus recursos caem para zero. Se você tem algum meio de voltar da morte (Imortal, Regeneração...), isso acontece apenas depois que a cena termina. Se não tem... ué, por que foi aprender esta técnica, diabos??', requirements: 'Poder 5' },
        { name: 'Mestre da Masmorra', pm: 'Especial', description: 'Após vencer a masmorra, você se torna seu mestre. Esta técnica pode ser adquirida apenas após explorar completamente uma masmorra (todas as câmaras e corredores) e derrotar seu ocupante mais poderoso.\n\nEnquanto está na masmorra, você tem os seguintes benefícios:\n• A masmorra se torna sua Base. Você pode alcançá-la mesmo em situações de perigo, levando aliados consigo. Todos os seus testes na masmorra têm Ganho.\n• Você se torna Imortal. Se morrer (dentro ou fora), pode ressurgir em qualquer ponto da masmorra à sua escolha.\n• Você recebe Teleporte para qualquer ponto da masmorra.\n• Você pode ver e ouvir em qualquer parte da masmorra. Se tiver Sentido, este também adquire o mesmo alcance.\n• Na sua masmorra, armadilhas não disparam contra você, e portas abrem sozinhas para deixá-lo passar.\n• Todos os ocupantes originais da masmorra tornam-se seus servos, mas não podem deixar a masmorra. Se forçados a fazê-lo, você perde o controle sobre eles.\n\nTodos estes benefícios são preservados até você conquistar outra masmorra — ou ser destruído pelo próximo grupo de aventureiros, o que vier primeiro!', requirements: 'Veja adiante' },
        { name: 'Cicatriz Demoníaca', pm: '10PM', description: 'Seu corpo é marcado por uma cicatriz originada de fontes infernais macaaaabras. Quando usa a técnica, você extrai poder da cicatriz para aumentar em um sua escala até o fim da cena. Entretanto, sua Maldição faz efeito imediatamente.', requirements: 'Maldição 2' },
        { name: 'Invocar Horda', pm: '5PM (Pequena), 10 (Grande) ou 20 (Enorme)', description: 'Você conjura um tipo especial de Ajudante chamado Horda, semelhante às hordas da página 106. Sempre que o Ajudante é utilizado, o seu ataque atinge simultaneamente todos os alvos Perto (Pequeno), Longe (Grande) ou Muito Longe (Enorme). Você faz apenas um teste de ataque e cada alvo atingido faz um teste de defesa separado.', requirements: 'Habilidade 4, Influência ou Mística, Ajudante' },
        { name: 'Não Sabe Quando Desistir', pm: '10PM por rodada', description: 'Quando derrotado, você pode usar essa técnica para continuar lutando, sem sofrer efeitos negativos da derrota. A técnica dura até acabarem os PM para mantê-la. Você ainda faz testes de morte quando sofre dano ou por qualquer outro motivo.', requirements: 'Resistência 4, Luta' },
        { name: 'Artífice Divino', pm: '3PM para cada 10XP do Artefato', description: 'Como os grandes artífices dos deuses, você pode criar Artefatos para você e seus aliados. Um Artefato de 10XP custa 3PM e requer um teste de Máquinas Médio (9). Cada 10XP extras aumenta o custo em 3PM e a meta em um passo. Um Artefato de 50XP, por exemplo, exige 15PM e um teste Improvável (25). O custo máximo do Artefato é 10XP para cada ponto de sua Habilidade.\n\nCada teste representa uma hora de trabalho dentro da cena, em que você fica indisponível para qualquer outra atividade. Quanto mais testes realizar, mais tempo fica sem ajudar o grupo de outras formas.\n\nO Artefato dura até o fim da próxima cena. Você não pode recuperar PM gastos até ele deixar de existir.', requirements: 'Habilidade 6, Maestria (Máquinas)' },
        { name: 'Bênção do Sacrifício', pm: '5 ou 15PM', description: 'Esta técnica é uma forma avançada de Pacto: em vez de uma criatura sinistra, deve honrar um local sagrado de mitos e lendas. Neste lugar de extremo poder — as raízes da Árvore do Mundo, o Rio das Almas Esquecidas, o Poço da Sabedoria Divina, ou qualquer outro inventado para a campanha — você sacrificou algo de grande valor para você, e em troca recebeu um benefício além de tudo que poderia imaginar.\n\nPara adquirir essa técnica, você precisa sacrificar alguma coisa sua. Alguns sacrificam uma parte do corpo, como um ou dois olhos, um membro, os dentes. Outros sacrificam um sentido como a visão, olfato ou tato. E outros ainda sacrificam coisas mais metafóricas, como o próprio futuro, felicidade ou amor. Independente da escolha, esse sacrifício traz uma desvantagem, diferente daquelas que você já tem, sem ganhar pontos por isso.\n\nApós fazer o sacrifício e pagar XP pela técnica, escolha uma perícia que você possui. Em um teste com essa perícia, você pode gastar 5PM para aumentar em uma escala. Sacrifícios maiores dão benefícios melhores: se recebeu uma desvantagem de –2 pontos, pode gastar 15PM para aumentar o teste em duas escalas. Benefícios diferentes também podem ser negociados com o mestre.', requirements: 'Sacrificar algo importante para você' },
        { name: 'Multi-Clones', pm: '5, 10 ou 20PM', description: 'Você cria não apenas um, mas centenas ou milhares clones de si mesmo! Cada um, no entanto, é muito mais fraco que você.\n\nVocê recebe um Companheiro, com ficha igual à sua, mas seguindo as regras de hordas. O tamanho da horda depende de quanto você está disposto a pagar: 5PM (Pequena), 10PM (Grande) ou 20PM (Enorme).\n\nVocê divide seus movimentos e ações entre você e a horda de clones. Além disso, pode direcionar qualquer dano que receba para seus clones, dividindo livremente a perda de PV entre você e o Companheiro. O inimigo nunca sabe se acertou você ou um clone, até ele desaparecer em uma nuvem de fumaça!', requirements: 'Habilidade 3, Clone' }
    ]
};

        description: 'Apesar dos temores e conflitos iniciais, a Era das Arcas trouxe prosperidade ao mundo. Onde muitos viram masmorras e monstros, os empreendedores ousaram desafiar seus mistérios — sendo Arturo Amon o caso mais icônico. Trouxeram ciências exóticas, tesouros mágicos e técnicos, inovações industriais, novas formas de entretenimento. Empresas (e até empresários) tornaram-se mais poderosas que governos. Entre os que enriqueceram, ou já nasceram endinheirados, há aqueles que vivem aventuras. Alguns querem aumentar ainda mais sua fortuna — assim como aventureiros caçam tesouros que fortificam seus poderes. Outros, por nobreza e generosidade, usam suas posses para causas justas: ajudar pessoas, proteger o mundo, combater o mal. Outros ainda buscam realizar algum grande sonho que o dinheiro, apenas, não pode alcançar. Abastados gargalham de ditados como “o dinheiro é raiz de todo o mal”. Sabem que sua riqueza representa esforço, competência e determinação, que eles podem usar para realizar grandes obras. Muito embora alguns, de fato, sejam gananciosos e não hesitem em prejudicar outros para ganho próprio.',

        description: 'A alquimia, ciência da transmutação dos elementos, já existe neste mundo há séculos — mas agora está alcançando seu apogeu, com técnicas trazidas de além-Convergência. Naquele mundo fantástico, até onde se sabe, alquimistas são indivíduos muito poderosos. Alquimistas são um tipo especial de conjurador arcano, com seus próprios métodos. Através de fórmulas complexas traçadas em diagramas, podem transformar ou destruir os elementos que formam o mundo. Mudam a forma de objetos, criaturas ou até o próprio corpo, mas seguindo leis rigorosas: para conseguir algo, deve-se dar algo em troca. Estudioso disciplinado, o alquimista não acredita em milagres ou conquistas fáceis. Tudo que é valioso exige esforço, trabalho duro e sacrifício. Alquimistas sabem que nem sempre o sucesso é garantido, nem todo esforço é recompensado. Sempre existe chance de falhar. Mas, sem esforço ou risco, existe apenas a certeza de falhar.',

function toggleCondition(c, condName) {
    ensureCatalog(c);
    const isActivating = !c.activeConditions[condName];
    c.activeConditions[condName] = isActivating;
    
    if (isActivating) {
        logMessage(`⚠️ STATUS: ${c.name} agora está sob a condição "${condName}".`);
    } else {
        logMessage(`✅ STATUS: ${c.name} não está mais sob a condição "${condName}".`);
    }
    
    save(); 
    render();
}

function showConditionInfo(condName) {
    const cond = CONDICOES.find(c => c.name === condName);
    if (!cond) return;
    alert(`${cond.name}\n\n${cond.description}\n\nFonte: ${cond.source}`);
}

function announceCondition(c, condName) {
    const cond = CONDICOES.find(c => c.name === condName);
    if (!cond) return;
    logMessage(`ℹ ${c.name} — Condição: ${cond.name}\n${cond.description}\nFonte: ${cond.source}`);
}

function renderConditionsTab(c) {
    if (!c) return '';
    ensureCatalog(c);
    
    return `<div class="card"><h3>⚔️ Condições e Status</h3>
        <p class="muted">Marque as condições ativas. Clique na lupa para ver as regras ou no "i" para enviar ao chat.</p>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px;">
            ${CONDICOES.map(cond => {
                const isChecked = c.activeConditions[cond.name] === true;
                return `<div class="catalogrow" style="margin: 0 !important;">
                    <label class="skill-cost" title="Ativar/Desativar condição" style="white-space:nowrap;">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleConditionById('${c.id}', '${esc(cond.name)}', this.checked)">
                    </label>
                    <span style="font-weight: 600; font-size: 13px;">${esc(cond.name)}</span>
                    <button type="button" title="Ver regra completa" onclick="showConditionInfo('${esc(cond.name)}')">🔍</button>
                    <button type="button" title="Enviar ao chat" onclick="announceConditionById('${c.id}', '${esc(cond.name)}')">i</button>
                </div>`;
            }).join('')}
        </div>
    </div>`;
}

function toggleConditionById(id, condName, checked) {
    const mesa = current();
    if (!mesa) return;
    
    // Busca no personagem principal
    let target = mesa.characters.find(x => x.id === id);
    
    // Se não achou, procura dentro dos veículos de todos os personagens
    if (!target) {
        for (const p of mesa.characters) {
            const v = (p.vehicles || []).find(x => x.id === id);
            if (v) { target = v; break; }
        }
    }
    
    if (!target) return;
    ensureCatalog(target);
    
    target.activeConditions[condName] = checked;
    
    if (checked) {
        logMessage(`⚠️ STATUS: ${target.name} agora está sob a condição "${condName}".`);
    } else {
        logMessage(`✅ STATUS: ${target.name} não está mais sob a condição "${condName}".`);
    }
    
    save();
    render();
}

function announceConditionById(id, condName) {
    const mesa = current();
    if (!mesa) return;
    let target = mesa.characters.find(x => x.id === id);
    if (!target) {
        for (const p of mesa.characters) {
            const v = (p.vehicles || []).find(x => x.id === id);
            if (v) { target = v; break; }
        }
    }
    if (!target) return;
    const cond = CONDICOES.find(c => c.name === condName);
    if (!cond) return;
    logMessage(`ℹ ${target.name} — Condição: ${cond.name}\n${cond.description}\nFonte: ${cond.source}`);
}

function masterClearAllConditions() {
    if (!requireMaster()) return;
    if (!confirm('Atenção: Isso removerá TODAS as condições ativas de TODOS os personagens e subfichas da mesa. Continuar?')) return;
    
    const mesa = current();
    if (!mesa) return;
    let alterou = false;
    
    mesa.characters.forEach(c => {
        if (c.activeConditions && Object.keys(c.activeConditions).length > 0) {
            c.activeConditions = {};
            alterou = true;
        }
        (c.vehicles || []).forEach(v => {
            if (v.activeConditions && Object.keys(v.activeConditions).length > 0) {
                v.activeConditions = {};
                alterou = true;
            }
        });
    });
    
    if (alterou) { save(); render(); }
}

function masterRemoveCondition(charId, condName, vId = '') {
    if (!requireMaster()) return;
    const mesa = current();
    if (!mesa) return;
    
    let target = mesa.characters.find(x => x.id === charId);
    if (vId) {
        const owner = mesa.characters.find(x => x.id === charId);
        if (owner) target = (owner.vehicles || []).find(v => v.id === vId);
    }
    
    if (!target || !target.activeConditions) return;
    if (target.activeConditions[condName]) {
        delete target.activeConditions[condName];
        save();
        render();
    }
}

function renderConditionsBadge() {
    const mesa = current();
    if (!mesa) return '';
    
    const afetados = mesa.characters.filter(c => c.activeConditions && Object.keys(c.activeConditions).length > 0);
    if (afetados.length === 0) return '';

    let totalConds = 0;
    afetados.forEach(c => totalConds += Object.keys(c.activeConditions).length);

function ensureCatalog(c) {
    if (!c.entries) c.entries = { vantagens: [], desvantagens: [], tecnicas: [] };
    if (!c.kits) c.kits = [];
    if (!c.skillCosts) c.skillCosts = {};
    if (!Array.isArray(c.specializations)) c.specializations = [];
    if (!c.specializationCosts) c.specializationCosts = {};
    for (const type of ['vantagens','desvantagens','tecnicas']) {
        (c.entries[type] || []).forEach(e => { if (e.counted === undefined) e.counted = false; });
    }
    if (!Array.isArray(c.techniques)) c.techniques = [];
    if (!c.meals || typeof c.meals !== 'object') c.meals = { basica: [], gourmet: [], chef: [] };
    for (const k of ['basica','gourmet','chef']) {
        if (typeof c.meals[k] === 'number') c.meals[k] = Array(Math.max(0, c.meals[k])).fill({ index: null });
        if (!Array.isArray(c.meals[k])) c.meals[k] = [];
    }
    if (!c.artifacts || typeof c.artifacts !== 'object') c.artifacts = { armas: [], armaduras: [], acessorios: [] };
    for (const k of ['armas','armaduras','acessorios']) {
        if (typeof c.artifacts[k] === 'string') {
            const lines = c.artifacts[k].split('\n').map(s => s.trim()).filter(Boolean);
            c.artifacts[k] = lines.map(() => ({ index: null }));
        }
        if (!Array.isArray(c.artifacts[k])) c.artifacts[k] = [];
    }
    if (!Array.isArray(c.vehicles)) c.vehicles = [];
    if (!c.equipment) c.equipment = { arma: '', armadura: '', acessorio1: '', acessorio2: '' };
    if (!c.inventoryItems || typeof c.inventoryItems !== 'object') c.inventoryItems = { comum: [], incomum: [], raro: [] };
    for (const r of ['comum','incomum','raro']) {
        if (typeof c.inventoryItems[r] === 'string') {
            const lines = c.inventoryItems[r].split('\n').map(s => s.trim()).filter(Boolean);
            c.inventoryItems[r] = lines.map(() => ({ index: null }));
        }
        if (!Array.isArray(c.inventoryItems[r])) c.inventoryItems[r] = [];
    }
    if (!c.activeConditions) c.activeConditions = {};
    return c.entries;
}

function pointsPanel(c) {
    ensureCatalog(c);
    initializeCharacterExtras(c);
    let attrs = (Number(c.p) || 0) + (Number(c.h) || 0) + (Number(c.r) || 0);
    let skillsCount = (c.skills || []).filter(s => s && c.skillCosts[s] === true).length;
    let specsCount = (c.specializations || []).filter(s => s && c.specializationCosts[s] === true).length;
    let advantages = 0;
    for (let e of c.entries.vantagens) { if (e.counted !== true) continue; let x = CATALOG.vantagens[e.index]; if (x) advantages += Number(x.points) || 0; }
    const hasInventory = c.entries.vantagens.some(e => e.counted === true && CATALOG.vantagens[e.index]?.name === 'Inventário');
    if (hasInventory) advantages += Math.max(0, Number(c.inventoryLimits.level || 1) - 1);
    let disadvantages = 0;
    for (let e of c.entries.desvantagens) { if (e.counted !== true) continue; let x = CATALOG.desvantagens[e.index]; if (x) disadvantages += Math.abs(Number(x.points) || 0); }
    let kitsCount = (c.kits || []).reduce((sum, _, i) => sum + i + 1, 0);
    const archetype = selectedArchetype(c);
    const archetypeCost = archetype ? archetype.points : 0;
    let employed = attrs + skillsCount + specsCount + advantages + kitsCount + archetypeCost - disadvantages;
    let initial = Number(c.startPoints) || 10;
    let balance = initial - employed;
    return `<div class="card">
        <h3>⭐ Pontos de Personagem</h3>
        <div class="grid">
            <div><strong>${employed}</strong> pontos empregados</div>
            <div><strong>${initial}</strong> pontos iniciais</div>
            <div><strong>${disadvantages}</strong> créditos desvantagens</div>
            <div><strong>${balance}</strong> saldo livre de pontos</div>
        </div>
        <p class="muted">Custo: Atributos (${attrs}) + Perícias c/ Custa 1pt (${skillsCount}) + Especializações (${specsCount}) + Vantagens (${advantages}) + Arquétipo (${archetypeCost}) + Kits (${kitsCount}) − Desvantagens (${disadvantages}).</p>
    </div>`;
}

function freshVehicle(name = 'Novo veículo') {
    return freshChar(name, false);
}
function addVehicle() {
    const c = currentCharacter(); if (!c) return;
    ensureCatalog(c);
    const n = prompt('Nome:', 'Novo veículo ou companheiro');
    if (!n || !n.trim()) return;
    const v = freshVehicle(n.trim());
    v.isVehicle = true;
    delete v.vehicles;
    c.vehicles.push(v);
    save(); render();
}
function removeVehicle(i) {
    const c = currentCharacter(); if (!c) return;
    ensureCatalog(c);
    if (!confirm('Remover este veículo?')) return;
    c.vehicles.splice(i, 1);
    save(); render();
}
function openVehicle(ownerId, vId) {
    selectedVehicle = { ownerId, vId };
    activeSheetTab = 'principal';
    render();
}
function closeVehicle() {
    selectedVehicle = null;
    render();
}
function currentVehicle() {
    if (!selectedVehicle) return null;
    const owner = current()?.characters.find(x => x.id === selectedVehicle.ownerId);
    if (!owner) return null;
    ensureCatalog(owner);
    return owner.vehicles.find(v => v.id === selectedVehicle.vId) || null;
}
function updateVehicle(vId, key, value) {
    const v = currentVehicle(); if (!v) return;
    if (['p','h','r','xp'].includes(key)) v[key] = Math.max(0, Number(value) || 0);
    else v[key] = value;
    save(); render();
}
function renderVehiclesTab(c) {
    ensureCatalog(c);
    const cards = (c.vehicles || []).map((v, i) => `<article class="card">
        <h3>${esc(v.name)} <span class="pill">Subficha</span></h3>
        <p class="muted">P ${v.p} • H ${v.h} • R ${v.r}</p>
        <div class="row" style="margin-top:12px">
            <button onclick="openVehicle('${c.id}','${v.id}')">Abrir subficha</button>
            <button class="danger" onclick="removeVehicle(${i})">Excluir</button>
        </div>
    </article>`).join('');
    return `<div class="card"><h3>Subfichas <button onclick="addVehicle()">+ Adicionar subficha</button></h3>
        <div class="cards">${cards || '<p class="muted">Nenhuma subficha cadastrada.</p>'}</div>
    </div>`;
}
