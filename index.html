gem","description":"Em todos os testes de Animais, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Código Dahllan","description":"Você é vegano, nunca ataca um animal e não deixa de ajudar um animal em dificuldade."}]},{"name":"Elfo","points":1,"description":"Povo de aparência esguia, orelhas pontudas, traços delicados, talento para magia e vidas longas. Podem viver isolados ou integrados às cidades.","powers":[{"name":"Impecável","description":"Escolha uma vantagem entre Ágil, Carismático ou Gênio."},{"name":"Natureza Mística","description":"Em todos os testes de Mística, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Frágil","description":"Você recebe a desvantagem Frágil."}]},{"name":"Fada","points":1,"description":"Seres mágicos ligados à natureza, como dríades, sílfides, duendes, sátiros e ninfas. Podem ser diminutas ou ter tamanho humano, com asas, flores ou folhagens.","powers":[{"name":"Magia das Fadas","description":"Escolha Magia ou Ilusão. Você recebe a vantagem escolhida e sempre gasta –1PM ao usá-la (mínimo 1PM). Pode comprar a outra vantagem separadamente, sem desconto."},{"name":"Infame","description":"Você recebe a desvantagem Infame."},{"name":"Delicada","description":"Escolha Diferente (para uma fada pequenina) ou Frágil (para uma fada de tamanho normal)."}]},{"name":"Fantasma","points":2,"description":"Mortos-vivos imateriais, espíritos descarnados que permanecem no mundo por algum evento ou vínculo que os impediu de descansar. Podem se passar por vivos, exceto ao toque.","powers":[{"name":"Espírito","description":"Você está sempre imaterial, incapaz de causar ou receber dano, mas pode gastar PM para se tornar sólido durante uma cena. Também recebe Imune (Abiótico, Doenças) e Sem Vida (recupera PV apenas com descanso ou vantagens)."},{"name":"Paralisia","description":"Você recebe a vantagem Paralisia."},{"name":"Devoto","description":"Você recebe a desvantagem Devoto: está preso ao mundo por amor, raiva, vingança, promessa ou uma missão interminável."}]},{"name":"Goblin","points":1,"description":"Humanoides pequenos, de pele cinzenta e rugosa, orelhas longas e olhos brilhantes. São numerosos, engenhosos, curiosos e hiperativos, formando comunidades e corporações próprias.","powers":[{"name":"Espertalhão","description":"Sempre que testar Manha, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Subterrâneo","description":"Você recebe Sentido (Infravisão) e Ganho em testes de Resistência para evitar ou cancelar doenças e venenos, naturais ou mágicos."},{"name":"Diferente","description":"Você recebe a desvantagem Diferente."}]},{"name":"Hynne","points":1,"description":"Também conhecidos como halflings ou pequeninos, não ultrapassam 90cm. Muitos têm pés peludos e preferem andar descalços; apreciam vida tranquila, boa comida e hospitalidade.","powers":[{"name":"Atirador","description":"Gaste 2PM para ter Ganho em um teste para atacar Longe, em combate violento."},{"name":"Encantador","description":"Sempre que testar Influência, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Diferente","description":"Você recebe a desvantagem Diferente."}]},{"name":"Kallyanach","points":2,"description":"Meios-dragões, que podem nascer de descendência dracônica, energia elemental, maldições ou experimentos. Costumam apresentar garras, presas, cauda, escamas ou asas.","powers":[{"name":"Baforada","description":"Você recebe um Ataque Especial (Área, Distante ou Potente), que pode ser combinado com outros e sempre custa –1PM (mínimo 1PM)."},{"name":"Poder Dracônico","description":"Escolha Forte ou Carismático."},{"name":"Código dos Dragões","description":"Você nunca esquece e sempre cumpre uma promessa feita, seja por honra, gratidão, vingança ou orgulho."}]},{"name":"Kemono","points":1,"description":"Animais antropomórficos ou humanoides com traços animais, como orelhas, cauda, garras, presas, chifres ou pelagem. Em geral, vivem e agem como humanos.","powers":[{"name":"Percepção Apurada","description":"Sempre que testar Percepção, mesmo sem a perícia ou Sentido, o atributo correspondente recebe +1."},{"name":"Talento","description":"Escolha uma vantagem entre Ágil, Carismático, Forte, Gênio, Resoluto ou Vigoroso."},{"name":"Cacoete","description":"Escolha uma desvantagem entre Antipático, Atrapalhado, Fracote, Frágil, Indeciso ou Tapado."}]},{"name":"Medusa","points":1,"description":"Raça humanoide com serpentes no lugar dos cabelos. As medusas viajantes são geralmente civilizadas, sociáveis e comunicativas, e muitas gostam de redes sociais e produção de conteúdo.","powers":[{"name":"Carismático","description":"Você recebe a vantagem Carismático."},{"name":"Olhar Atordoante","description":"Gaste um movimento e 3PM para forçar uma criatura Perto a fazer um teste de Resistência oposto ao seu Poder. Se falhar, por uma rodada não pode fazer ações e sofre Perda em testes de defesa."},{"name":"Fracote","description":"Você recebe a desvantagem Fracote."}]},{"name":"Minotauro","points":1,"description":"Humanoides robustos com cabeças bovinas ou de animais aparentados. São orgulhosos, determinados e competitivos, frequentemente resolvendo disputas por desafios físicos.","powers":[{"name":"Atlético","description":"Sempre que testar Esporte, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Sentido Labiríntico","description":"Você sempre sabe o caminho de qualquer lugar em que já esteve e tem Ganho em testes de Percepção para farejar."},{"name":"Transtorno (Fobia)","description":"Você recebe Transtorno (Fobia): medo de altura; estar perto de uma queda de 3m ou mais ativa a desvantagem."}]},{"name":"Ogro","points":1,"description":"Humanoides imensos e brutais, de vários tipos. Alguns vivem nas Arcas, outros em cidades, atuam como mercenários ou seguem carreiras inesperadas.","powers":[{"name":"Destruidor","description":"Em combate violento, quando consegue um acerto crítico ao atacar um oponente Perto, pode pagar 2PM para somar seu Poder mais uma vez. Só uma vez por ataque."},{"name":"Intimidador","description":"Você sempre tem Ganho em testes de Influência para assustar, intimidar ou amedrontar alguém."},{"name":"Diferente","description":"Você recebe a desvantagem Diferente."}]},{"name":"Osteon","points":2,"description":"Esqueletos com inteligência e vontade própria. Diferem dos mortos-vivos sem mente que infestam as Arcas e demonstram consciência e civilidade.","powers":[{"name":"Imune","description":"Você recebe Imune (Abiótico, Doenças, Resiliente)."},{"name":"Memória Póstuma","description":"Escolha uma perícia. Sempre que testá-la, mesmo sem a perícia, o atributo correspondente recebe +1."},{"name":"Sem Vida","description":"Você recebe a desvantagem Sem Vida."}]},{"name":"Qareen","points":2,"description":"Seres mágicos, descendentes de mortais e criaturas arcanas, também conhecidos como meios-gênios. Suas tatuagens brilham quando usam poderes mágicos.","powers":[{"name":"Desejos","description":"Você recebe Magia. Quando lança uma magia pedida por outra pessoa desde seu último turno, o custo diminui em 2PM (mínimo 1PM). Fazer o pedido não gasta ações ou movimentos."},{"name":"Carismático","description":"Você recebe a vantagem Carismático."},{"name":"Código da Gratidão","description":"Você deve gratidão a quem lhe prestou um grande favor, adotando essa pessoa como amo até quitar a dívida. Pode ter mais de um amo."}]},{"name":"Sauroide","points":2,"description":"Seres-repteis que combinam traços humanos com lagartos, crocodilos, serpentes ou dinossauros. Podem ter escamas, caudas, cristas, garras e carapaças.","powers":[{"name":"Cascudo","description":"Você recebe as vantagens Resoluto e Vigoroso."},{"name":"Camuflagem","description":"Você sempre tem Ganho em testes para se esconder."},{"name":"Fraqueza (Frio)","description":"Você recebe a desvantagem Fraqueza (Frio)."}]},{"name":"Vampiro","points":1,"description":"Seres poderosos e imortais que precisam sugar a vida dos vivos. Podem surgir por magia, ciência, maldição, doença ou origem extraterrestre; nem todos são assassinos.","powers":[{"name":"Talento","description":"Escolha uma vantagem entre Ágil, Carismático, Forte, Gênio, Resoluto ou Vigoroso."},{"name":"Imortal","description":"Você recebe a vantagem Imortal."},{"name":"Fraqueza (Luz do Dia)","description":"Você recebe a desvantagem Fraqueza (luz do dia). Dependência é indicada apenas para NPCs vilões no texto do arquétipo, sem alterar seu custo."}]},{"name":"Nanomorfo","points":1,"powers":[{"name":"Aparência Moldável","description":"Você recebe Alcance 1. Além disso, pode gastar 2PM para ter Ganho em testes para ocultar sua real natureza."},{"name":"Fluido Não Newtoniano","description":"Você pode gastar uma ação e 2PM para reorganizar livremente os pontos de seus atributos, como na vantagem Transformação, mas apenas para atributos. A mudança não restaura recursos; altera os valores máximos conforme os atributos mudam."},{"name":"Sem Vida MESMO","description":"Você recebe Sem Vida, mas não pode ser consertado de jeito nenhum. Contudo, recebe Regeneração 1, que funciona normalmente, exceto sob dano contínuo."}],"description":"Nanorrobôs já eram utilizados com frequência em ciborgues, armaduras e outras máquinas. Mas construtos inteiros fabricados assim — até onde se sabe — são raros. Por mudar facilmente de forma, nanomorfos podem assumir a aparência de qualquer pessoa ou objeto que desejarem. Também podem mudar a voz e imitar outras características do alvo, mas não copiar memórias ou poderes únicos."},{"name":"Magia Viva","points":1,"powers":[{"name":"Fluxo de Mana","description":"No início de seu turno, você sempre recupera 2PM."},{"name":"Magia Pura","description":"Uma vez por cena, pode assumir sua forma arcana essencial por 1D turnos. Nessa forma, recebe Atributo +2 em todos os testes de Mística. Além disso, todos os testes de Percepção contra você sofrem Perda."},{"name":"Sem Vida","description":"Você é uma magia viva e não possui vida biológica."}],"description":"Às vezes, a magia sai do controle. Literalmente. Um feitiço mal-entendido, um acidente tecnomágico, uma adivinhação feita em borras de café vencido, e pronto: uma magia ganha vida própria. Algumas são faíscas falantes; outras, vultos que flutuam e tagarelam em arcano antigo. Há aquelas que assumem formas humanoides, com olhos de energia, corpo instável e alma recém-desperta. A Magia Viva não tem passado, família ou RG. Por isso, algumas se juntam a grupos Arcanautas, tentando entender o mundo, suas emoções e o próprio propósito."},{"name":"Perpétuo","points":1,"powers":[{"name":"Meio-Espírito","description":"Como o guerreiro perpétuo."},{"name":"Devoto","description":"Você está sempre procurando briga — ou alguma outra coisa, à sua escolha. De preferência algo que acaba em briga."},{"name":"Sem Vida","description":"Você pode dizer que morreu de tanto esperar por uma boa peleja."}],"description":"Nem todo guerreiro perpétuo acaba como algum inimigo aleatório nas Arcas. Ser amaldiçoado por um deus da guerra além-Convergência (ou agraciado, dependendo do ponto de vista) não precisa ser o fim. Mas nem sempre é fácil se adaptar aos protocolos de convivência dos vivos. Alguns passam o dia todo na porta do supermercado, bloqueando a saída com sua presença imponente e silêncio constrangedor. Outros são contratados como seguranças, mas recusam-se a revistar mochilas — em vez disso, duelam com aqueles que mostram “má postura de combate”."},{"name":"Kobolds","points":2,"powers":[{"name":"Diferente","description":"Para você, esta desvantagem é uma vantagem! Você tem todos os seus potenciais benefícios (esconder-se, passar por lugares apertados, usar roupas ou itens de qualquer tamanho…) e nenhum de seus problemas, pois sempre pode mudar para uma formação adequada."},{"name":"Escapuliu","description":"Qualquer manobra de combate tentada contra você sofre Perda."},{"name":"Mini-Horda","description":"Você pode gastar 3PM para se amontoar em um único alvo e ter Ganho em ataques e defesas contra ele por um turno."},{"name":"Inculto","description":"Mesmo agindo em grupo, vocês ainda não são exatamente mestres da comunicação."}],"description":"Kobolds não são indivíduos, são pragas — nenhum kobold sozinho consegue executar uma tarefa mais complicada que chupar o dedo. Juntos, no entanto, somam suas cabeças e atuam como seres inteligentes, embora bagunceiros. Amontoam-se uns nos outros, vestem sobretudos e fingem ser membros produtivos da sociedade. Aquele sujeito de chapéu na loja de conveniências, pegando montes de salgadinhos na prateleira com sete bracinhos, tem grandes chances de ser um bando kobold."},{"name":"Meio-Metaliano","points":2,"powers":[{"name":"Vantagens Metalianas","description":"Escolha duas vantagens entre Defesa Especial (Reflexão), Forte, Imune (abiótico) e Vigoroso, sem custo. Se quiser, você pode comprar as outras duas vantagens por 1 ponto."},{"name":"Hidrofóbico","description":"Você tem Fraqueza (água)."}],"description":"Por motivos de vai saber, agências e corporações conduzem experimentos para alterar humanos geneticamente, transformando-os em alguma coisa parecida com um metaliano. O resultado é alguém muito forte, resistente, e talvez rancoroso por ser intoxicado com metais pesados e quase morto. Ganham olhos de cor metálica, cabelos brancos e músculos literalmente duros como aço. Alguns meio-metalianos se tornam superagentes ou armas vivas para seus criadores; outros se revoltam e acabam como fugitivos."},{"name":"Unagi","points":2,"powers":[{"name":"Vantagens Unagi","description":"Você recebe duas vantagens entre Paralisia, Telepata e Voo ou Ilusão. Você sempre gasta –1PM ao usar estas vantagens (no mínimo 1PM), mesmo que as compre depois."},{"name":"Diferente","description":"Sem sua armadura, você é pequeno como um gato e não pode realizar ações que exigem o uso das mãos ou dos pés."},{"name":"Unagikai","description":"Você pode invocar ou dispensar sua armadura mecha com uma ação. A armadura oferece a vantagem Forte e permite realizar ações normalmente. Você pode usar suas vantagens unagi em armadura, mas fica imóvel e indefeso até seu próximo turno."}],"description":"O contato com culturas menos desaforadas, não raras vezes, leva indivíduos unagi a questionar os métodos de sua civilização — e a safadeza que causam a outros povos. Estes “desajustados” podem acabar exilados, condenados a encarceramento perpétuo, ou até executados. Assim, alguns concluem que escapar com sua vida (e uma unidade unagikai) é opção bem melhor! Um pária unagi pode escolher lutar para proteger este mundo contra sua própria gente e outros aliens, buscar ser aceito aqui ou usar suas habilidades para integrar algum grupo Arcanauta."},
{"name":"Mascote Falante","points":2,"description":"Algumas equipes têm tanques. Outras contam com magos que dobram a realidade no horário do almoço. Bom, a sua tem uma coisinha fofa: um serzinho peludo, brilhante, gosmento, levemente radioativo ou inexplicavelmente adorável demais para morrer! Pode ser um bichinho mágico, uma criatura perdida de outro mundo, um espírito guardião com horário flexível ou — acredite — alguém que espontaneamente decidiu ser mascote oficial do grupo (acontece mais do que você imagina). O Mascote Falante não luta (nem tenta). Compensa isso com comentários incisivos, discursos motivadores e apelo emocional. Seu papel é inspirar, distrair, irritar antagonistas e vender produtos licenciados. Ele conversa com monstros, faz poses que nunca funcionam na vida real e surge em toda arte promocional — mesmo quando nem é chamado. Sem ele, o grupo vence. Com ele, vira franquia.","powers":[{"name":"Fofurice Extrema","description":"Você recebe Inofensivo, Carismático e consegue conversar com qualquer ser: animais, plantas, portas trancadas, máquinas vampíricas, entidades cósmicas, gelatinas famintas… Elas quase nunca respondem algo útil, mas você consegue conversar, o que já é um talento. Por outro lado, recebe Diferente e um Ponto Fraco (geralmente barriga, comida favorita ou autoestima)."},{"name":"Inspiração Mascótica","description":"Gaste uma ação completa e 2PM para inspirar um aliado até Longe. Ele recebe +1 em um atributo (não afeta recursos). Se estiver perto da derrota, recebe atributo +2. Você afeta apenas um aliado por vez, mas pode incluir outros pagando 1PA por cada alvo extra (sem custo adicional em PM). O efeito dura até seu próximo turno."},{"name":"Impacto Emocional","description":"Você sempre tem Ganho em testes de morte. Porém, chegando a 0PV, todo o grupo sofre Perda em todos os testes até você recuperar 1PV ou a cena acabar."}]},
{"name":"Semideus","points":2,"description":"Você é fruto da relação entre um ser divino e um mortal. De um deles, recebeu habilidades físicas ou mentais muito acima de um humano comum. Do outro... bem, aquela dor na lombar que surgiu sozinha quando você fez trinta anos também conta como herança, certo? Em um primeiro momento, ser filho de um deus (ou deusa) pode parecer ótimo negócio. Você é forte, carismático, inteligente. É também um jeito ótimo de entrar em clubes e festas. Mas isso vem com um preço. Ter sangue divino é ter um destino a cumprir — e você nunca consegue escapar dele. Pode se isolar da civilização, viver entre animais selvagens, fugir para uma caverna ou topo de montanha... Não importa. Sua família sempre o encontrará. E uma tia divina tem coisas muito piores para perguntar que “e as namoradinhas?”","powers":[{"name":"Herança divina","description":"Você recebe uma vantagem entre Ágil, Carismático, Forte, Gênio, Resoluto ou Vigoroso."},{"name":"Esforço divino","description":"Quando utiliza a vantagem da sua herança divina, você pode gastar 5PM para aumentar essa ação em uma escala. Uma vez por sessão, em um surto súbito de energia divina, você pode aumentar a ação em duas escalas (por exemplo, de Sugoi para Kami)."},{"name":"Destino inescapável","description":"Sua família divina nunca o deixa em paz! No início de cada cena, role 1D: com resultado 1, 2 ou 3, a cena começa com um karma contra você, que o mestre deve usar até o fim da cena. Quando usado, você pode ouvir ao fundo a risada sarcástica do deus que rogou a praga!"}]}
];

function initializeCharacterExtras(c) {
    if (c.archetypeNew === undefined) c.archetypeNew = '';
    if (!c.inventoryLimits) {
        const hasInventory = (c.entries?.vantagens || []).some(entry => CATALOG.vantagens[entry.index]?.name === 'Inventário');
        const previousInventory = Object.entries(c).find(([key]) => key.startsWith('v') && key.endsWith('Inventory'))?.[1];
        const legacyLevel = Number(previousInventory?.level) || 0;
        const level = hasInventory ? Math.max(1, Math.min(3, legacyLevel || 1)) : 0;
        const capacity = inventoryCapacity(level);
        const legacyItems = Array.isArray(previousInventory?.items) ? previousInventory.items : [];
        const remaining = { ...capacity };
        if (legacyItems.length) {
            for (const rarity of ITEM_RARITIES) {
                const available = legacyItems.filter(item => item.rarity === rarity && !item.used).length;
                remaining[rarity] = Math.min(capacity[rarity], available);
            }
        }
        c.inventoryLimits = { level, remaining };
    }
    if (!c.inventoryLimits.remaining) c.inventoryLimits.remaining = { ...inventoryCapacity(Number(c.inventoryLimits.level) || 0) };
    return c.inventoryLimits;
}

function selectedArchetype(c) {
    return ARCHETYPES.find(a => a.name === c.archetypeNew) || null;
}

function archetypeInfoByIndex(name, powerIndex, sendToChat) {
    const archetype = ARCHETYPES.find(a => a.name === name);
    if (!archetype) return;
    const item = powerIndex < 0 ? { name: archetype.name, description: archetype.description } : archetype.powers[powerIndex];
    if (!item) return;
    const details = `Arquétipo: ${archetype.name}\nCusto: ${archetype.points} ponto(s)\n\n${item.name}\n${item.description}`;
    if (sendToChat) infoChat(`${archetype.name} — ${item.name}`, details);
    else alert(details);
}

function archetypePanel(c) {
    initializeCharacterExtras(c);
    const archetype = selectedArchetype(c);
    return `<section class="card" id="archetypePanel">
        <h3>Arquétipo</h3>
        <p class="muted">Selecione um único arquétipo. O custo é descontado dos pontos de personagem. Os poderes e fraquezas listados compõem o pacote do arquétipo e não são comprados separadamente.</p>
        <div class="field"><label>Selecionar arquétipo</label><select onchange="setArchetype(this.value)">
            <option value="">Nenhum arquétipo</option>
            ${ARCHETYPES.map(a => `<option value="${esc(a.name)}" ${c.archetypeNew === a.name ? 'selected' : ''}>${esc(a.name)} — ${a.points} pt</option>`).join('')}
        </select></div>
        ${archetype ? `<div class="row" style="justify-content:space-between"><strong>${esc(archetype.name)} • ${archetype.points} ponto(s)</strong><span>
            <button type="button" onclick="archetypeInfoByIndex('${esc(archetype.name)}',-1,false)">🔍</button>
            <button type="button" onclick="archetypeInfoByIndex('${esc(archetype.name)}',-1,true)">i</button>
        </span></div>
        <p style="white-space:pre-wrap">${esc(archetype.description)}</p>
        <h4>Habilidades do arquétipo</h4>
        ${archetype.powers.map((power,index) => `<div class="kit-power"><div class="kit-power-head"><strong>${esc(power.name)}</strong><div>
            <button type="button" onclick="archetypeInfoByIndex('${esc(archetype.name)}',${index},false)">🔍</button>
            <button type="button" onclick="archetypeInfoByIndex('${esc(archetype.name)}',${index},true)">i</button>
        </div></div><p>${esc(power.description)}</p></div>`).join('')}` : '<p class="muted">Nenhum arquétipo selecionado.</p>'}
    </section>`;
}

function characterPointBalance(c) {
    ensureCatalog(c);
    initializeCharacterExtras(c);
    const attributes = (Number(c.p) || 0) + (Number(c.h) || 0) + (Number(c.r) || 0);
    const skills = (c.skills || []).filter(skill => skill && c.skillCosts[skill] === true).length;
    const specs = (c.specializations || []).filter(spec => spec && c.specializationCosts[spec] === true).length;
    let advantages = 0;
    for (const entry of c.entries.vantagens) { if (entry.counted !== true) continue; const item = CATALOG.vantagens[entry.index]; if (item) advantages += Number(item.points) || 0; }
    const hasInventory = c.entries.vantagens.some(entry => entry.counted === true && CATALOG.vantagens[entry.index]?.name === 'Inventário');
    if (hasInventory) advantages += Math.max(0, Number(c.inventoryLimits.level || 1) - 1);
    const disadvantages = c.entries.desvantagens.reduce((sum, entry) => sum + (entry.counted === true && CATALOG.desvantagens[entry.index] ? Math.abs(Number(CATALOG.desvantagens[entry.index].points) || 0) : 0), 0);
    const kits = (c.kits || []).reduce((sum, _, index) => sum + index + 1, 0);
    const archetype = selectedArchetype(c);
    return (Number(c.startPoints) || 10) - (attributes + skills + specs + advantages + kits + (archetype ? archetype.points : 0) - disadvantages);
}

function setArchetype(name) {
    const c = currentCharacter();
    if (!c) return;
    const next = ARCHETYPES.find(a => a.name === name) || null;
    const previous = selectedArchetype(c);
    const extraCost = (next ? next.points : 0) - (previous ? previous.points : 0);
    if (extraCost > 0 && characterPointBalance(c) < extraCost) return alert('Pontos de personagem insuficientes para este arquétipo.');
    c.archetypeNew = next ? next.name : '';
    save(); render();
}

// --- INVENTÁRIO E LIMITES DE CONSUMÍVEIS ---
const ITEM_RARITIES = ['comum', 'incomum', 'raro'];
function inventoryCapacity(level) {
    return [
        { comum: 2, incomum: 0, raro: 0 },
        { comum: 3, incomum: 1, raro: 0 },
        { comum: 5, incomum: 2, raro: 0 },
        { comum: 5, incomum: 4, raro: 1 }
    ][level] || { comum: 2, incomum: 0, raro: 0 };
}
function inventoryLevel(c) {
    initializeCharacterExtras(c);
    const hasInventory = c.entries.vantagens.some(entry => CATALOG.vantagens[entry.index]?.name === 'Inventário');
    if (!hasInventory) return 0;
    if (!(Number(c.inventoryLimits.level) > 0)) {
        c.inventoryLimits.level = 1;
        c.inventoryLimits.remaining = { ...inventoryCapacity(1) };
    }
    return Math.max(1, Math.min(3, Number(c.inventoryLimits.level) || 1));
}
function setInventoryLevel(value) {
    const c = currentCharacter();
    if (!c) return;
    const hasInventory = c.entries.vantagens.some(entry => CATALOG.vantagens[entry.index]?.name === 'Inventário');
    if (!hasInventory) return alert('Adicione a vantagem Inventário na Ficha Principal antes de definir seu nível.');
    const nextLevel = Math.max(1, Math.min(3, Number(value) || 1));
    const oldLevel = inventoryLevel(c);
    if (nextLevel > oldLevel && characterPointBalance(c) < nextLevel - oldLevel) return alert('Pontos de personagem insuficientes para aumentar o Inventário.');
    const oldCapacity = inventoryCapacity(oldLevel);
    const nextCapacity = inventoryCapacity(nextLevel);
    for (const rarity of ITEM_RARITIES) {
        const consumed = Math.max(0, oldCapacity[rarity] - (Number(c.inventoryLimits.remaining[rarity]) || 0));
        c.inventoryLimits.remaining[rarity] = Math.max(0, nextCapacity[rarity] - consumed);
    }
    c.inventoryLimits.level = nextLevel;
    ensureCatalog(c);
    for (const rarity of ITEM_RARITIES) {
        const cap = nextCapacity[rarity] || 0;
        const slots = Array.isArray(c.inventoryItems[rarity]) ? c.inventoryItems[rarity] : [];
        c.inventoryItems[rarity] = slots.slice(0, cap);
    }
    save(); render();
}
function inventorySlots(c, rarity) {
    ensureCatalog(c);
    if (!Array.isArray(c.inventoryItems[rarity])) c.inventoryItems[rarity] = [];
    return c.inventoryItems[rarity];
}
function inventoryBaseCapacity(c) {
    const level = inventoryLevel(c);
    return inventoryCapacity(level);
}
function inventoryEffectiveCapacity(c, rarity) {
    return Number(inventoryBaseCapacity(c)[rarity]) || 0;
}
function inventoryCapacityFor(c, rarity) {
    return inventoryEffectiveCapacity(c, rarity);
}
function addInventorySlot(rarity) {
    const c = currentCharacter(); if (!c) return;
    ensureCatalog(c);
    if (!ITEM_RARITIES.includes(rarity)) return;
    const cap = inventoryEffectiveCapacity(c, rarity);
    const slots = inventorySlots(c, rarity);
    if (slots.length >= cap) return alert(`Limite atingido: ${rarity} permite ${cap} item(ns) no nível atual.`);
    slots.push({ index: null });
    save(); render();
}
function removeInventorySlot(rarity, i) {
    const c = currentCharacter(); if (!c) return;
    ensureCatalog(c);
    inventorySlots(c, rarity).splice(i, 1);
    save(); render();
}
function setInventorySlot(rarity, i, value) {
    const c = currentCharacter(); if (!c) return;
    ensureCatalog(c);
    const slots = inventorySlots(c, rarity);
    if (!slots[i]) return;
    slots[i].index = value === '' ? null : Number(value);
    save(); render();
}
function inventoryItemData(rarity, entry) {
    if (!entry || entry.index === null) return null;
    return (INVENTORY_ITEMS[rarity] || [])[entry.index] || null;
}
function showInventoryItem(rarity, i) {
    const c = currentCharacter(); if (!c) return;
    const item = inventoryItemData(rarity, inventorySlots(c, rarity)[i]);
    if (!item) return alert('Selecione um item primeiro.');
    alert(`${item.name}\n\n${item.description || ''}`);
}
function announceInventoryItem(rarity, i) {
    const c = currentCharacter(); if (!c) return;
    const item = inventoryItemData(rarity, inventorySlots(c, rarity)[i]);
    if (!item) return alert('Selecione um item primeiro.');
    logMessage(`ℹ ${c.name} — Inventário (${rarity}): ${item.name}\n${item.description || ''}`);
}
function inventoryLimitsPanel(c) {
    initializeCharacterExtras(c);
    ensureCatalog(c);
    const level = inventoryLevel(c);
    const base = inventoryBaseCapacity(c);
    const hasInventory = c.entries.vantagens.some(entry => CATALOG.vantagens[entry.index]?.name === 'Inventário');
    return `<section class="card"><h3>Consumíveis — limite por raridade</h3>
        <p class="muted">Sem a vantagem Inventário, você ainda pode carregar 2 itens comuns. Com a vantagem: Pequeno (1 ponto) permite 3 comuns e 1 incomum; Grande (2 pontos), 5 comuns e 2 incomuns; Supremo (3 pontos), 5 comuns, 4 incomuns e 1 raro.</p>
        ${hasInventory ? `<div class="field"><label>Nível da vantagem Inventário</label><select onchange="setInventoryLevel(this.value)">
            <option value="1" ${level === 1 ? 'selected' : ''}>Pequeno — 1 ponto</option>
            <option value="2" ${level === 2 ? 'selected' : ''}>Grande — 2 pontos</option>
            <option value="3" ${level === 3 ? 'selected' : ''}>Supremo — 3 pontos</option>
        </select></div>` : '<p class="notice">A vantagem Inventário não foi selecionada. O limite atual é de 2 itens comuns.</p>'}
        ${ITEM_RARITIES.map(rarity => {
            const cap = inventoryEffectiveCapacity(c, rarity);
            if (cap <= 0) return '';
            const slots = inventorySlots(c, rarity);
            const list = INVENTORY_ITEMS[rarity] || [];
            const rows = slots.map((entry, i) => {
                const data = inventoryItemData(rarity, entry);
                return `<div class="catalogrow">
                    <select onchange="setInventorySlot('${rarity}',${i},this.value)"><option value="">Selecione...</option>
                    ${list.map((it, j) => `<option value="${j}" ${entry.index === j ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}
                    </select>
                    <button type="button" title="Descrição" ${data ? '' : 'disabled'} onclick="showInventoryItem('${rarity}',${i})">🔍</button>
                    <button type="button" title="Informar no chat" ${data ? '' : 'disabled'} onclick="announceInventoryItem('${rarity}',${i})">i</button>
                    <button type="button" class="danger" title="Remover" onclick="removeInventorySlot('${rarity}',${i})">×</button>
                </div>`;
            }).join('');
            return `<div class="field" style="margin-top:12px"><label>${rarity[0].toUpperCase()+rarity.slice(1)} (${slots.length}/${cap})</label>
                ${rows || '<p class="mini muted">Nenhum item adicionado.</p>'}
                <button type="button" ${slots.length >= cap ? 'disabled' : ''} onclick="addInventorySlot('${rarity}')">+ Adicionar item ${rarity}</button></div>`;
        }).join('')}
    </section>`;
}

async function createTableAsMaster() {
    const pin = document.getElementById('pinInput').value.trim();
    const nome = document.getElementById('nomeInput').value.trim();
    if (!/^\d{6}$/.test(pin)) return document.getElementById('loginError').textContent = 'PIN de 6 dígitos obrigatório.';
    if (!nome) return document.getElementById('loginError').textContent = 'Informe seu nome.';

    const { data: existente } = await supabaseClient.from('mesas').select('pin').eq('pin', pin).maybeSingle();
    if (existente) return document.getElementById('loginError').textContent = 'PIN já em uso. Escolha outro.';

    const { error } = await supabaseClient.from('mesas').insert({
        pin, nome: 'Campanha ' + pin, mestre_nome: nome
    });
    if (error) return document.getElementById('loginError').textContent = 'Erro: ' + error.message;

    session = { role: 'mestre', name: nome, mesaPin: pin };
    db.selected = pin;
    await carregarMesas();
    await carregarPersonagens(pin);
    await carregarChat(pin);
    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('appPanel').classList.remove('hidden');
    render();
}

async function loginAsPlayer() {
    const pin = document.getElementById('pinInput').value.trim();
    const nome = document.getElementById('nomeInput').value.trim();
    const codigo = document.getElementById('codigoPersonagemInput').value.trim();
    if (!/^\d{6}$/.test(pin)) return document.getElementById('loginError').textContent = 'PIN da mesa inválido.';
    if (!nome) return document.getElementById('loginError').textContent = 'Informe seu nome.';
    if (!/^\d{6}$/.test(codigo)) return document.getElementById('loginError').textContent = 'Código do personagem inválido.';

    const { data, error } = await supabaseClient
        .from('personagens')
        .select('id, nome, codigo, is_npc, ficha')
        .eq('mesa_pin', pin).eq('codigo', codigo).maybeSingle();
    if (error || !data) return document.getElementById('loginError').textContent = 'Código não encontrado nesta mesa.';

    session = { role: 'jogador', name: nome, mesaPin: pin, personagemId: data.id, personagemCodigo: codigo };
    db.selected = pin;
    selectedChar = data.id;
    tab = 'ficha';
    await carregarMesas();
    await carregarPersonagens(pin);
    await carregarChat(pin);
    // Presença do jogador
    try {
        await supabaseClient.from('personagens')
            .update({ ultima_atualizacao: new Date().toISOString() })
            .eq('id', data.id);
    } catch (_) {}
    iniciarHeartbeat();
    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('appPanel').classList.remove('hidden');
    render();
}

function logout() {
    // Tenta marcar offline antes de sair
    if (session?.role === 'jogador' && session.personagemId) {
        try {
            supabaseClient.from('personagens')
                .update({ ultima_atualizacao: new Date(0).toISOString() })
                .eq('id', session.personagemId);
        } catch (_) {}
    }
    pararHeartbeat();
    _pararChatRealtime();
    _ultimoEstadoSalvo.clear();
    _logsPendentes = [];
    session = null; selectedChar = null; selectedVehicle = null;
    db.selected = null;
    document.getElementById('appPanel').classList.add('hidden');
    document.getElementById('loginPanel').classList.remove('hidden');
    document.getElementById('loginError').textContent = '';
}

const CATALOG_DATA = {"catalog":{"vantagens":[{"name":"Aceleração","cost":"1pt","points":1,"description":"Você se move muito rápido. Pode gastar 1PM para realizar um movimento extra em seu turno.\nVocê também pode gastar 1PM antes de rolar os dados para receber\num Ganho na iniciativa, ou em testes de Habilidade para correr, fugir ou\nperseguir um oponente.","page":45},{"name":"Ágil","cost":"1pt","points":1,"description":"Você tem grande agilidade e coordenação motora. Recebe H+2 em testes envolvendo agilidade, coordenação ou equilíbrio, incluindo testes de\niniciativa. Este bônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para\nconseguir acerto crítico com 5 ou 6.","page":46},{"name":"Forte","cost":"1pt","points":1,"description":"Você é muito forte. Recebe P+2 em testes para empreender esforço físico, como levantar peso, derrubar porta ou socar vilão. Este bônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para\nconseguir acerto crítico com 5 ou 6.","page":54},{"name":"Gênio","cost":"1pt","points":1,"description":"Você tem um cérebro notável. Recebe H+2 em testes para resolver problemas que envolvem conhecimento, inteligência e capacidade de raciocínio. Este bônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para conseguir acerto crítico com 5 ou 6.","page":54},{"name":"Magia","cost":"2pt","points":2,"description":"Você faz mágica. Pode manipular energias místicas e controlar os elementos para criar efeitos sobrenaturais. Mágica!\nGastando 1PM, você soma +1 em qualquer teste. Com 3PM, por exemplo, você soma +3 em seu ataque disparando uma bola de fogo. Ou conjura\num escudo de ar que aumenta sua defesa.\nVocê também pode gastar PM e usar uma ação para conceder esse\nbônus a um aliado que possa alcançar. Por exemplo, imbuindo a espada de\num aliado com uma aura mágica que a torna mais afiada.\nNote que, como outras vantagens, Magia pode ter efeitos físicos ou\nmentais/sociais. Uma mágica pode ser uma marreta gigante esmagadora,\nou um encanto que influencia pessoas. Também pode melhorar testes não\ncombativos, digamos, gastando 3PM para criar uma corda de escalar e ajudar em um teste de Esportes (que agora recebe +3).\nO bônus máximo que você pode gerar é igual à sua Habilidade. Quando\nataca ou defende com Magia, você pode usar a perícia Mística em vez de\nLuta (mas ainda pode usar Luta se preferir). Você também pode fazer testes\nde Mística sem gastar PM para efeitos mágicos menores, como iluminar\numa sala, limpar uma mesa ou aquecer comida (mas nada que dê bônus).","page":60},{"name":"Voo","cost":"1pt","points":1,"description":"Você pode voar! Ao usar um movimento para ficar Longe ou mais distante pelo ar, apenas personagens que também possam voar poderão usar\nmovimentos para alcançá-lo. Além disso, você ignora certas restrições causadas por terrenos difíceis.\nEm combate, levantar voo quando você está no chão usa um movimento e gasta 2PM. Você não precisa gastar mais PM para manter-se no ar, mas\ngasta se quiser levantar voo novamente após pousar (ou cair) por qualquer\nmotivo. Voar por muito tempo está sujeito a cansaço (veja em +Regras).","page":65},{"name":"+Ação","cost":"1pt cada","points":1,"description":"Você tem mais Pontos de Ação, além daqueles oferecidos por seu Poder.\nCada vez que compra esta vantagem você recebe +2PA. Então, se tem\nP3 (3PA) e paga 1 ponto por +Ação, agora tem 5PA.\nVocê pode comprar esta vantagem várias vezes, para novos aumentos\nde +2PA.","page":45},{"name":"Acumulador","cost":"1pt","points":1,"description":"Você junta tranqueiras em casa. Mentira. Quanto mais seus ataques\nacertam, mais forte você bate ou argumenta.\n\nSempre que você acerta um ataque (ou seja, quando causa dano), pode\ngastar 2PM para ganhar Poder +1 no ataque seguinte. Se acertar de novo,\npode gastar 2PM de novo para P+2. E assim por diante, até um máximo de\nP+5 (sempre 2PM por ataque).\nOs ataques podem ser contra o mesmo alvo ou alvos diferentes. Se você\nerra um ataque, ou por algum motivo deixa de atacar (fazendo qualquer\ncoisa que não causa dano), os bônus acabam.","page":45},{"name":"Ajudante","cost":"1pt cada","points":1,"description":"Você tem algo ou alguém com quem pode contar, seja em combate ou\noutras situações.\nO ajudante pode ser uma pessoa — aprendiz, mercenário, clérigo, enfermeiro, mecânico... Ou algum animal — bicho de estimação, de caça, montaria. Ou um monstro, alien, robô, veículo, objeto encantado... Qualquer coisa\nque combine com as habilidades que ele oferece. Assim, um ajudante Lutador pode ser uma espada mágica inteligente que surge em suas mãos, uma  \nfadinha apaixonada que torce por sua vitória, ou algum justiceiro misterioso\nque presta ajuda e vai embora dizendo “meu trabalho aqui acabou”.\nUma vez por rodada, você pode gastar 2PM para invocar o ajudante. O\ntipo de ajuda depende de sua função:\n• Curandeiro. Cura 2D PV em você ou outro personagem Perto, ou permite\nrepetir um teste de Resistência contra algum efeito negativo (paralisia,\nveneno, doença, tristeza...) após ter falhado.\n• Especialista. Escolha uma perícia. Ganho em um teste com esta perícia,\nexceto para defender ou atacar.\n• Familiar. Este ajudante sobrenatural gasta 1PM para ser invocado (em\nvez de 2) e diminui à metade o custo em PM para usar outra vantagem\nna rodada.\n• Lutador. Ganho em um teste de ataque, ou em testes de defesa por uma\nrodada.\n• Montaria. Concede um movimento extra, ou um Ganho em um teste de\niniciativa ou para correr ou perseguir um oponente. Custa 1PM.\nVocê pode comprar esta vantagem mais vezes para ter outros ajudantes\ndiferentes (ou um mesmo ajudante com diferentes funções). Contudo, em\nambos os casos, você pode receber apenas uma ajuda por rodada.","page":46},{"name":"Alcance","cost":"1-2pt","points":1,"description":"Seus ataques acertam mais longe. Vale para todos os tipos de ataque,\ncomo atirar, jogar coisas, esticar, gritar mais alto...\n1pt Você pode atingir inimigos que estejam Longe sem penalidades, e\nMuito Longe com uma Perda.\n2pt Você também pode atingir Muito Longe sem penalidades.\nO Alcance também afeta suas outras vantagens. Você pode usar sua\nCura em aliados distantes, ou Magia em alvos afastados. Sem Alcance, a\nmenos que uma vantagem diga o contrário, você só pode usá-la contra alvos\nque estejam Perto.","page":47},{"name":"Anulação","cost":"2pt","points":2,"description":"Você consegue impedir o alvo de usar um de seus poderes.\nApós o uso de uma vantagem em sua presença (Longe ou menos), você\npode tentar usar uma ação e 3PM para tentar anular essa vantagem. O alvo faz\num teste de R (9 + Poder do anulador) para tentar evitar. Se falhar, não pode\nmais usar essa vantagem até o fim da cena, cancelar o efeito ou ser derrotado.\nVocê também pode anular uma vantagem se souber, com antecedência, que o alvo a tem. Você pode já ter visto ele usar, ou descobrir por ser\nTelepata, ou já saber disso porque ele é Famoso ou Infame, ou com um\nteste de perícia (Saber, Manha, Percepção, 12).\nA cada turno após o primeiro, o alvo pode fazer um teste de R (9 + Poder do anulador) para cancelar o efeito.\nApenas uma vantagem pode ser anulada por vez. Se você quiser anular\noutra vantagem, a primeira será liberada.","page":48},{"name":"Arena","cost":"1pt cada","points":1,"description":"Você se dá melhor em um certo tipo de terreno. Quando está nesse\nlugar, pode gastar 2PM para ter Ganho em um teste.\nA Arena é escolhida pelo jogador, mas sempre com aprovação do mestre. Algumas sugestões são:\n• Água (praia, barcos, chuva, superfície da água, embaixo d’água)\n• Céu (em testes contra oponentes, só vale se ele também está voando)\n• Cidades (ruas, telhados, topo de prédio, aposentos, corredores, escadas)\n• Ermos (desertos, florestas, montanhas, pântanos, geleiras...)\n• Subterrâneo (cavernas, arcas, esgotos)\n• Uma categoria de lugares específicos (bares, hospitais, bibliotecas,\nshoppings...)\n• Um único lugar no mundo (provavelmente sua base de operações) e\nvizinhanças.\nArtefato 1pt ou mais\nVocê possui um item especial, único. Apenas você pode utilizá-lo. Pode\nser uma espada mágica, arma de raios experimental ou armadura robótica,\nà sua escolha.\nDiferente de algum equipamento comum, que não afeta as regras, seu\nartefato oferece benefícios de jogo. Cada ponto ao comprar esta vantagem\nvale 10XP para adquirir uma arma, armadura ou acessório (mas não um\nveículo) como descrito em Recompensas.","page":48},{"name":"Ataque Especial","cost":"1pt cada","points":1,"description":"Ao fazer um ataque, você pode gastar energia para ativar alguma arma\nou técnica superior. Cada efeito tem seu custo em PM:\n• Área. Todos os personagens Perto do alvo também recebem o ataque. 3PM.\n• Choque. Reforçando o ataque com sua resolução, você ataca usando Resistência em vez de Poder. Qualquer bônus ou penalidade que afetaria\nseu Poder passa a afetar a Resistência. 1PM.\n• Distante. Você pode atingir um passo de distância além. Este ataque é cumulativo com a vantagem Alcance (pode atingir até Fora de Alcance!). 1PM.\n• Espiritual. O alvo perde PM em vez de PV com este ataque. 1PM.\n• Investida. Quando ataca um alvo Longe ou mais distante, você também se\nmove até o alvo com a mesma ação. Você não usa um movimento, mas\nprecisa ser capaz de alcançar esse alvo com um movimento. 1PM.\n• Múltiplo. Você atinge mais alvos que estejam ao alcance. 1PM por alvo extra, até um máximo igual à Habilidade. Cada alvo faz um teste de defesa\nseparado, mas você usa o mesmo teste de ataque para todos. Vale apenas para vários alvos: para atacar o mesmo alvo várias vezes, use Potente\npara representar o dano dos ataques extras.\n• Penetrante. O alvo tem Perda de defesa. 2PM.\n• Perigoso. O ataque causa um acerto crítico com 5 ou 6. 1PM.\n• Poderoso. Quando consegue um crítico no ataque, você pode gastar 2PM\npara somar o Poder mais uma vez.\n• Potente. Aumenta o Poder do ataque em P+2. Você pode comprar este efeito\nmais vezes (por exemplo, 3pt por um Ataque Especial que gasta 3PM e ataca com P+6). 1PM para cada P+2.\n• Preciso. Calculando bem, você ataca usando Habilidade em vez de Poder.\nQualquer bônus ou penalidade que afetaria seu Poder passa a afetar sua\nHabilidade. 1PM.\n• Titânico. Você supera seus limites e seu potencial! Você tem um crítico\nautomático no ataque. 3PM.\nVocê pode comprar esta vantagem mais vezes para ter vários efeitos.\nVocê pode escolher, no momento do ataque, quais efeitos quer usar ou não.\nUm Ataque Penetrante e Perigoso, por exemplo, custa 4PM.\nPara efeitos que reduzem o custo em PM, um Ataque Especial com vários efeitos é considerado uma única vantagem.","page":49},{"name":"Base","cost":"1pt","points":1,"description":"Você tem uma base de operações, quartel-general, esconderijo, estação orbital, apartamento, quarto na casa dos pais, ou outro porto seguro\nonde pode descansar. Ou para onde pode fugir.\nAtravés de teleporte (ou outro meio que você invente), você pode alcançar sua base em qualquer situação fora de combate. A critério do mestre,\nsituações de risco ou perigo (como estar preso em uma armadilha) impedem \nvocê de alcançar a base. Você pode levar consigo um número máximo de\naliados igual a seu Poder + Habilidade. Note que esta é uma viagem de mão\núnica — você pode alcançar sua base de qualquer lugar, mas não pode voltar\npara onde estava! Para isso, terá que recorrer a outros meios.\nSua base é considerada o lugar ideal para descansar e recuperar recursos. Além disso, todos os seus testes realizados ali têm Ganho.","page":49},{"name":"Brutal","cost":"1pt cada","points":1,"description":"Ao atacar inimigos, além de causar dano, você recupera suas próprias\nenergias.\n• Vida. Para cada 3 pontos de dano causados a um oponente em combate,\nvocê recupera Ponto de Vida.\n• Mana. Para cada 3 pontos de dano causados a um oponente em combate,\nvocê recupera Ponto de Mana.\n• Derrota. Cada vez que derrota um oponente em combate, você recupera Pontos de Vida e Ponto de Mana.\nVocê pode comprar cada versão por 1pt cada, e/ou a mesma versão várias vezes. Seus efeitos se acumulam.\nEsta vantagem funciona apenas em combates de verdade, contra oponentes de verdade. Você não recupera vida ou mana atacando as paredes, e\nnem aliados voluntários com Cura ou Regeneração!","page":50},{"name":"Carismático","cost":"1pt","points":1,"description":"Você tem facilidade para fazer com que gostem de você. Recebe P+2\nem testes sociais ou que envolvam interações com outras pessoas. Este\nbônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para\nconseguir acerto crítico com 5 ou 6.","page":50},{"name":"Clone","cost":"1pt","points":1,"description":"Você pode criar cópias exatas de si mesmo, gastando 2PM por clone\ne um movimento. Sempre que você recebe um ataque bem-sucedido, não\nsofre nenhum dano, mas uma cópia desaparece. Cópias restantes duram\naté o fim da cena.\nOs clones fazem o que você quiser, mas não realizam ações próprias.\nEles podem ajudar em certas tarefas a critério do mestre (por exemplo,\ndistraindo adversários), gerando Ganho para testes.\nUm atacante com um Sentido adequado pode fazer um teste de Percepção\n(9 + Poder do copiador) para ignorar seus clones e atacar você normalmente.","page":51},{"name":"Confusão","cost":"1pt","points":1,"description":"Você é capaz de deixar os oponentes tontos.\nFaça um ataque e gaste 2PM. Se vencer a defesa do alvo, além de sofrer\ndano, ele fica confuso. Nesse estado ele não consegue escolher os alvos de\nsuas perícias ou vantagens, incluindo ele próprio: os alvos são escolhidos\nao acaso pelo mestre.\nA confusão dura até o fim da cena, ou até o alvo sofrer dano. A cada turno,\no alvo pode fazer um teste de R (9 + Poder do atacante) para cancelar o efeito.","page":51},{"name":"Cura","cost":"1pt","points":1,"description":"Você pode curar a si mesmo, ou a alguém que possa tocar.\nVocê gasta 2PM para curar 1D PV, até um limite de dados igual à Habilidade. Por exemplo, se tiver H2 você pode curar até 2D PV em um personagem, gastando 4PM.\nVocê também pode gastar 2PM para que um personagem repita um\nteste de Resistência contra algum efeito negativo duradouro (paralisia, veneno, doença, chateação...) após ter falhado.","page":51},{"name":"Defesa Especial","cost":"1pt cada","points":1,"description":"Ao receber um ataque, você pode gastar energia para ativar alguma\ntécnica de defesa, como um escudo, campo de força, bloqueio de artes\nmarciais ou cara feia. Cada efeito tem seu custo em PM:\n• Blindada. A defesa consegue acerto crítico com 5 ou 6. 1PM.\n• Bloqueio. Você defende usando Poder em vez de Resistência. Qualquer\nbônus ou penalidade que afetaria sua Resistência passa a afetar Poder. 1PM.\n• Esquiva. Você defende usando Habilidade em vez de Resistência. Qualquer bônus ou penalidade que afetaria sua Resistência passa a afetar Habilidade. 1PM.\n• Proteção. Você ajuda um aliado a se defender. Se um personagem Perto de\n1 você é atacado, você pode ativar a vantagem e usar sua defesa em vez da\ndele, com quaisquer manobras ou recursos que quiser. Se mesmo assim\no ataque causa dano, é o aliado que o recebe. 1PM por aliado. \n• Provocação. Você atrai sobre si um ataque contra um aliado, recebendo-o em\nseu lugar. Se um personagem Perto de você é atacado, você pode ativar a\nvantagem e receber esse ataque no lugar dele. Você usa sua defesa normalmente, com quaisquer manobras ou recursos que quiser. Se mesmo assim o\nataque causa dano, é você que o recebe. 1PM.\n• Reflexão. Você devolve o golpe para o oponente. Caso sua defesa seja maior\nque o ataque do adversário, ele sofre dano igual à diferença. 1PM.\n• Robusta. Quando consegue um crítico na defesa, você pode gastar 2PM\npara somar sua Resistência mais uma vez.\n• Tenaz. Aumenta a Resistência em +2 na defesa. Você pode comprar este\nefeito mais vezes (por exemplo, 4pt por uma Defesa Especial que gasta\n4PM e defende com +8). 1PM para cada +2.\n• Titânica. Você supera seus limites e seu potencial! Você tem um crítico\nautomático na defesa, e ela será considerada perfeita com qualquer resultado. 3PM.\nVocê pode comprar esta vantagem mais vezes para ter vários efeitos.\nVocê pode escolher, no momento da defesa, quais efeitos quer usar ou não.\nUma Defesa Blindada e Tenaz ×2, por exemplo, custa 3PM para ser usada.\nPara efeitos que reduzem o custo em PM, uma Defesa Especial com\nvários efeitos é considerada uma única vantagem.","page":51},{"name":"Desgaste","cost":"1pt","points":1,"description":"Mesmo depois do ataque, seu alvo sofre mais dano. Seja por veneno, ácido,\nqueimadura, radiação, fadiga, dor de barriga, rancor ou o que você inventar.\nFaça um ataque e gaste 2PM. Se vencer a defesa do alvo e causar dano,\nele vai sofrer o mesmo dano outra vez na próxima rodada.\nO dano extra pode ser evitado se o alvo gasta sua próxima ação para\nfazer isso — apagando as chamas na roupa, entoando um mantra, tomando\num antiácido ou coisa parecida.","page":52},{"name":"Devoto","cost":"1pt","points":1,"description":"Você serve a uma causa ou crença. O objeto de sua devoção fica à sua\nescolha. Uma entidade espiritual superior, uma filosofia ancestral, os ensinamentos de seu antigo mestre, uma promessa solene, uma jornada de\nvingança. Seja qual for, esse grande objetivo guia seus atos e sua vida.\nAo fazer um teste quando está seguindo ou defendendo sua devoção,\nvocê pode gastar 2PM para ter Ganho. Por exemplo, quando um devoto da\njustiça defende um injustiçado, ou quando um devoto da ecologia protege\numa área de preservação ambiental.\n“Ahn, quero ser Devoto a vencer sempre!” Acha MESMO que não pensamos nisso? Você pode recorrer à devoção até duas vezes por cena. Não\nmais de duas.","page":53},{"name":"Elo Mental","cost":"1pt","points":1,"description":"Você tem uma ligação especial com outro personagem, que pode ser\num jogador ou NPC. Ele também deve ter esta vantagem.\nVocês compartilham os seguintes poderes:\n• Enquanto conseguem ver um ao outro, vocês percebem seus pensamentos e se comunicam sem nenhum sinal aparente.\n• Em situações de perigo, você pode gastar PM de seu aliado para seu próprio uso, e vice-versa.\n• Quando você tem Ganho em certo teste, antes de rolar, pode escolher\npassar esse Ganho para o aliado. Ele deve usar o Ganho no mesmo tipo\nde teste, na primeira oportunidade.\nQuando não podem ver um ao outro, vocês sentem apenas emoções\ngerais, mas sempre sabem em que distância e direção o outro está.","page":53},{"name":"Estender","cost":"1pt","points":1,"description":"Você pode estender o efeito de suas vantagens a seus companheiros.\nAo usar uma vantagem pessoal (que afeta apenas você), pode gastar 1PM\npor turno para que ela também funcione com um aliado Perto. Por exemplo, pode usar Teleporte e levar consigo outros dois personagens gastando\nmais 2PM.\nVantagens que atacam ou prejudicam outros alvos não podem ser afetadas por Estender.","page":53},{"name":"Famoso","cost":"1pt","points":1,"description":"Você é conhecido ao redor do mundo. Quando faz um teste em situações sociais envolvendo NPCs que o reconhecem (normalmente 1-4 em\n1D), pode gastar 3PM para receber Ganho.","page":53},{"name":"Foco","cost":"1pt","points":1,"description":"Você pode se concentrar para melhorar seu desempenho — seja acumulando energia ki nas mãos, caprichando na pontaria, reunindo força de\nvontade ou pensando melhor para resolver um enigma.\nGaste 2PM e use um turno inteiro se concentrando. Você tem Perda na\ndefesa durante esse tempo e, se sofrer dano, perde a concentração e os PM gastos. No turno seguinte, seu próximo teste recebe um crítico automático (atributo somado outra vez). Você ainda pode rolar mais críticos normalmente.\nExemplo: um personagem com P2 gasta um turno preparando um argumento infalível e, no turno seguinte, faz seu teste de Influência. Para\nesse teste, ele vai somar seu Poder pelo menos duas vezes (2+2).","page":54},{"name":"Golpe Final","cost":"1pt","points":1,"description":"Você tem um golpe poderoso que\npode finalizar um alvo já enfraquecido.\nGaste 3PM e faça um ataque contra um alvo que esteja\nperto da derrota. Esse ataque é\nelevado uma escala acima.\nGrimório\n1pt ou mais\nVocê tem um grimório de magias, pergaminho monástico, caderno\nde receitas, manual de\ninstruções, revistinha de\ncifras, livro didático, aplicativo de celular ou outra\nfonte de conhecimentos\ncontendo segredos de\ncapacidades únicas.  \nEsta vantagem permite já começar com uma ou mais técnicas (veja em\nRecompensas). Cada ponto de Grimório vale 10XP para adquirir truques ou\ntécnicas comuns (mas não lendárias). As técnicas escolhidas precisam receber\nautorização do mestre.","page":54},{"name":"Ilusão","cost":"2pt","points":2,"description":"Você consegue criar ilusões. Uma ilusão é uma imagem tridimensional. Não tem massa ou substância, não pode ser tocada, nem sofrer ou\ncausar dano (qualquer toque ou ataque apenas a atravessa). Mas engana os\noutros sentidos como se fosse real.\nEm situações normais, não se pode perceber que algo é uma ilusão. Caso\nse tente interagir com ela (talvez tocando-a), ou caso seja algo muito estranho\ne fora de lugar, um personagem pode fazer um teste de Percepção. A meta\npadrão para esse teste é 9 + quantidade de PM gastos na ilusão, mas o mestre\npode mudá-la caso a ilusão seja muito convincente (ou muito absurda). A\nvantagem Sentido também ajuda a evitar ser enganado por uma ilusão.\nO custo para criar uma ilusão depende de seu tamanho.\n1PM. Algo do tamanho de um livro ou menor.\n3PM. Do tamanho de uma pessoa ou menor.\n5PM. Tamanho de um caminhão.\n8PM. Tamanho de um prédio.\nDefina com o mestre custos para ilusões ainda maiores ou de tamanhos intermediários. Uma ilusão pode ser criada em qualquer ponto que\nvocê consiga ver. Criar uma ilusão gasta uma ação. Depois de criadas, ilusões ficam imóveis. Mover uma ilusão por uma rodada inteira exige que o\npersonagem gaste um movimento em seu turno (a ilusão só se move depois\nque você gastar seu movimento).\nVocê pode ter mais de uma ilusão ativa por vez (mas mover cada uma\nusará um movimento). Uma ilusão se mantém por quanto tempo você quiser, mas você não pode recuperar os PM usados para criá-la até dissipá-la.\nA ilusão também desaparece caso você esteja derrotado.","page":55},{"name":"Imitar","cost":"1pt","points":1,"description":"Você consegue imitar uma das vantagens de seu alvo.\nQuando alguém usa uma vantagem em sua presença (Longe ou menos), você pode tentar imitar essa vantagem. Faça um teste de Percepção\n(9): se tiver sucesso, você pode gastar 3PM para adquirir a mesma vantagem até o fim da cena.\nVocê também pode imitar uma vantagem se souber, com antecedência, que o alvo a tem. Você pode já ter visto ele usar, ou descobrir por ser\nTelepata, ou já saber disso porque ele é Famoso ou Infame, ou com um\nteste de perícia (Saber, Manha, Percepção, 12). Neste caso, além de gastar\nPM, você precisa usar uma ação.\nApenas uma vantagem pode ser imitada por vez. Se conseguir imitar\noutra vantagem, a primeira será liberada.","page":55},{"name":"Imortal","cost":"1pt","points":1,"description":"Você pode ser derrotado, e até tirado de cena por algum tempo, mas\nnão morto. Você é como o herói espancado, decapitado, feito em mil pedacinhos e jogado no mar — para então ressurgir cambaleando em alguma\npraia mais tarde. Como? É um mistério!\nEm testes de morte, você nunca tem um resultado pior que inconsciente.","page":56},{"name":"Improviso","cost":"2pt","points":2,"description":"Na hora do aperto, você consegue usar capacidades que não deveria ter!\nVocê lembra de alguma lição esquecida, baixa aplicativos da nuvem, recebe\niluminação dos deuses, ou é um impostor tão bom que engana até a si mesmo.\nVocê pode gastar 3PM para aprender, na hora, uma perícia que não\ntenha. Você pode usar essa perícia até o fim da cena.\nVocê pode improvisar apenas uma perícia por vez. Se improvisar uma\nnova, vai esquecer a anterior.","page":56},{"name":"Imune","cost":"1pt cada","points":1,"description":"Você é imune a algo que normalmente afeta outras criaturas.\n• Abiótico. Você não tem necessidades biológicas básicas, como comer, beber,\nrespirar ou dormir (mas ainda precisa de descanso para recuperar recursos).\n• Anfíbio. Você respira e se move normalmente embaixo d’água, sem ser\nafetado por terreno difícil, nem sofrer pressão submarina.\n• Doenças. Você é imune a doenças naturais ou mágicas.\n• Resiliente. Você não se cansa por realizar esforço intenso por muito tempo. Além disso, qualquer lugar de descanso é considerado ideal.\n• Sem Mente. Você é imune a magias e efeitos que afetam a mente, como telepatia e outros efeitos mentais que só funcionam em criaturas vivas.","page":56},{"name":"Incorpóreo","cost":"2pt","points":2,"description":"Você pode se tornar intangível. Imaterial, como um fantasma.\nAo gastar uma ação e 5PM, você pode atravessar portas e outras barreiras físicas, e também será imune a qualquer dano por combate violento\n— exceto Magia ou ataques de outros seres Incorpóreos. Da mesma forma,\nvocê também não pode interagir fisicamente com objetos materiais e nem\ncausar dano, exceto com Magia.\nEste efeito dura até o fim da cena, ou até você decidir encerrá-lo, ou\nser derrotado.\nMesmo intangível, você pode sofrer dano mental/emocional; palavras\nainda machucam!","page":57},{"name":"Inimigo","cost":"1-2pt cada","points":1,"description":"Você é treinado em enfrentar certo tipo de criatura, conhecendo seus\npoderes e fraquezas.\nEscolha um grupo entre os seguintes:\n• Humanos.\n• Humanoides. Anfíbios, anões, centauros, elfos, goblins, hynne, kemono...\n• Construtos. Androides, ciborgues, golens, mechas...\n• Espíritos. Abissais, celestiais, dahllan, fadas, fantasmas, osteon, qareen,\nvampiros...\n• Monstros. Aberrantes, aliens, kallyanach, kaiju...\nEm todos os testes contra criaturas do tipo escolhido, você consegue\nacerto crítico com 5 ou 6.\nO mestre tem a palavra final sobre quem pertence a cada grupo. Alguns arquétipos, como medusas, minotauros, ogros e sauroides, podem ser\nhumanoides e também monstros.\nO custo normal da vantagem é 1 ponto para cada grupo, mas aumenta\npara 2pt se o grupo ou criatura existe em grande abundância na campanha\n(por exemplo, aliens em Guerra da Galáxia, ou humanos em praticamente\nqualquer lugar).\nEm vez de um grupo, você também pode escolher um único arquétipo\n(exceto humano), ou mesmo um único personagem. Contra ele, todos os\nseus testes também recebem Ganho.","page":57},{"name":"Inofensivo","cost":"1pt","points":1,"description":"Você não parece perigoso, por alguma razão. Talvez pareça pequeno,\nfraco ou covarde. Talvez seja um bichinho fofo, um vovô barrigudo, uma\nmenininha de trancinhas... você escolhe o motivo.\nEm combate, por surpreender seu oponente, você ganha uma ação ex1 tra antes do primeiro turno. Sua aparência inofensiva não funciona com alguém que viu você lutar antes, nem funciona duas vezes com a mesma pessoa. Mesmo contra estes, no entanto, você tem Ganho ao rolar iniciativa. \nVocê também pode gastar 3PM para Ganho em testes para tentar enganar alguém ou passar despercebido.","page":57},{"name":"Instrutor","cost":"1pt","points":1,"description":"Você sabe ensinar ou inspirar outra pessoa a ser bem-sucedida em\nalgo. Você passa o conhecimento telepaticamente, entoa uma canção sublime, ameaça fazer comer sua gororoba, promete algo irresistível, sopra\numas dicas ou algo assim.\nUsando uma ação e gastando 2PM, você permite a um aliado fazer um\nteste como se ele tivesse uma perícia que você tem. Caso o aliado já tenha a\nperícia, você pode permitir que ele use uma vantagem que você possua e a\nafete, como Maestria ou Mentor. Outros custos de uso da vantagem (como\nPM) devem ser pagos pelo aliado.\nO teste deve ser feito até o próximo turno do aliado; não é possível\n“guardar” usos para depois.","page":58},{"name":"Inventário","cost":"1-3pt","points":1,"description":"Você carrega itens consumíveis consigo para usar em momentos de\nnecessidade. Quantos itens o inventário contém, depende do custo:\n0pt Sem inventário. Mesmo sem esta vantagem você ainda pode carregar dois itens comuns.\n1pt Pequeno. 3 itens comuns e 1 incomum.\n2pt Grande. 5 itens comuns e 2 incomuns.\n3pt Supremo. 5 itens comuns, 4 incomuns e 1 raro.\nVocê pode trocar três itens de um nível inferior por um superior, e vice-versa. Por exemplo, três itens comuns por um incomum. Não é preciso\ndecidir quais itens o Inventário carrega; você escolhe no momento do uso,\nreduzindo o total disponível.\nO Inventário é recarregado no início de cada aventura, e outras vezes\nao longo da sessão, a critério do mestre. Mais detalhes sobre Inventário e\nitens consumíveis em “Recompensas”.","page":58},{"name":"Invisível","cost":"1-2pt","points":1,"description":"Você pode usar uma ação e gastar 3PM para ficar invisível. Quando está\nassim, você tem Ganho em testes para se esconder, e todos os ataques contra você têm Perda.\n1pt Sua invisibilidade é interrompida quando você faz um ataque (ou\nqualquer atitude hostil), seja bem-sucedido ou não, e quando sofre qualquer dano.\n2pt Sua invisibilidade é interrompida apenas quando você sofre dano.\nVocê também pode desfazer sua invisibilidade sempre que quiser, sem\ngastar ação ou movimento.\nUm inimigo com Sentido pode fazer um teste resistido de Percepção\ncontra seu teste para se esconder, para tentar encontrá-lo mesmo estando\ninvisível e anular a Perda durante uma rodada.","page":59},{"name":"Irresistível","cost":"1pt","points":1,"description":"Seus poderes são mais difíceis de resistir.\nQuando um alvo faz um teste para evitar ser afetado por uma de suas\nvantagens (como Anulação, Confusão, Ilusão, Paralisia ou Punição, por\nexemplo), você pode gastar 2PM ou mais. Para cada 2PM gastos, a meta do\nteste para resistir aumenta um passo (+3).\nVocê deve anunciar o uso desta vantagem (e quanto vai gastar) antes\nque o alvo faça seu teste.","page":59},{"name":"Maestria","cost":"1pt cada","points":1,"description":"Escolha uma perícia que você tem. Em testes dessa perícia, você pode\ngastar 1PM para ter um acerto crítico com 5 ou 6.\nVocê pode comprar esta vantagem mais vezes para outras perícias.","page":60},{"name":"+Mana","cost":"1pt cada","points":1,"description":"Você tem mais Pontos de Mana, além daqueles oferecidos por sua\nHabilidade.\nCada vez que compra esta vantagem você recebe +10PM. Então, se tem\nH4 (20PM) e paga 1 ponto por +Mana, agora tem 30PM.\nVocê pode comprar esta vantagem várias vezes, para novos aumentos\nde +10PM.","page":60},{"name":"+Membros","cost":"2pt","points":2,"description":"Você tem um ou mais membros extras, como um segundo par de braços, cauda preênsil, tentáculos, cabelos de serpente, mandíbula voadora,\ndrone com garra... Enfim, qualquer apêndice que consiga fazer coisas.\nVocê pode gastar 3PM para fazer uma segunda ação em seu turno. Essa\nação pode ser de combate ou não: o membro extra pode folhear um livro\npara consulta, segurar uma lupa para rastrear, fazer malabares para distrair — ou seja, ajudar de formas que não necessariamente envolvem agarrar ou socar. Em alguns casos, a ação extra pode conceder um Ganho à sua\noutra ação, como se estivesse prestando auxílio a si mesmo.  \nVocê compra esta vantagem apenas uma vez para qualquer quantidade\nde membros: o efeito é o mesmo. Você não pode fazer mais de uma ação\nextra por rodada.","page":60},{"name":"Mentor","cost":"1pt cada","points":1,"description":"Escolha uma perícia que você tem. Você aprendeu essa perícia com\num mestre, que ensinou diversos truques e técnicas. Mesmo que não tenha\nmais contato com ele, as lições continuam presentes nas suas lembranças.\nUma vez por cena, você pode lembrar de um ensinamento e ter Ganho\nem um teste da perícia escolhida. Além disso, técnicas que tenham a perícia do Mentor como pré-requisito gastam –1PM (mínimo 1PM).\nVocê pode comprar esta vantagem mais vezes para outras perícias.","page":61},{"name":"Obstinado","cost":"1pt","points":1,"description":"Você é capaz de consumir seu próprio corpo, mente e alma para perseverar sobre as adversidades e alcançar o impossível.\nVocê pode gastar 1 ponto de P, H ou R (à sua escolha) como se fosse Ponto de Ação.\nQuando um atributo é reduzido, o limite máximo do recurso correspondente também diminui de acordo. Pontos de atributo podem ser recuperados\napenas com descanso: 8 horas de sono restauram 1 ponto em cada atributo.","page":61},{"name":"Paralisia","cost":"1pt","points":1,"description":"Você tem um meio para impedir o alvo de agir. Congelando, prendendo\ncom uma rede, atingindo seus pontos de pressão, fazendo uma pergunta\nsem resposta, dizendo algo tão vergonhoso que ele trava... você escolhe.\nFaça um ataque e gaste 2PM. Se vencer a defesa do alvo, em vez de sofrer dano, ele fica imobilizado. Um alvo paralisado fica indefeso.\nA Paralisia dura até o fim da cena, ou até o alvo sofrer dano. A cada turno,\no alvo pode fazer um teste de R (6 + Poder do atacante) para cancelar o efeito.","page":61},{"name":"Patrono","cost":"1pt","points":1,"description":"Você serve a uma pessoa, organização ou instituição com mais recursos que você.\nQuando faz um teste de compra para algo que ajude na missão para o Patrono, você pode gastar 1PM para receber um Ganho. Você também recebe\num item consumível extra de cada raridade já disponível em seu Inventário.","page":61},{"name":"Punição","cost":"1-2pt","points":1,"description":"Você pode impor um efeito negativo a um alvo. Fazer com que receba uma\nMaldição, ou torná-lo Monstruoso, ou Lento, ou outra coisa divertida (para você).\nAo comprar esta vantagem, escolha também uma desvantagem de\n1 mesmo valor.\nFaça um ataque e gaste 2PM. Se vencer a defesa do alvo, em vez de sofrer dano, ele sofre os efeitos da desvantagem escolhida. \nA Punição dura até o fim da cena, ou até o alvo sofrer dano. A cada turno,\no alvo pode fazer um teste de R (6 + Poder do atacante) para cancelar o efeito.\nVocê pode comprar Punição mais vezes para outras desvantagens, mas\nsó pode impor uma por vez em cada adversário.","page":61},{"name":"Regeneração","cost":"1-2pt","points":1,"description":"Você é muito, muito chato de derrotar.\n1pt No início do seu turno, você recupera 1PV.\n2pt No início do seu turno, você recupera 3PV.\nAlém disso, quando faz um teste de morte, você nunca tem um resultado pior que Inconsciente. Neste caso, você desperta no final da cena e\nvolta a regenerar.\nAh sim, cuidado com oponentes que tenham Anulação. Hehe!","page":62},{"name":"Resoluto","cost":"1pt","points":1,"description":"Sua determinação é inabalável. Você recebe R+2 em testes envolvendo\nforça de vontade, como perceber fraudes, resistir a encantos e ilusões (isso\ninclui testes de morte). Este bônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para\nconseguir acerto crítico com 5 ou 6.","page":62},{"name":"Riqueza","cost":"2, 4 ou 6pt","points":2,"description":"Burguês safado! Você tem recursos financeiros de escala superior. Quando faz testes de compra, pode gastar 2PM para subir sua escala em um nível.\nVocê pode gastar mais pontos para ser ainda mais rico, e poder gastar\nmais PM para receber um bônus maior.\n2pt Sugoi. Seu teste de compra aumenta um nível (Ganho e um crítico\nadicional). 2PM\n4pt Kiodai. Aumenta até dois níveis (dois Ganhos e dois críticos adicionais). 4PM\n6pt Kami — a riqueza de um deus! Aumenta até três níveis (três Ganhos\ne três críticos adicionais). 6PM\nEm níveis altos, você ainda pode escolher gastar menos PM para menos escalas.\nPM gastos nesta vantagem não podem ser recuperados até o fim da cena.","page":62},{"name":"Sentido","cost":"1pt cada","points":1,"description":"Você tem um sentido melhor, ou diferente. Pode fazer testes de Percepção em situações impossíveis para outros, como ver no escuro ou perceber\ncoisas invisíveis.\n• Aguçado. Escolha entre audição, faro, paladar, tato ou visão. Em testes de\nPercepção usando esse sentido, você sempre tem Ganho.  \n• Infravisão. Você percebe seres de sangue quente e também enxerga no\nescuro, exceto perto de calor intenso (chamas, grandes motores, disparos de armas...).\n• Intuição. Você percebe intenções ocultas de outras pessoas, como quando estão mentindo, escondendo suas emoções, guardando segredos, pretendendo atacá-lo ou traí-lo.\n• Radar. Você percebe tudo em volta, mesmo de costas ou no escuro. Você\ntambém pode “ouvir” rádio, tevê, celular, wi-fi e outros.\n• Raio X. Você pode ver através de portas e paredes, exceto quando feitos\nde materiais muito densos (como metal) ou mágicos.\nDetectar algo exige um teste de Percepção: quanto melhor o resultado, mais você sabe sobre a direção, proximidade e localização daquilo\nque quer encontrar.\nSempre que uma regra fala sobre algo que você consiga “ver” (como\nTelepata e Teleporte), isso também vale para algo que possa perceber com\num Sentido.\nVocê pode inventar um sentido especial único, como poder detectar um\ntipo de material, criatura, energia ou objeto específico. Por exemplo, poderia\nter Sentido de Ki, de Animais, de Perigo, de Ouro ou algo assim. No entanto,\nvocê não pode inventar um sentido melhor que qualquer outro na lista.\nCada vez que comprar esta vantagem, pode escolher algo diferente (exceto coisas proibidas pelo mestre).","page":62},{"name":"Telepata","cost":"1pt","points":1,"description":"Você pode ler ou sentir os pensamentos de outras pessoas. Pode usar\num movimento e gastar 1PM para:\n• Ter Ganho em um teste de perícia social relacionado a um personagem\nna cena.\n• Fazer um teste de Habilidade (9) para descobrir algo sobre um personagem\nna cena (como um valor de atributo, uma vantagem ou desvantagem).\n• Prever os movimentos de um adversário em combate; Ganho em defesa\ncontra ele até a próxima rodada.\nVocê só pode usar telepatia em criaturas vivas e que consiga ver.","page":63},{"name":"Teleporte","cost":"1pt","points":1,"description":"Você pode usar um movimento e gastar PM para se deslocar até qualquer lugar que possa ver.\nCada movimento que você substitui por Teleporte custa 1PM. Por\nexemplo, ir de Perto para Muito Longe requer dois movimentos; um teleporte para essa distância custa 2PM. Teleporte não é afetado por terreno\ndifícil; basta ser capaz de enxergar o ponto que deseja alcançar.\nSe o local de destino é observado por meios indiretos (por exemplo,\npela tevê), o mestre pode decretar que é impossível, ou exigir um teste, ou\ngasto muito maior de PM.\nVocê também pode gastar 3PM para ter Ganho de defesa contra um ataque.","page":64},{"name":"Torcida","cost":"1pt","points":1,"description":"Você está acostumado a agir na presença de muita gente aplaudindo\ne motivando. Quando uma torcida está presente, você tem um Ganho por\nrodada, em qualquer teste que quiser.\nNo início de cada cena, role 1D. Com um resultado 1, existe algum tipo\nde torcida favorável a você — desde transeuntes comuns a algum bicho\ncurioso. O mestre pode julgar situações especiais e dispensar a rolagem:\nnão haverá torcida nenhuma por você em uma masmorra desolada ou território inimigo, mas quase sempre haverá em um estádio ou torneio.\nNa falta de uma torcida, um aliado pode substituí-la usando uma ação\npara motivá-lo. Você recebe o benefício em seu próximo turno.","page":64},{"name":"Transformação","cost":"1-2pt cada","points":1,"description":"Você pode mudar de forma e poderes. Não seria um jogo de anime/\ntokusatsu sem isso, certo?\nFaça outro personagem, com o mesmo número de pontos. Ele pode ser\ndiferente em tudo — pode até ter outra personalidade, memórias e perícias\n—, exceto que também deve ter esta vantagem, no mesmo valor.\n1pt Se a nova forma tem desvantagens diferentes, todas as formas sofrem os efeitos de todas as desvantagens combinadas.\n2pt Cada forma sofre apenas os efeitos de suas próprias desvantagens.\nMudar de forma exige uma ação. A transformação restaura seus PM\ne PV, ajustados conforme os atributos da nova forma. Você pode se transformar apenas uma vez por sessão, ou pagar 1PA por cada transformação\nextra além da primeira.","page":64},{"name":"+Vida","cost":"1pt cada","points":1,"description":"Você tem mais Pontos de Vida, além daqueles oferecidos por sua Resistência.\nCada vez que compra esta vantagem você recebe +10PV. Então, se tem\nR2 (10PV) e paga 1 ponto por +Vida, agora tem 20PV.\nVocê pode comprar esta vantagem várias vezes, para novos aumentos\nde +10PV.","page":65},{"name":"Vigoroso","cost":"1pt","points":1,"description":"Você é robusto como um cavalo. Recebe R+2 em testes envolvendo saúde física, como resistir a fadiga, doenças e venenos (isso inclui testes de\nmorte). Este bônus é incluído em acertos críticos.\nVocê também pode gastar 2PM antes de fazer um desses testes para\nconseguir acerto crítico com 5 ou 6.","page":65},
{"name":"Adaptador","cost":"1pt","points":1,"description":"Você tem facilidade para aprender novas técnicas e improvisar armas e golpes. Carrega um monte de armas, ou sabe improvisar, ou tem muita sorte. Pagando 1PM, você pode trocar o seu tipo de dano sem causar Perda. Você mantém o novo tipo até trocá-lo novamente (pagando outro PM) ou voltar ao seu tipo de dano original (sem custo).","page":176},
{"name":"+Resistência","cost":"1pt cada","points":1,"description":"Escolha dois tipos de dano. Contra eles, em testes de defesa, sua Resistência é somada uma segunda vez. Você pode comprar esta vantagem várias vezes, para mais tipos.","page":176},
{"name":"Invulnerável","cost":"1pt cada","points":1,"description":"Escolha um tipo de dano. Você é imune a esse dano, é impossível feri-lo dessa maneira. Você pode comprar esta vantagem várias vezes, para mais tipos.","page":176},
{"name":"Calma Inabalável","cost":"2pt","points":2,"description":"Nada é capaz de tirar sua paz interior. Você é imune aos efeitos do Dado do Estresse, incluindo efeitos positivos (não recebe bônus em testes, mas não sofre aumento de custo de PM).","page":85},
{"name":"Fonte de Coragem","cost":"2pt","points":2,"description":"Você emana uma aura de confiança, que inspira seus aliados contra o medo. Uma vez por cena, você pode gastar 3PM para reduzir o número do Dado do Medo em 1.","page":85},
{"name":"Companheiro","cost":"1pt","points":1,"description":"Um Companheiro é um passo além de um Ajudante: mais que um bônus momentâneo, ele tem uma ficha de personagem completa, podendo ajudar o personagem de formas muito mais diversas.\n\nO Companheiro tem a mesma pontuação do personagem a quem pertence — um personagem de 10 pontos terá um Companheiro com 10 pontos. Sempre que o personagem ganha um ponto gastando XP, o Companheiro também ganha; não se pode transferir pontos de um para o outro. Um Companheiro também pertence à mesma escala do personagem: personagens de escala inferior são apenas Ajudantes e, de escala superior, Veículos. Um Companheiro não pode ter outro Companheiro, nem qualquer vantagem ou habilidade que conceda outra ficha ao jogador — sem criaturas infinitas hoje!\n\nUm Companheiro age apenas sob ordens do personagem; em seu turno, você divide seus próprios movimentos e ações entre você e seu Companheiro. Por fim, um Companheiro não tem PA ou PM, apenas PV — você gasta seus próprios recursos para ativar vantagens, técnicas e conceder benefícios a ele.","page":127}],"desvantagens":[{"name":"Assombrado","cost":"–1 ou –2pt","points":-1,"description":"Você é assombrado por um espírito, sentimento ruim, lembrança\namarga ou outra coisa que tira a sua concentração.\n–1pt Ao entrar em uma situação em que a assombração poderia afetá-\n-lo — como um combate ou cena de ação —, role um dado. Com um resultado 1, todos os seus testes têm Perda até o fim da cena.\n–2pt A assombração aparece com qualquer resultado ímpar.","page":67},{"name":"Fúria","cost":"–2pt","points":-2,"description":"Sempre que você sofre dano ou fica irritado por qualquer motivo (a\ncritério do mestre), deve fazer um teste de Resistência (9 ou igual ao dano,\no que for maior). Se falhar, você entra em frenesi de batalha e ataca imediatamente o alvo de sua irritação. Na falta deste, ataca o coitado que estiver mais perto.\nDurante a Fúria todos os seus testes que não sejam de ataque têm
