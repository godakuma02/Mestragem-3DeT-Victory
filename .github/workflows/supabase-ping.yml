name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # O '|| true' no final impede que o GitHub marque como falha se o curl retornar erro 404
          curl -X GET "$SUPABASE_URL/rest/v1/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            --fail --silent --show-error || true
